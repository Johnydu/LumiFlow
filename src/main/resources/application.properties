# =====================================================
# Configuracao comum a todos os perfis
# =====================================================

# Perfil padrao: dev (usa application-dev.properties, que e ignorado pelo git e existe so na
# maquina de cada desenvolvedor). NAO trocar o padrao para prod: quebraria o ambiente local.
# Em producao o perfil e forcado pelo Dockerfile (-Dspring.profiles.active=prod); fora do Docker,
# defina SPRING_PROFILES_ACTIVE=prod. A variavel de ambiente tem precedencia sobre esta linha.
spring.profiles.active=dev

# Evita N+1: colecoes/associacoes LAZY sao carregadas em lotes de 50 ids (vale para dev e prod).
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# open-in-view permanece LIGADO (definido nos perfis): os templates Thymeleaf navegam entidades LAZY.
