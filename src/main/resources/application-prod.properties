spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Não gerenciar schema em produção
spring.jpa.hibernate.ddl-auto=validate

# Desabilitar SQL logging em produção (performance)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=true

# Ativar Flyway para migrações de banco
spring.flyway.enabled=true

# Cache habilitado para templates Thymeleaf
spring.thymeleaf.cache=true

# Logging em produção - apenas WARN e ERROR
logging.level.root=WARN
logging.level.br.com.lumiflow=INFO
logging.level.org.springframework.boot=WARN
logging.level.org.springframework.security=WARN

# Segurança HTTP
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

# Compression de respostas
server.compression.enabled=true
server.compression.min-response-size=1024

# Locale
spring.web.locale=pt_BR
spring.web.locale-resolver=fixed

# Cache de recursos estáticos por 1 dia (em segundos)
spring.web.resources.cache.period=86400
spring.web.resources.cache.cachecontrol.max-age=86400

