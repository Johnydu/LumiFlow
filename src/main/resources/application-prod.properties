spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Não gerenciar schema em produção
spring.jpa.hibernate.ddl-auto=validate

# Desabilitar SQL logging em produção (performance)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=true

# Ativar Flyway para migrações de banco
spring.flyway.enabled=true

# Cache habilitado para templates Thymeleaf
spring.thymeleaf.cache=true

# Logging em produção - apenas WARN e ERROR
logging.level.root=WARN
logging.level.br.com.lumiflow=INFO
logging.level.org.springframework.boot=WARN
logging.level.org.springframework.security=WARN

# Segurança HTTP
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

# Compression de respostas
server.compression.enabled=true
server.compression.min-response-size=1024

# Locale
spring.web.locale=pt_BR
spring.web.locale-resolver=fixed

# Cache de recursos estáticos por 1 dia (em segundos)
spring.web.resources.cache.period=86400
spring.web.resources.cache.cachecontrol.max-age=86400

server.forward-headers-strategy=native
server.servlet.session.timeout=30m
lumiflow.security.login.max-tentativas=5
lumiflow.security.login.bloqueio-minutos=15
lumiflow.security.login.ip-max-falhas=30
lumiflow.security.login.ip-janela-minutos=15
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# IP real do cliente atrás do proxy do Railway (usado no limite de falhas de login por IP).
# O Tomcat só confia no X-Forwarded-For vindo de proxies "internos"; além das faixas privadas
# padrão, inclui 100.64.0.0/10 (CGNAT) e fc00::/7, usadas na rede interna da plataforma.
server.tomcat.remoteip.internal-proxies=10\\.\\d+\\.\\d+\\.\\d+|192\\.168\\.\\d+\\.\\d+|169\\.254\\.\\d+\\.\\d+|127\\.\\d+\\.\\d+\\.\\d+|172\\.(1[6-9]|2\\d|3[0-1])\\.\\d+\\.\\d+|100\\.(6[4-9]|[7-9]\\d|1[01]\\d|12[0-7])\\.\\d+\\.\\d+|0:0:0:0:0:0:0:1|::1|f[cd][0-9a-f]{2}:[0-9a-f:]+
