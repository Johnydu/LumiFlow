<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Aviso do Sistema - LumiFlow</title>
    <link rel="stylesheet" th:href="@{/css/variables.css}">
    <link rel="stylesheet" th:href="@{/css/globals.css}">
</head>
<body>
<div th:replace="~{fragments/messages :: alerts}"></div>

<div class="error-container">
    <div style="font-size: 3rem; margin-bottom: 0.5rem; color: var(--color-warning, #f59e0b);">⚠</div>
    <h2>Aviso de Validação</h2>
    <p th:text="${message}">Ocorreu uma regra de negócio que impediu a conclusão da operação.</p>
    <a href="javascript:history.back()" class="btn-voltar">Voltar</a>
</div>

</body>
</html>
