<!DOCTYPE html>
<html lang="pt-BR" th:lang="${#locale.toLanguageTag()}" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/theme :: init}"></th:block>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Não Encontrada - LumiFlow</title>
    <link rel="stylesheet" th:href="@{/css/variables.css}">
    <link rel="stylesheet" th:href="@{/css/globals.css}">
    <link rel="stylesheet" th:href="@{/css/error.css}">
</head>
<body>
<div th:replace="~{fragments/messages :: alerts}"></div>

<div class="error-container">
    <h1>404</h1>
    <h2>Página não encontrada</h2>
    <p>A página que você tentou acessar não existe, foi removida ou o endereço está incorreto.</p>
    <a th:href="@{/dashboard}" class="btn-voltar">Voltar ao Dashboard</a>
</div>

</body>
</html>
