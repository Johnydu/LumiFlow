
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" th:href="@{/css/variables.css}">
<link rel="stylesheet" th:href="@{/css/globals.css}">
<link rel="stylesheet" th:href="@{/css/sidebar.css}">
<link rel="stylesheet" th:href="@{/css/topbar.css}">
<link rel="stylesheet" th:href="@{/css/components/buttons.css}">
<link rel="stylesheet" th:href="@{/css/components/forms.css}">
<link rel="stylesheet" th:href="@{/css/components/tables.css}">
<link rel="stylesheet" th:href="@{/css/components/cards.css}">
<link rel="stylesheet" th:href="@{/css/components/badges.css}">
<link rel="stylesheet" th:href="@{/css/components/status.css}">
<link rel="stylesheet" th:href="@{/css/components/alerts.css}">
<link rel="stylesheet" th:href="@{/css/pages/dashboard.css}">
<link rel="stylesheet" th:href="@{/css/pages/login.css}">
<link rel="stylesheet" th:href="@{/css/pages/usuarios.css}">
<link rel="stylesheet" th:href="@{/css/pages/maquinas.css}">
<link rel="stylesheet" th:href="@{/css/pages/produtos.css}">
<link rel="stylesheet" th:href="@{/css/pages/setores.css}">
<link rel="stylesheet" th:href="@{/css/pages/ordens.css}">
<link rel="stylesheet" th:href="@{/css/pages/relatorio.css}">
<link rel="stylesheet" th:href="@{/css/pages/vidracaria.css}">
<link rel="stylesheet" th:href="@{/css/pages/novaordem.css}">
<link rel="stylesheet" th:href="@{/css/pages/listaordem.css}">
<link rel="stylesheet" th:href="@{/css/utils.css}">
<link rel="stylesheet" th:href="@{/css/responsive.css}"/>
</head>
<body class="page-produto-cadastroproduto">

<aside class="sidebar">
  <div class="logo">LumiFlow</div>
  <div class="menu-title">GERAL</div>
  <div class="menu">
    <div class="menu-item">Dashboard</div>
    <div class="menu-item">Ordens</div>
    <div class="menu-item">Lançamentos</div>
    <div class="menu-item">Relatórios</div>
  </div>
  <div class="menu-title">CADASTROS</div>
  <div class="menu">
    <div class="menu-item active">Produtos</div>
    <div class="menu-item">Setores</div>
    <div class="menu-item">Máquinas</div>
    <div class="menu-item">Roteiros</div>
    <div class="menu-item">Usuários</div>
  </div>
  <div class="menu-title">SISTEMA</div>
  <div class="menu"><div class="menu-item">Configurações</div></div>
  <div class="profile">
    <div class="avatar">JE</div>
    <div><div class="pname">Johny</div><div class="prole">Suporte</div></div>
  </div>
</aside>

<main class="main">
  <div class="topbar">
    <button class="btn-back">← Voltar</button>
    <span class="topbar-title">Cadastro de Produto</span>
  </div>

  <div class="content">

    <!-- ABAS -->
    <div class="tabs">
      <button class="tab active" onclick="showTab('dados',this)">Dados do Produto</button>
      <button class="tab" onclick="showTab('roteiro',this)">Roteiro de Produção</button>
    </div>

    <!-- ABA DADOS -->
    <div id="tab-dados">
      <div class="form-card">
        <div class="card-title">Informações do produto</div>
        <div class="form-grid">
          <div class="field">
            <label>Nome <span>*</span></label>
            <input type="text" value="Arandela 12W"/>
          </div>
          <div class="field">
            <label>Código</label>
            <input type="text" placeholder="Ex: ARD-12W"/>
          </div>
        </div>
        <div class="field">
          <label>Descrição</label>
          <textarea>Arandela de alumínio 12W, acabamento escovado.</textarea>
        </div>
      </div>
      <div class="form-actions">
        <button class="btn-cancel">Cancelar</button>
        <button class="btn-submit">Salvar Produto</button>
      </div>
    </div>

    <!-- ABA ROTEIRO -->
    <div id="tab-roteiro" style="display:none">
      <div class="form-card">
        <div class="card-title">Defina os setores e a sequência</div>

        <div class="setores-grid" id="setores">
          <label class="setor-check checked" onclick="toggle(this,'Corte')">
            <input type="checkbox" checked/>
            <div class="setor-info">
              <div class="setor-nome">Corte / Preparação</div>
              <div class="setor-maq">Laser</div>
            </div>
            <span class="setor-seq" id="seq-Corte">1º</span>
          </label>
          <label class="setor-check checked" onclick="toggle(this,'Dobra')">
            <input type="checkbox" checked/>
            <div class="setor-info">
              <div class="setor-nome">Dobra</div>
              <div class="setor-maq">Argus 1, Argus 2, Manual 1, Manual 2</div>
            </div>
            <span class="setor-seq" id="seq-Dobra">2º</span>
          </label>
          <label class="setor-check checked" onclick="toggle(this,'Solda')">
            <input type="checkbox" checked/>
            <div class="setor-info">
              <div class="setor-nome">União / Solda</div>
              <div class="setor-maq">Solda Alumínio</div>
            </div>
            <span class="setor-seq" id="seq-Solda">3º</span>
          </label>
          <label class="setor-check" onclick="toggle(this,'Lixa')">
            <input type="checkbox"/>
            <div class="setor-info">
              <div class="setor-nome">Lixa</div>
              <div class="setor-maq">—</div>
            </div>
            <span class="setor-seq" id="seq-Lixa" style="display:none">—</span>
          </label>
          <label class="setor-check checked" onclick="toggle(this,'Pintura')">
            <input type="checkbox" checked/>
            <div class="setor-info">
              <div class="setor-nome">Pintura</div>
              <div class="setor-maq">Cabine Preta, Marrom, Branca, Champagne</div>
            </div>
            <span class="setor-seq" id="seq-Pintura">4º</span>
          </label>
          <label class="setor-check checked" onclick="toggle(this,'Colagem')">
            <input type="checkbox" checked/>
            <div class="setor-info">
              <div class="setor-nome">Colagem</div>
              <div class="setor-maq">Mesa 1</div>
            </div>
            <span class="setor-seq" id="seq-Colagem">5º</span>
          </label>
          <label class="setor-check checked" onclick="toggle(this,'Acabamento')">
            <input type="checkbox" checked/>
            <div class="setor-info">
              <div class="setor-nome">Acabamento Final</div>
              <div class="setor-maq">Mesa 1, Mesa 2</div>
            </div>
            <span class="setor-seq" id="seq-Acabamento">6º</span>
          </label>
          <label class="setor-check" onclick="toggle(this,'Montagem2')">
            <input type="checkbox"/>
            <div class="setor-info">
              <div class="setor-nome">Montagem 2</div>
              <div class="setor-maq">Cola + Montagem + Embalagem</div>
            </div>
            <span class="setor-seq" id="seq-Montagem2" style="display:none">—</span>
          </label>
        </div>

        <!-- PREVIEW -->
        <div class="preview-box">
          <div class="preview-label">Prévia do roteiro</div>
          <div class="preview-pills" id="preview-pills">
            <span class="r-pill">Corte</span>
            <span class="r-arr">›</span>
            <span class="r-pill">Dobra</span>
            <span class="r-arr">›</span>
            <span class="r-pill">Solda</span>
            <span class="r-arr">›</span>
            <span class="r-pill">Pintura</span>
            <span class="r-arr">›</span>
            <span class="r-pill">Colagem</span>
            <span class="r-arr">›</span>
            <span class="r-pill">Acabamento</span>
          </div>
        </div>
      </div>

      <div class="form-actions">
        <button class="btn-cancel">Cancelar</button>
        <button class="btn-submit">Salvar Roteiro</button>
      </div>
    </div>

  </div>
</main>

<script th:src="@{/js/cadastro-produto.js}"></script>
</body>
</html>
