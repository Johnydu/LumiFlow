<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Produtos - LumiFlow</title>

    <link rel="stylesheet" th:href="@{/css/topbar.css}">
    <link rel="stylesheet" th:href="@{/css/variables.css}">
    <link rel="stylesheet" th:href="@{/css/globals.css}">
    <link rel="stylesheet" th:href="@{/css/sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/components/buttons.css}">
    <link rel="stylesheet" th:href="@{/css/components/forms.css}">
    <link rel="stylesheet" th:href="@{/css/components/tables.css}">
    <link rel="stylesheet" th:href="@{/css/components/cards.css}">
    <link rel="stylesheet" th:href="@{/css/components/badges.css}">
    <link rel="stylesheet" th:href="@{/css/components/status.css}">
    <link rel="stylesheet" th:href="@{/css/components/alerts.css}">
    <!-- Componente Modal Centralizado -->
    <link rel="stylesheet" th:href="@{/css/components/modal.css}">
    <link rel="stylesheet" th:href="@{/css/pages/produtos.css}">
    <link rel="stylesheet" th:href="@{/css/utils.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="page-produto-cadastroproduto">
<div th:replace="~{fragments/messages :: alerts}"></div>

<!-- ================================ -->
<!-- SIDEBAR                          -->
<!-- ================================ -->
<aside th:replace="~{fragments/sidebar :: sidebar(activePage='produtos')}"></aside>

<main class="main">

    <!-- ================================ -->
    <!-- TOPBAR                           -->
    <!-- ================================ -->
    <div th:replace="~{fragments/topbar :: topbar(
    'Produtos',
    '+ Novo Produto',
    'novoProdutoForm()'
)}"></div>

    <div class="content">
        <form method="get" th:action="@{/dashboard/produtos}" id="form-busca-produto">
            <input type="text"
                   name="nome"
                   th:value="${param.nome}"
                   class="search"
                   placeholder="🔍 Buscar por nome ou código...">
        </form>

        <!-- INÍCIO DO FRAGMENTO DA LISTA -->
        <div class="lista" th:fragment="tabelaProdutos">

            <div class="panel">

                <div class="panel-header">


                    <span class="panel-title">
                        Produtos cadastrados
                    </span>

                    <span class="panel-count"
                          th:text="${#lists.size(produtos) + ' produto(s)'}">
                    </span>
                </div>

                <table>
                    <thead>
                    <tr>
                        <th>Produto</th>
                        <th>Código</th>
                        <th>Descrição</th>
                        <th style="width:150px">Ações</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="produto : ${produtos}">
                        <td>
                            <div class="produto-info">
                                <div class="produto-nome" th:text="${produto.nome}"></div>
                            </div>
                        </td>

                        <td class="num" th:text="${produto.codigo}"></td>

                        <td class="produto-desc" th:text="${produto.descricao}"></td>

                        <td>
                            <div class="table-actions" sec:authorize="hasAnyRole('SUPORTE', 'PCP_SUPERVISOR')">
                                <button type="button"
                                        class="btn-edit"
                                        th:data-id="${produto.id}"
                                        th:data-nome="${produto.nome}"
                                        th:data-codigo="${produto.codigo}"
                                        th:data-descricao="${produto.descricao}"
                                        onclick="handleEditarProduto(this)">
                                    ✏ Editar
                                </button>

                                <form th:action="@{/dashboard/produtos/{id}/excluir(id=${produto.id})}"
                                      method="post">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                    <button type="submit"
                                            class="btn-del"
                                            onclick="return confirm('Tem certeza que deseja excluir este produto?');">
                                        🗑 Excluir
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(produtos)}">
                        <td colspan="4" style="text-align:center;color:var(--color-muted-5)">
                            Nenhum produto cadastrado.
                        </td>
                    </tr>
                    </tbody>
                </table>

            </div>

        </div>


        <!-- MODAL DE FORMULÁRIO / DADOS DO PRODUTO -->
        <div class="modal-overlay" id="form-panel" style="display:none"
             sec:authorize="hasAnyRole('SUPORTE', 'PCP_SUPERVISOR')">
            <div class="modal-box" style="max-width: 600px;">
                <div class="modal-header">
                    <span class="modal-title" id="form-title">Novo produto</span>
                    <button type="button" class="modal-close" onclick="hideForm()">&times;</button>
                </div>

                <form id="produto-form"
                      th:action="@{/dashboard/produtos}"
                      th:object="${produtoDTO}"
                      method="post">

                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}"/>

                    <input type="hidden"
                           id="id"
                           th:field="*{id}"/>

                    <div class="modal-body" style="display: flex; flex-direction: column; gap: var(--space-4);">
                        <div class="field" style="display: flex; flex-direction: column; gap: 4px;">
                            <label for="nome" style="font-size: var(--font-size-sm); font-weight: 500;">
                                Nome do produto <span style="color: var(--color-danger);">*</span>
                            </label>

                            <input type="text"
                                   id="nome"
                                   th:field="*{nome}"
                                   placeholder="Ex: Plafon"
                                   style="height: var(--control-height, 38px); padding: 0 var(--space-3); border: 1px solid var(--border-strong); border-radius: var(--radius-md); background: var(--color-field); color: var(--color-text); font-size: var(--font-size-sm);">
                        </div>

                        <div class="field" style="display: flex; flex-direction: column; gap: 4px;">
                            <label for="codigo" style="font-size: var(--font-size-sm); font-weight: 500;">
                                Código <span style="color: var(--color-danger);">*</span>
                            </label>

                            <input type="text"
                                   id="codigo"
                                   th:field="*{codigo}"
                                   placeholder="Ex: 123456" required
                                   style="height: var(--control-height, 38px); padding: 0 var(--space-3); border: 1px solid var(--border-strong); border-radius: var(--radius-md); background: var(--color-field); color: var(--color-text); font-size: var(--font-size-sm);">
                        </div>

                        <div class="field" style="display: flex; flex-direction: column; gap: 4px;">
                            <label for="descricao" style="font-size: var(--font-size-sm); font-weight: 500;">
                                Descrição
                            </label>

                            <textarea id="descricao"
                                      th:field="*{descricao}"
                                      maxlength="500"
                                      rows="4"
                                      placeholder="Descrição do produto"
                                      style="padding: var(--space-3); border: 1px solid var(--border-strong); border-radius: var(--radius-md); background: var(--color-field); color: var(--color-text); font-size: var(--font-size-sm); resize: vertical;">
                            </textarea>
                        </div>
                    </div>

                    <div class="modal-actions">
                        <button type="button"
                                class="btn-cancel"
                                onclick="hideForm()">
                            Cancelar
                        </button>

                        <button type="submit"
                                class="btn-submit">
                            Salvar
                        </button>
                    </div>

                </form>

                <!-- ABA ROTEIRO (Integrada dentro do Modal se acionada) -->
                <div id="tab-roteiro" style="display:none; margin-top: 16px;">
                    <form id="roteiro-form"
                          th:action="@{/dashboard/produtos/roteiro}"
                          method="post">

                        <input type="hidden"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}"/>

                        <input type="hidden"
                               id="roteiro-produto-id"
                               name="produtoId"/>

                        <div class="form-title" style="font-size: var(--font-size-md); font-weight: 600; margin-bottom: 12px;">
                            Roteiro de Produção
                        </div>

                        <!-- PRÉVIA DO ROTEIRO -->
                        <div class="preview-box" style="padding: 12px; border: 1px solid var(--border-strong); border-radius: var(--radius-md); background: var(--color-surface-subtle); margin-bottom: 16px;">
                            <div class="preview-label" style="font-size: var(--font-size-xs); font-weight: 500; color: var(--color-muted); margin-bottom: 6px;">Prévia do roteiro</div>
                            <div class="preview-pills" id="preview-pills" style="display: flex; flex-wrap: wrap; gap: 6px; align-items: center;">
                                <span style="color:var(--color-muted-5);font-size:12px">
                                    Nenhum setor selecionado.
                                </span>
                            </div>
                        </div>

                        <div class="modal-actions">
                            <button type="button"
                                    class="btn-cancel"
                                    onclick="hideForm()">
                                Cancelar
                            </button>

                            <button type="submit"
                                    class="btn-submit">
                                Salvar Roteiro
                            </button>
                        </div>
                    </form>
                </div>

            </div>
        </div>

    </div>

</main>

<script th:src="@{/js/cadastro-produto.js}"></script>
<script th:src="@{/js/sidebar.js}"></script>
<script th:src="@{/js/alerts.js}"></script>

</body>
</html>
