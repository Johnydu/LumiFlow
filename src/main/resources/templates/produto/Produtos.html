<!DOCTYPE html>
<html lang="pt-BR" th:lang="${#locale.toLanguageTag()}" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <th:block th:replace="~{fragments/theme :: init}"></th:block>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Produtos - LumiFlow</title>

    <link rel="stylesheet" th:href="@{/css/topbar.css}">
    <link rel="stylesheet" th:href="@{/css/variables.css}">
    <link rel="stylesheet" th:href="@{/css/globals.css}">
    <link rel="stylesheet" th:href="@{/css/sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/components/buttons.css}">
    <link rel="stylesheet" th:href="@{/css/components/forms.css}">
    <link rel="stylesheet" th:href="@{/css/components/tables.css}">
    <link rel="stylesheet" th:href="@{/css/components/cards.css}">
    <link rel="stylesheet" th:href="@{/css/components/badges.css}">
    <link rel="stylesheet" th:href="@{/css/components/status.css}">
    <link rel="stylesheet" th:href="@{/css/components/alerts.css}">
    <!-- Componente Modal Centralizado -->
    <link rel="stylesheet" th:href="@{/css/components/modal.css}">
    <link rel="stylesheet" th:href="@{/css/components/paginacao.css}">
    <link rel="stylesheet" th:href="@{/css/components/csp-migrated.css}">
    <link rel="stylesheet" th:href="@{/css/pages/produtos.css}">
    <link rel="stylesheet" th:href="@{/css/utils.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
          integrity="sha384-iw3OoTErCYJJB9mCa8LNS2hbsQ7M3C0EpIsO/H5+EGAkPGc6rk+V8i04oW/K5xq0"
          crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body class="page-produto-cadastroproduto">
<div th:replace="~{fragments/messages :: alerts}"></div>

<!-- ================================ -->
<!-- SIDEBAR                          -->
<!-- ================================ -->
<aside th:replace="~{fragments/sidebar :: sidebar(activePage='produtos')}"></aside>

<main class="main">

    <!-- ================================ -->
    <!-- TOPBAR                           -->
    <!-- ================================ -->
    <div th:replace="~{fragments/topbar :: topbar(
    'Produtos',
    '+ Novo Produto',
    'novoProdutoForm',
    'padrao'
)}"></div>

    <div class="content">
        <form method="get" th:action="@{/dashboard/produtos}" id="form-busca-produto">
            <div class="field">
                <label for="buscaProduto">Buscar por produto ou código</label>
                <input type="text"
                       id="buscaProduto"
                       name="nome"
                       th:value="${nomeAtual}"
                       class="search">
                <input type="hidden" name="page" th:value="${pagina != null ? pagina.number : 0}">
            </div>
        </form>

        <!-- INÍCIO DO FRAGMENTO DA LISTA -->
        <div class="lista" th:fragment="tabelaProdutos">

            <div class="panel">

                <div class="panel-header">


                    <span class="panel-title">
                        Produtos cadastrados
                    </span>

                    <span class="panel-count"
                          th:text="${(pagina != null ? pagina.totalElements : 0) + ' produto(s)'}">
                    </span>
                </div>

                <table>
                    <thead>
                    <tr>
                        <th>Produto</th>
                        <th>Código</th>
                        <th>Roteiro</th>
                        <th>Descrição</th>
                        <th class="csp-style-7c07cdf8bd">Ações</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="produto : ${produtos}">
                        <td>
                            <div class="produto-info">
                                <div class="produto-nome" th:text="${produto.nome != null ? produto.nome : '—'}"></div>
                            </div>
                        </td>

                        <td><span class="produto-codigo" th:text="${produto.codigo}"></span></td>

                        <td>
                            <span class="tag-maq"
                                  th:if="${produto.roteiroCodigo != null}"
                                  th:text="${produto.roteiroCodigo}"
                                  th:title="${produto.roteiroDescricao}"></span>
                            <span class="tag-alerta" th:if="${produto.roteiroCodigo == null}">Sem roteiro</span>
                        </td>

                        <td class="produto-desc" th:text="${produto.descricao}"></td>

                        <td>
                            <div class="table-actions" sec:authorize="hasAnyRole('ADMIN', 'PCP', 'SUPERVISOR')">
                                <button type="button"
                                        class="btn-edit"
                                        th:data-id="${produto.id}"
                                        th:data-nome="${produto.nome}"
                                        th:data-codigo="${produto.codigo}"
                                        th:data-descricao="${produto.descricao}"
                                        data-csp-action="handleEditarProduto" data-csp-argument="element">
                                    ✏ Editar
                                </button>

                                <form th:action="@{/dashboard/produtos/{id}/excluir(id=${produto.id})}"
                                      method="post">
                                    <input type="hidden" th:id="|csrfExcluirProduto-${produto.id}|"
                                           th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                    <button type="submit"
                                            class="btn-del"
                                            data-csp-confirm="Tem certeza que deseja excluir este produto?">
                                        🗑 Excluir
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(produtos)}">
                        <td colspan="4" class="csp-style-23258bbf2b">
                            Nenhum produto cadastrado.
                        </td>
                    </tr>
                    </tbody>
                </table>

            </div>

            <div th:replace="~{fragments/paginacao :: pager(${pagina}, 'form-busca-produto')}"></div>
        </div>


        <!-- MODAL DE FORMULÁRIO / DADOS DO PRODUTO -->
        <div class="modal-overlay" id="form-panel"
             sec:authorize="hasAnyRole('ADMIN', 'PCP', 'SUPERVISOR')">
            <div class="modal-box csp-style-dc271cfe4e" role="dialog" aria-modal="true" aria-labelledby="form-title">
                <div class="modal-header">
                    <span class="modal-title" id="form-title">Novo produto</span>
                    <button type="button" class="modal-close" data-csp-action="hideForm" aria-label="Fechar janela">&times;</button>
                </div>

                <form id="produto-form"
                      th:action="@{/dashboard/produtos}"
                      th:object="${produtoDTO}"
                      method="post">

                    <input type="hidden"
                           id="csrfProduto"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}"/>

                    <input type="hidden"
                           id="id"
                           th:field="*{id}"/>

                    <div class="modal-body csp-style-dbc770e380">
                        <div class="field csp-style-ef1f3a5dff">
                            <label for="nomeProduto" class="csp-style-e4c9ee3efa">
                                Nome do produto
                            </label>

                            <input type="text" class="csp-style-51fd58adb1"
                                   id="nomeProduto"
                                   th:field="*{nome}"
                                   placeholder="Ex: Plafon"
                            >
                        </div>

                        <div class="field csp-style-ef1f3a5dff">
                            <label for="codigoProduto" class="csp-style-e4c9ee3efa">
                                Código <span class="csp-style-1f62937642">*</span>
                            </label>

                            <input type="text" class="csp-style-51fd58adb1"
                                   id="codigoProduto"
                                   th:field="*{codigo}"
                                   placeholder="Ex: 123456" required
                            >
                        </div>

                        <div class="field csp-style-ef1f3a5dff">
                            <label for="descricaoProduto" class="csp-style-e4c9ee3efa">
                                Descrição
                            </label>

                            <textarea id="descricaoProduto" class="csp-style-55a3a2bfc9"
                                      th:field="*{descricao}"
                                      maxlength="500"
                                      rows="4"
                                      placeholder="Descrição do produto"
                            >
                            </textarea>
                        </div>
                    </div>

                    <div class="modal-actions">
                        <button type="button"
                                class="btn-cancel"
                                data-csp-action="hideForm">
                            Cancelar
                        </button>

                        <button type="submit"
                                class="btn-submit">
                            Salvar
                        </button>
                    </div>

                </form>

            </div>
        </div>

    </div>

</main>

<script th:src="@{/js/filtro-ajax.js}" defer></script>
<script th:src="@{/js/cadastro-produto.js}" defer></script>
<script th:src="@{/js/sidebar.js}" defer></script>
<script th:src="@{/js/alerts.js}" defer></script>

</body>
</html>
