<!DOCTYPE html>
<html lang="pt-BR" th:lang="${#locale.toLanguageTag()}" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <th:block th:replace="~{fragments/theme :: init}"></th:block>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Operadores - LumiFlow</title>

    <!-- 1. Variables & Globals -->
    <link rel="stylesheet" th:href="@{/css/variables.css}">
    <link rel="stylesheet" th:href="@{/css/globals.css}">

    <!-- 2. Shared Layout -->
    <link rel="stylesheet" th:href="@{/css/sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/topbar.css}">

    <!-- 3. Components -->
    <link rel="stylesheet" th:href="@{/css/components/buttons.css}">
    <link rel="stylesheet" th:href="@{/css/components/forms.css}">
    <link rel="stylesheet" th:href="@{/css/components/tables.css}">
    <link rel="stylesheet" th:href="@{/css/components/cards.css}">
    <link rel="stylesheet" th:href="@{/css/components/badges.css}">
    <link rel="stylesheet" th:href="@{/css/components/status.css}">
    <link rel="stylesheet" th:href="@{/css/components/alerts.css}">
    <!-- Componente Modal Centralizado -->
    <link rel="stylesheet" th:href="@{/css/components/modal.css}">

    <!-- 4. Page Specific -->
    <link rel="stylesheet" th:href="@{/css/pages/operadores.css}">

    <!-- 5. Utils & Responsive -->
    <link rel="stylesheet" th:href="@{/css/utils.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="page-operador-cadastrooperador">
<div th:replace="~{fragments/messages :: alerts}"></div>

<!-- SIDEBAR -->
<aside th:replace="~{fragments/sidebar :: sidebar(activePage='operadores')}"></aside>

<main class="main">

    <!-- TOPBAR -->
    <div th:replace="~{fragments/topbar :: topbar(
    'Operadores',
    '+ Novo Operador',
    'novoOperadorForm'
)}"></div>

    <div class="content">

        <form method="get" th:action="@{/dashboard/operadores}">
            <input type="text"
                   name="nome"
                   th:value="${param.nome}"
                   class="search"
                   placeholder="Buscar operador...">

            <select name="setorId" class="filtro-select">
                <option value="">Todos os setores</option>
                <option th:each="setor : ${listaSetores}"
                        th:value="${setor.id}"
                        th:text="${setor.nome}"
                        th:selected="${param.setorId != null and #strings.toString(setor.id) == param.setorId}">
                </option>
            </select>
        </form>

        <!-- LISTA -->
        <div class="lista" th:fragment="listaOperadores">

            <div class="panel">

                <div class="panel-header">
                    <span class="panel-title">
                        Operadores cadastrados
                    </span>

                    <span class="panel-count"
                          th:text="${#lists.size(operadores) + ' operador(es)'}">
                    </span>
                </div>

                <table>
                    <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Função</th>
                        <th>Setor Padrão</th>
                        <th class="csp-style-465bfea3ed">Ações</th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr th:each="operador : ${operadores}">

                        <td>
                            <div class="operador-info">
                                <div class="operador-nome"
                                     th:text="${operador.nome}">
                                </div>
                            </div>
                        </td>

                        <td class="operador-funcao"
                            th:text="${operador.funcao != null && !operador.funcao.isBlank() ? operador.funcao : '-'}">
                        </td>

                        <td class="operador-setor"
                            th:text="${operador.setorPadraoNome != null ? operador.setorPadraoNome : 'Volante / Sem Setor'}">
                        </td>

                        <td>
                            <div class="table-actions" sec:authorize="hasAnyRole('ADMIN', 'PCP', 'SUPERVISOR')">

                                <button type="button"
                                        class="btn-edit"
                                        th:data-id="${operador.id}"
                                        th:data-nome="${operador.nome}"
                                        th:data-funcao="${operador.funcao}"
                                        th:data-setor-id="${operador.setorPadraoId}"
                                       data-csp-action="handleEditarOperador" data-csp-argument="element">
                                    ✏ Editar
                                </button>

                                <form class="csp-style-0cd28ce9ba"
                                      th:action="@{/dashboard/operadores/{id}/excluir(id=${operador.id})}"
                                      method="post"
                                     >

                                    <!-- th:action gera o input CSRF automaticamente -->

                                    <button type="submit"
                                            class="btn-del"
                                           data-csp-confirm="Tem certeza que deseja excluir este operador?">
                                        🗑 Excluir
                                    </button>

                                </form>

                            </div>
                        </td>

                    </tr>

                    <tr th:if="${#lists.isEmpty(operadores)}">
                        <td colspan="4" class="csp-style-23258bbf2b"
                           >
                            Nenhum operador cadastrado.
                        </td>
                    </tr>

                    </tbody>
                </table>

            </div>

        </div>

        <!-- MODAL DE CADASTRO / EDIÇÃO DE OPERADORES -->
        <div class="modal-overlay" id="form-panel"
             sec:authorize="hasAnyRole('ADMIN', 'PCP', 'SUPERVISOR')">
            <div class="modal-box csp-style-ffa089e03c">
                <div class="modal-header">
                    <span class="modal-title" id="form-title">Novo operador</span>
                    <button type="button" class="modal-close" data-csp-action="hideForm">&times;</button>
                </div>

                <form id="operador-form"
                      th:action="@{/dashboard/operadores}"
                      th:object="${operadorDTO}"
                      method="post">

                    <!-- th:action gera o input CSRF automaticamente -->

                    <input type="hidden"
                           id="id"
                           th:field="*{id}" />

                    <div class="modal-body csp-style-dbc770e380">
                        <div class="field csp-style-ef1f3a5dff">
                            <label for="nome" class="csp-style-e4c9ee3efa">
                                Nome do operador <span class="csp-style-1f62937642">*</span>
                            </label>

                            <input type="text" class="csp-style-51fd58adb1"
                                   id="nome"
                                   th:field="*{nome}"
                                   placeholder="Ex: Carlos Silva"
                                   required
                                  >
                        </div>

                        <div class="field csp-style-ef1f3a5dff">
                            <label for="funcao" class="csp-style-e4c9ee3efa">
                                Função
                            </label>

                            <input type="text" class="csp-style-51fd58adb1"
                                   id="funcao"
                                   th:field="*{funcao}"
                                   placeholder="Ex: Soldador, Pintor"
                                   maxlength="30"
                                  >
                        </div>

                        <div class="field csp-style-ef1f3a5dff">
                            <label for="setorPadraoId" class="csp-style-e4c9ee3efa">
                                Setor Padrão
                            </label>

                            <select id="setorPadraoId" class="csp-style-51fd58adb1" th:field="*{setorPadraoId}"
                                   >
                                <option value="">Nenhum / Volante</option>
                                <option th:each="setor : ${listaSetores}"
                                        th:value="${setor.id}"
                                        th:text="${setor.nome}">
                                </option>
                            </select>
                        </div>
                    </div>

                    <div class="modal-actions">
                        <button type="button"
                                class="btn-cancel"
                               data-csp-action="hideForm">
                            Cancelar
                        </button>

                        <button type="submit"
                                class="btn-submit">
                            Salvar
                        </button>
                    </div>

                </form>
            </div>
        </div>

    </div>

</main>

<script th:src="@{/js/operadores.js}"></script>
<script th:src="@{/js/sidebar.js}"></script>
<script th:src="@{/js/alerts.js}"></script>

</body>
</html>
