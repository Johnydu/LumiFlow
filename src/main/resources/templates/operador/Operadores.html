<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Operadores - LumiFlow</title>

    <!-- 1. Variables & Globals -->
    <link rel="stylesheet" th:href="@{/css/variables.css}">
    <link rel="stylesheet" th:href="@{/css/globals.css}">

    <!-- 2. Shared Layout -->
    <link rel="stylesheet" th:href="@{/css/sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/topbar.css}">

    <!-- 3. Components -->
    <link rel="stylesheet" th:href="@{/css/components/buttons.css}">
    <link rel="stylesheet" th:href="@{/css/components/forms.css}">
    <link rel="stylesheet" th:href="@{/css/components/tables.css}">
    <link rel="stylesheet" th:href="@{/css/components/cards.css}">
    <link rel="stylesheet" th:href="@{/css/components/badges.css}">
    <link rel="stylesheet" th:href="@{/css/components/status.css}">
    <link rel="stylesheet" th:href="@{/css/components/alerts.css}">
    <!-- Componente Modal Centralizado -->
    <link rel="stylesheet" th:href="@{/css/components/modal.css}">

    <!-- 4. Page Specific -->
    <link rel="stylesheet" th:href="@{/css/pages/operadores.css}">

    <!-- 5. Utils & Responsive -->
    <link rel="stylesheet" th:href="@{/css/utils.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="page-operador-cadastrooperador">
<div th:replace="~{fragments/messages :: alerts}"></div>

<!-- SIDEBAR -->
<aside th:replace="~{fragments/sidebar :: sidebar(activePage='operadores')}"></aside>

<main class="main">

    <!-- TOPBAR -->
    <div th:replace="~{fragments/topbar :: topbar(
    'Operadores',
    '+ Novo Operador',
    'novoOperadorForm()'
)}"></div>

    <div class="content">

        <form method="get" th:action="@{/dashboard/operadores}">
            <input type="text"
                   name="nome"
                   th:value="${param.nome}"
                   class="search"
                   placeholder="Buscar operador...">

            <select name="setorId" class="filtro-select">
                <option value="">Todos os setores</option>
                <option th:each="setor : ${listaSetores}"
                        th:value="${setor.id}"
                        th:text="${setor.nome}"
                        th:selected="${param.setorId != null and #strings.toString(setor.id) == param.setorId}">
                </option>
            </select>
        </form>

        <!-- LISTA -->
        <div class="lista" th:fragment="listaOperadores">

            <div class="panel">

                <div class="panel-header">
                    <span class="panel-title">
                        Operadores cadastrados
                    </span>

                    <span class="panel-count"
                          th:text="${#lists.size(operadores) + ' operador(es)'}">
                    </span>
                </div>

                <table>
                    <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Função</th>
                        <th>Setor Padrão</th>
                        <th style="width:120px">Ações</th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr th:each="operador : ${operadores}">

                        <td>
                            <div class="operador-info">
                                <div class="operador-nome"
                                     th:text="${operador.nome}">
                                </div>
                            </div>
                        </td>

                        <td class="operador-funcao"
                            th:text="${operador.funcao != null && !operador.funcao.isBlank() ? operador.funcao : '-'}">
                        </td>

                        <td class="operador-setor"
                            th:text="${operador.setorPadraoNome != null ? operador.setorPadraoNome : 'Volante / Sem Setor'}">
                        </td>

                        <td>
                            <div class="table-actions">

                                <button type="button"
                                        class="btn-edit"
                                        th:data-id="${operador.id}"
                                        th:data-nome="${operador.nome}"
                                        th:data-funcao="${operador.funcao}"
                                        th:data-setor-id="${operador.setorPadraoId}"
                                        onclick="handleEditarOperador(this)">
                                    ✏ Editar
                                </button>

                                <form th:action="@{/dashboard/operadores/{id}/excluir(id=${operador.id})}"
                                      method="post"
                                      style="display:inline;">

                                    <!-- th:action gera o input CSRF automaticamente -->

                                    <button type="submit"
                                            class="btn-del"
                                            onclick="return confirm('Tem certeza que deseja excluir este operador?');">
                                        🗑 Excluir
                                    </button>

                                </form>

                            </div>
                        </td>

                    </tr>

                    <tr th:if="${#lists.isEmpty(operadores)}">
                        <td colspan="4"
                            style="text-align:center;color:var(--color-muted-5)">
                            Nenhum operador cadastrado.
                        </td>
                    </tr>

                    </tbody>
                </table>

            </div>

        </div>

        <!-- MODAL DE CADASTRO / EDIÇÃO DE OPERADORES -->
        <div class="modal-overlay" id="form-panel" style="display:none">
            <div class="modal-box" style="max-width: 520px;">
                <div class="modal-header">
                    <span class="modal-title" id="form-title">Novo operador</span>
                    <button type="button" class="modal-close" onclick="hideForm()">&times;</button>
                </div>

                <form id="operador-form"
                      th:action="@{/dashboard/operadores}"
                      th:object="${operadorDTO}"
                      method="post">

                    <!-- th:action gera o input CSRF automaticamente -->

                    <input type="hidden"
                           id="id"
                           th:field="*{id}" />

                    <div class="modal-body" style="display: flex; flex-direction: column; gap: var(--space-4);">
                        <div class="field" style="display: flex; flex-direction: column; gap: 4px;">
                            <label for="nome" style="font-size: var(--font-size-sm); font-weight: 500;">
                                Nome do operador <span style="color: var(--color-danger);">*</span>
                            </label>

                            <input type="text"
                                   id="nome"
                                   th:field="*{nome}"
                                   placeholder="Ex: Carlos Silva"
                                   required
                                   style="height: var(--control-height, 38px); padding: 0 var(--space-3); border: 1px solid var(--border-strong); border-radius: var(--radius-md); background: var(--color-field); color: var(--color-text); font-size: var(--font-size-sm);">
                        </div>

                        <div class="field" style="display: flex; flex-direction: column; gap: 4px;">
                            <label for="funcao" style="font-size: var(--font-size-sm); font-weight: 500;">
                                Função
                            </label>

                            <input type="text"
                                   id="funcao"
                                   th:field="*{funcao}"
                                   placeholder="Ex: Soldador, Pintor"
                                   maxlength="30"
                                   style="height: var(--control-height, 38px); padding: 0 var(--space-3); border: 1px solid var(--border-strong); border-radius: var(--radius-md); background: var(--color-field); color: var(--color-text); font-size: var(--font-size-sm);">
                        </div>

                        <div class="field" style="display: flex; flex-direction: column; gap: 4px;">
                            <label for="setorPadraoId" style="font-size: var(--font-size-sm); font-weight: 500;">
                                Setor Padrão
                            </label>

                            <select id="setorPadraoId" th:field="*{setorPadraoId}"
                                    style="height: var(--control-height, 38px); padding: 0 var(--space-3); border: 1px solid var(--border-strong); border-radius: var(--radius-md); background: var(--color-field); color: var(--color-text); font-size: var(--font-size-sm);">
                                <option value="">Nenhum / Volante</option>
                                <option th:each="setor : ${listaSetores}"
                                        th:value="${setor.id}"
                                        th:text="${setor.nome}">
                                </option>
                            </select>
                        </div>
                    </div>

                    <div class="modal-actions">
                        <button type="button"
                                class="btn-cancel"
                                onclick="hideForm()">
                            Cancelar
                        </button>

                        <button type="submit"
                                class="btn-submit">
                            Salvar
                        </button>
                    </div>

                </form>
            </div>
        </div>

    </div>

</main>

<script th:src="@{/js/operadores.js}"></script>
<script th:src="@{/js/sidebar.js}"></script>
<script th:src="@{/js/alerts.js}"></script>

</body>
</html>
