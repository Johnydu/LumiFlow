<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cadastro de Setores - LumiFlow</title>

  <link rel="stylesheet" th:href="@{/css/variables.css}">
  <link rel="stylesheet" th:href="@{/css/globals.css}">
  <link rel="stylesheet" th:href="@{/css/sidebar.css}">
  <link rel="stylesheet" th:href="@{/css/topbar.css}">
  <link rel="stylesheet" th:href="@{/css/components/buttons.css}">
  <link rel="stylesheet" th:href="@{/css/components/forms.css}">
  <link rel="stylesheet" th:href="@{/css/components/tables.css}">
  <link rel="stylesheet" th:href="@{/css/components/cards.css}">
  <link rel="stylesheet" th:href="@{/css/components/badges.css}">
  <link rel="stylesheet" th:href="@{/css/components/status.css}">
  <link rel="stylesheet" th:href="@{/css/components/alerts.css}">
  <!-- Componente Modal Centralizado -->
  <link rel="stylesheet" th:href="@{/css/components/modal.css}">
  <link rel="stylesheet" th:href="@{/css/pages/setores.css}">
  <link rel="stylesheet" th:href="@{/css/utils.css}">
  <link rel="stylesheet" th:href="@{/css/responsive.css}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="page-setor-cadastrosetor">
<div th:replace="~{fragments/messages :: alerts}"></div>

<aside th:replace="~{fragments/sidebar :: sidebar(activePage='setor')}"></aside>

<main class="main">
  <div th:replace="~{fragments/topbar :: topbar(
    'Setores',
    '+ Novo Setor',
    'novoSetorForm()'
)}"></div>

  <div class="content">

    <!-- Formulário de busca dinâmica por AJAX -->
    <form method="get" th:action="@{/dashboard/setores}" class="filter-form">
      <input type="text"
             name="nome"
             th:value="${param.nome}"
             class="search"
             placeholder="Buscar setor por nome...">
    </form>

    <div class="lista" th:fragment="listaSetores">

      <div class="panel">
        <div class="panel-header">
          <span class="panel-title">Setores cadastrados</span>
          <span class="panel-count"
                th:text="${#lists.size(setores) + ' setor(es)'}">
          </span>
        </div>

        <table>
          <thead>
          <tr>
            <th>Setor</th>
            <th>Máquinas</th>
            <th>Etapas do Setor</th>
            <th style="width:120px">Ações</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="setor : ${setores}">
            <td style="font-weight:500" th:text="${setor.nome}"></td>
            <td>
              <span class="tag-maq"
                    th:text="${setor.quantidadeMaquinas + ' máquina(s)'}">
              </span>
            </td>
            <td>
              <div class="etapas-cell-container">
                <span th:each="etapa : ${setor.etapas}"
                      class="tag-etapa"
                      th:data-id="${etapa.id}"
                      th:data-ordem="${etapa.ordem}"
                      th:text="${etapa.nome}">
                </span>
                <span th:if="${#lists.isEmpty(setor.etapas)}"
                      style="color: var(--color-muted-5); font-size: 12px;">
                    Nenhuma etapa
                </span>
              </div>
            </td>
            <td>
              <div class="table-actions" sec:authorize="hasAnyRole('SUPORTE', 'PCP_SUPERVISOR')">
                <button type="button"
                        class="btn-edit"
                        th:data-id="${setor.id}"
                        th:data-nome="${setor.nome}"
                        onclick="editarSetorDoBotao(this)">
                  ✏ Editar
                </button>
                <form th:action="@{/dashboard/setores/{id}/excluir(id=${setor.id})}"
                      method="post"
                      style="display:inline">
                  <input type="hidden"
                         th:name="${_csrf.parameterName}"
                         th:value="${_csrf.token}"/>

                  <button type="submit"
                          class="btn-del"
                          onclick="return confirm('Tem certeza que deseja excluir este setor?');">
                    🗑 Excluir
                  </button>
                </form>
              </div>
            </td>
          </tr>

          <tr th:if="${#lists.isEmpty(setores)}">
            <td colspan="4"
                style="text-align:center;color:var(--color-muted-5)">
              Nenhum setor cadastrado.
            </td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- MODAL DE CADASTRO / EDIÇÃO DE SETOR -->
    <div class="modal-overlay" id="form-panel" style="display:none;"
         sec:authorize="hasAnyRole('SUPORTE', 'PCP_SUPERVISOR')">
      <div class="modal-box" style="max-width: 560px;">
        <div class="modal-header">
          <span class="modal-title" id="form-title">Novo Setor</span>
          <button type="button" class="modal-close" onclick="hideForm()">&times;</button>
        </div>

        <form id="setor-form"
              th:action="@{/dashboard/setores}"
              th:object="${setorDTO}"
              method="post">

          <input type="hidden"
                 th:name="${_csrf.parameterName}"
                 th:value="${_csrf.token}"/>

          <input type="hidden" th:field="*{id}"/>

          <div class="modal-body">
            <div class="field" style="display: flex; flex-direction: column; gap: 4px;">
              <label for="nome" style="font-size: var(--font-size-sm); font-weight: 500;">Nome do Setor <span style="color: var(--color-danger);">*</span></label>
              <input type="text" id="nome" th:field="*{nome}" class="form-control"
                     placeholder="Ex: Costura, Acabamento..." required
                     style="height: var(--control-height, 38px); padding: 0 var(--space-3); border: 1px solid var(--border-strong); border-radius: var(--radius-md); background: var(--color-field); color: var(--color-text); font-size: var(--font-size-sm);"/>
            </div>

            <!-- Container fixo e visível das etapas do setor -->
            <div class="field" id="container-etapas-setor" style="display:flex; flex-direction: column; gap: 4px;">
              <label style="font-size: var(--font-size-sm); font-weight: 500;">Etapas/Processos do Setor <span style="color: var(--color-danger);">*</span></label>
              <div class="etapas-list" id="etapas-setor-list" style="max-height: 200px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;">
                <!-- Preenchido via JavaScript -->
              </div>
              <button type="button" class="btn-add-etapa" onclick="adicionarEtapaSetor()"
                      style="margin-top: 4px; padding: 8px; border: 1px dashed var(--border-strong); border-radius: var(--radius-md); background: transparent; color: var(--color-muted); font-size: var(--font-size-sm); cursor: pointer; text-align: center;">
                + Adicionar Etapa
              </button>
            </div>
          </div>

          <div class="modal-actions">
            <button type="button" class="btn-cancel" onclick="hideForm()">Cancelar</button>
            <button type="submit" class="btn-submit">Salvar</button>
          </div>

        </form>
      </div>
    </div>

  </div>
</main>

<script th:src="@{/js/cadastro-setor.js}"></script>
<script th:src="@{/js/sidebar.js}"></script>
<script th:src="@{/js/alerts.js}"></script>
</body>
</html>
