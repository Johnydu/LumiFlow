<!DOCTYPE html>
<html lang="pt-BR" th:lang="${#locale.toLanguageTag()}" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <th:block th:replace="~{fragments/theme :: init}"></th:block>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cadastro de Setores - LumiFlow</title>

  <link rel="stylesheet" th:href="@{/css/variables.css}">
  <link rel="stylesheet" th:href="@{/css/globals.css}">
  <link rel="stylesheet" th:href="@{/css/sidebar.css}">
  <link rel="stylesheet" th:href="@{/css/topbar.css}">
  <link rel="stylesheet" th:href="@{/css/components/buttons.css}">
  <link rel="stylesheet" th:href="@{/css/components/forms.css}">
  <link rel="stylesheet" th:href="@{/css/components/tables.css}">
  <link rel="stylesheet" th:href="@{/css/components/cards.css}">
  <link rel="stylesheet" th:href="@{/css/components/badges.css}">
  <link rel="stylesheet" th:href="@{/css/components/status.css}">
  <link rel="stylesheet" th:href="@{/css/components/alerts.css}">
  <!-- Componente Modal Centralizado -->
  <link rel="stylesheet" th:href="@{/css/components/modal.css}">
  <link rel="stylesheet" th:href="@{/css/components/csp-migrated.css}">
  <link rel="stylesheet" th:href="@{/css/pages/setores.css}">
  <link rel="stylesheet" th:href="@{/css/utils.css}">
  <link rel="stylesheet" th:href="@{/css/responsive.css}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        integrity="sha384-iw3OoTErCYJJB9mCa8LNS2hbsQ7M3C0EpIsO/H5+EGAkPGc6rk+V8i04oW/K5xq0"
        crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body class="page-setor-cadastrosetor">
<div th:replace="~{fragments/messages :: alerts}"></div>

<aside th:replace="~{fragments/sidebar :: sidebar(activePage='setores')}"></aside>

<main class="main">
  <div th:replace="~{fragments/topbar :: topbar(
    'Setores',
    '+ Novo Setor',
    'novoSetorForm',
    'padrao'
)}"></div>

  <div class="content">

    <!-- Formulário de busca dinâmica por AJAX -->
    <form method="get" th:action="@{/dashboard/setores}" class="filter-form">
      <div class="field">
      <label for="buscaSetor">Buscar Setor</label>
      <input type="text"
             id="buscaSetor"
             name="nome"
             th:value="${param.nome != null ? param.nome[0] : ''}"
             class="search">
      </div>
    </form>

    <div class="lista" th:fragment="listaSetores">

      <div class="panel">
        <div class="panel-header">
          <span class="panel-title">Setores cadastrados</span>
          <span class="panel-count"
                th:text="${#lists.size(setores) + ' setor(es)'}">
          </span>
        </div>

        <table>
          <thead>
          <tr>
            <th>Setor</th>
            <th>Máquinas</th>
            <th>Etapas do Setor</th>
            <th class="csp-style-465bfea3ed">Ações</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="setor : ${setores}">
            <td th:text="${setor.nome}" class="csp-style-02a2d333e2"></td>
            <td>
              <span class="tag-maq"
                    th:text="${setor.quantidadeMaquinas + ' máquina(s)'}">
              </span>
            </td>
            <td>
              <div class="etapas-cell-container">
                <span th:each="etapa : ${setor.etapas}"
                      class="tag-etapa"
                      th:data-id="${etapa.id}"
                      th:data-ordem="${etapa.ordem}"
                      th:text="${etapa.nome}">
                </span>
                <span th:if="${#lists.isEmpty(setor.etapas)}" class="csp-style-2ed273af07"
                     >
                    Nenhuma etapa
                </span>
              </div>
            </td>
            <td>
              <div class="table-actions" sec:authorize="hasAnyRole('ADMIN', 'PCP', 'SUPERVISOR')">
                <button type="button"
                        class="btn-edit"
                        th:data-id="${setor.id}"
                        th:data-nome="${setor.nome}"
                       data-csp-action="editarSetorDoBotao" data-csp-argument="element">
                  ✏ Editar
                </button>
                <form class="csp-style-cccfa4560d"
                      th:action="@{/dashboard/setores/{id}/excluir(id=${setor.id})}"
                      method="post"
                     >
                  <input type="hidden"
                         th:id="|csrfExcluirSetor-${setor.id}|"
                         th:name="${_csrf.parameterName}"
                         th:value="${_csrf.token}"/>

                  <button type="submit"
                          class="btn-del"
                         data-csp-confirm="Tem certeza que deseja excluir este setor?">
                    🗑 Excluir
                  </button>
                </form>
              </div>
            </td>
          </tr>

          <tr th:if="${#lists.isEmpty(setores)}">
            <td colspan="4" class="csp-style-23258bbf2b"
               >
              Nenhum setor cadastrado.
            </td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- MODAL DE CADASTRO / EDIÇÃO DE SETOR -->
    <div class="modal-overlay" id="form-panel"
         sec:authorize="hasAnyRole('ADMIN', 'PCP', 'SUPERVISOR')">
      <div class="modal-box csp-style-eb1967695a" role="dialog" aria-modal="true" aria-labelledby="form-title">
        <div class="modal-header">
          <span class="modal-title" id="form-title">Novo Setor</span>
          <button type="button" class="modal-close" data-csp-action="hideForm" aria-label="Fechar janela">&times;</button>
        </div>

        <form id="setor-form"
              th:action="@{/dashboard/setores}"
              th:object="${setorDTO}"
              method="post">

          <input type="hidden"
                 id="csrfSetor"
                 th:name="${_csrf.parameterName}"
                 th:value="${_csrf.token}"/>

          <input type="hidden" id="setorId" th:field="*{id}"/>

          <div class="modal-body">
            <div class="field csp-style-ef1f3a5dff">
              <label for="nome" class="csp-style-e4c9ee3efa">Nome do Setor <span class="csp-style-1f62937642">*</span></label>
              <input type="text" id="nome" th:field="*{nome}" class="form-control csp-style-51fd58adb1"
                     placeholder="Ex: Costura, Acabamento..." required
                    />
            </div>

            <!-- Container fixo e visível das etapas do setor -->
            <div class="field csp-style-86a6ebb7fa" id="container-etapas-setor">
              <span class="csp-style-e4c9ee3efa">Etapas/Processos do Setor <span class="csp-style-1f62937642">*</span></span>
              <div class="etapas-list csp-style-04723d1d2e" id="etapas-setor-list">
                <!-- Preenchido via JavaScript -->
              </div>
              <button type="button" class="btn-add-etapa csp-style-de911b4bb1" data-csp-action="adicionarEtapaSetor"
                     >
                + Adicionar Etapa
              </button>
            </div>
          </div>

          <div class="modal-actions">
            <button type="button" class="btn-cancel" data-csp-action="hideForm">Cancelar</button>
            <button type="submit" class="btn-submit">Salvar</button>
          </div>

        </form>
      </div>
    </div>

  </div>
</main>

<script th:src="@{/js/filtro-ajax.js}" defer></script>
<script th:src="@{/js/cadastro-setor.js}" defer></script>
<script th:src="@{/js/sidebar.js}" defer></script>
<script th:src="@{/js/alerts.js}" defer></script>
</body>
</html>
