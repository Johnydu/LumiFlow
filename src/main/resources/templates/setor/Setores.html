<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cadastro de Setores - LumiFlow</title>

  <link rel="stylesheet" th:href="@{/css/variables.css}">
  <link rel="stylesheet" th:href="@{/css/globals.css}">
  <link rel="stylesheet" th:href="@{/css/sidebar.css}">
  <link rel="stylesheet" th:href="@{/css/topbar.css}">
  <link rel="stylesheet" th:href="@{/css/components/buttons.css}">
  <link rel="stylesheet" th:href="@{/css/components/forms.css}">
  <link rel="stylesheet" th:href="@{/css/components/tables.css}">
  <link rel="stylesheet" th:href="@{/css/components/cards.css}">
  <link rel="stylesheet" th:href="@{/css/components/badges.css}">
  <link rel="stylesheet" th:href="@{/css/components/status.css}">
  <link rel="stylesheet" th:href="@{/css/components/alerts.css}">
  <link rel="stylesheet" th:href="@{/css/utils.css}">
  <link rel="stylesheet" th:href="@{/css/responsive.css}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="page-setor-cadastrosetor">
<div th:replace="~{fragments/messages :: alerts}"></div>

<aside th:replace="~{fragments/sidebar :: sidebar(activePage='setor')}"></aside>

<main class="main">
  <div th:replace="~{fragments/topbar :: topbar(
    'Setores',
    '+ Novo Setor',
    'novoSetorForm()'
)}"></div>

  <div class="content">

    <div class="lista">

      <div class="panel">

        <div class="panel-header">
          <span class="panel-title">Setores cadastrados</span>
          <span class="panel-count"
                th:text="${#lists.size(setores) + ' setor(es)'}">
          </span>
        </div>

        <table>
          <thead>
          <tr>
            <th>Setor</th>
            <th>Máquinas</th>
            <th>Etapas</th>
            <th style="width:120px">Ações</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="setor : ${setores}">
            <!-- Removidos os parênteses () dos acessos ao DTO -->
            <td style="font-weight:500" th:text="${setor.nome}"></td>
            <td>
                <span class="tag-maq"
                      th:text="${setor.quantidadeMaquinas + ' máquina(s)'}">
                </span>
            </td>
            <td>
                <span th:if="${setor.possuiEtapas}"
                      style="color:var(--color-primary);font-size:12px">
                  Possui etapas
                </span>
              <span th:unless="${setor.possuiEtapas}"
                    style="color:var(--color-muted-5);font-size:12px">
                  Não possui
                </span>
            </td>
            <td>
              <div class="table-actions">
                <button type="button"
                        class="btn-edit"
                        th:data-id="${setor.id}"
                        th:data-nome="${setor.nome}"
                        th:data-possui="${setor.possuiEtapas}"
                        onclick="editarSetorDoBotao(this)">
                  ✏ Editar
                </button>
                <form th:action="@{/dashboard/setores/{id}/excluir(id=${setor.id})}"
                      method="post"
                      style="display:inline">
                  <input type="hidden"
                         th:name="${_csrf.parameterName}"
                         th:value="${_csrf.token}" />

                  <button type="submit"
                          class="btn-del"
                          onclick="return confirm('Tem certeza que deseja excluir este setor?');">
                    🗑 Excluir
                  </button>
                </form>
              </div>
            </td>
          </tr>

          <tr th:if="${#lists.isEmpty(setores)}">
            <td colspan="4"
                style="text-align:center;color:var(--color-muted-5)">
              Nenhum setor cadastrado.
            </td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="form-panel" id="form-panel" style="display:none">
      <form class="form-card"
            id="setor-form"
            th:action="@{/dashboard/setores}"
            th:object="${setorDTO}"
            method="post">

        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}" />

        <input type="hidden" th:field="*{id}"/>

        <div class="form-title" id="form-title">Novo Setor</div>

        <div class="field">
          <label for="nome">Nome do Setor</label>
          <input type="text" id="nome" th:field="*{nome}" class="form-control" placeholder="Ex: Costura, Acabamento..." required />
        </div>

        <div class="field">
          <label for="possui-etapas-select">Possui etapas de produção?</label>
          <select th:field="*{possuiEtapas}"
                  id="possui-etapas-select"
                  class="form-control"
                  onchange="toggleEtapasContainer()">
            <option th:value="true">Sim</option>
            <option th:value="false">Não</option>
          </select>
        </div>

        <!-- Container dinâmico das etapas do setor -->
        <div class="field" id="container-etapas-setor" style="display:none;">
          <label>Etapas/Processos do Setor</label>
          <div class="etapas-list" id="etapas-setor-list">
            <!-- Preenchido via JavaScript -->
          </div>
          <button type="button" class="btn-add-etapa" onclick="adicionarEtapaSetor()">
            + Adicionar Etapa
          </button>
        </div>

        <div class="form-actions">
          <button type="button" class="btn-cancel" onclick="hideForm()">Cancelar</button>
          <button type="submit" class="btn-submit">Salvar</button>
        </div>

      </form>
    </div>

  </div>
</main>

<script th:src="@{/js/cadastro-setor.js}"></script>
<script th:src="@{/js/sidebar.js}"></script>
<script th:src="@{/js/alerts.js}"></script>
</body>
</html>
