<!DOCTYPE html>
<html lang="pt-BR"
      th:lang="${#locale.toLanguageTag()}"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <th:block th:replace="~{fragments/theme :: init}"></th:block>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <title>Ordens de Produção - LumiFlow</title>

    <link rel="stylesheet" th:href="@{/css/variables.css}">
    <link rel="stylesheet" th:href="@{/css/globals.css}">
    <link rel="stylesheet" th:href="@{/css/sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/topbar.css}">
    <link rel="stylesheet" th:href="@{/css/components/buttons.css}">
    <link rel="stylesheet" th:href="@{/css/components/forms.css}">
    <link rel="stylesheet" th:href="@{/css/components/tables.css}">
    <link rel="stylesheet" th:href="@{/css/components/cards.css}">
    <link rel="stylesheet" th:href="@{/css/components/status.css}">
    <link rel="stylesheet" th:href="@{/css/components/alerts.css}">
    <link rel="stylesheet" th:href="@{/css/components/modal.css}">
    <link rel="stylesheet" th:href="@{/css/pages/listaordem.css}">
    <link rel="stylesheet" th:href="@{/css/utils.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css}">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="page-ordemproducao-listaordem"
      th:data-setor-id="${setorIdAtual}">

<div th:replace="~{fragments/messages :: alerts}"></div>

<aside th:replace="~{fragments/sidebar :: sidebar(activePage='ordens-setor')}"></aside>

<main class="main">

    <div th:replace="~{fragments/topbar :: topbar(
        'Ordens de Produção',
        'VOLTAR',
        'voltarPagina'
    )}"></div>

    <div class="content">

        <!-- FILTROS -->
        <form method="get"
              th:action="@{/dashboard/ordens-setor/{setorId}(setorId=${setorIdAtual})}"
              class="filtros"
              id="formFiltros">

            <div class="search-input-wrapper">
                <input class="filtro-input"
                       type="text"
                       name="busca"
                       th:value="${param.busca}"
                       placeholder="🔍 Buscar número ou produto..."
                       autocomplete="off"/>
            </div>

            <select class="filtro-select"
                    name="status"
                    id="filtroStatus">
                <option value="">Todos os status</option>
                <option value="DISPONIVEL"
                        th:selected="${param.status != null and param.status[0] == 'DISPONIVEL'}">
                    Disponível
                </option>
                <option value="LIBERADA"
                        th:selected="${param.status != null and param.status[0] == 'LIBERADA'}">
                    Liberada
                </option>
                <option value="EM_ANDAMENTO"
                        th:selected="${param.status != null and param.status[0] == 'EM_ANDAMENTO'}">
                    Em andamento
                </option>
                <option value="CONCLUIDA"
                        th:selected="${param.status != null and param.status[0] == 'CONCLUIDA'}">
                    Concluída
                </option>
            </select>

        </form>

        <!-- TABELA DE ORDENS -->
        <div class="panel">

            <div class="panel-header">
                <span class="panel-title">Ordens</span>

                <span class="panel-count"
                      th:text="${(ordens != null ? #lists.size(ordens) : 0) + ' ordens encontradas'}">
                    0 ordens encontradas
                </span>
            </div>

            <table>
                <thead>
                <tr>
                    <th>NÚMERO</th>
                    <th>PRODUTO/CÓDIGO</th>
                    <th>SETOR/ETAPA</th>
                    <th>QTD</th>
                    <th>PROGRESSO</th>
                    <th>OBSERVAÇÃO</th>
                    <th>DATA CRIAÇÃO</th>
                    <th>STATUS</th>
                    <th class="csp-style-699c3e909c">AÇÃO</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="ordem : ${ordens}"
                    th:data-status="${ordem.status() != null ? ordem.status().name() : ''}">

                    <!-- NÚMERO -->
                    <td class="num" th:text="${ordem.numero()}"></td>

                    <!-- PRODUTO -->
                    <td class="produto-nome">
                        <span th:text="${ordem.produtoNome() + ' - ' +
                            ordem.produtoCodigo() +
                            (ordem.variante() != null
                                ? ' (' + ordem.variante() + ')'
                                : '')}">
                        </span>

                        <span th:if="${ordem.origemRefugo()}"
                              class="badge-refugo"
                              title="Contém peças de refugo/retrabalho">
                            🔧 Refugo
                        </span>
                    </td>

                    <!-- SETOR/ETAPA -->
                    <td>
                        <span class="setor-tag"
                              th:text="${ordem.etapaNome() ?: '—'}">
                        </span>
                    </td>

                    <!-- QUANTIDADE -->
                    <td th:text="${ordem.quantidade()}"></td>

                    <!-- PROGRESSO -->
                    <td>
                        <div class="prog-wrap">
                            <div class="prog-track">
                                <div class="prog-fill progress-value"
                                     th:classappend="${ordem.status() != null
                                         and ordem.status().name() == 'CONCLUIDA'}
                                         ? 'p-con' : 'p-and'"
                                     th:data-progress="${ordem.percentual()}">
                                </div>
                            </div>

                            <span class="prog-txt"
                                  th:text="${ordem.produzido() + '/' + ordem.quantidade()}">
                            </span>
                        </div>
                    </td>

                    <!-- OBSERVAÇÃO -->
                    <td>
                        <span th:text="${ordem.observacao() != null
                            and !ordem.observacao().isBlank()
                            ? ordem.observacao()
                            : '—'}">
                        </span>
                    </td>

                    <!-- DATA -->
                    <td th:text="${#temporals.format(ordem.criadoEm(), 'dd/MM/yyyy')}">
                    </td>

                    <!-- STATUS -->
                    <td>
                        <span th:if="${ordem.status() != null
                                and ordem.status().name() == 'DISPONIVEL'}"
                              class="status s-pen">
                            <span class="s-dot"></span>
                            Disponível
                        </span>

                        <span th:if="${ordem.status() != null
                                and ordem.status().name() == 'LIBERADA'}"
                              class="status s-lib">
                            <span class="s-dot"></span>
                            Liberada
                        </span>

                        <span th:if="${ordem.status() != null
                                and ordem.status().name() == 'EM_ANDAMENTO'}"
                              class="status s-and">
                            <span class="s-dot"></span>
                            Em andamento
                        </span>

                        <span th:if="${ordem.status() != null
                                and ordem.status().name() == 'CONCLUIDA'}"
                              class="status s-con">
                            <span class="s-dot"></span>
                            Concluída
                        </span>
                    </td>

                    <!-- AÇÕES -->
                    <td class="csp-style-72a68ac344">
                        <div class="table-actions">

                            <!-- LIBERAR -->
                            <form th:if="${ordem.status() != null
                                    and ordem.status().name() == 'DISPONIVEL'}"
                                  sec:authorize="hasAnyRole('ADMIN', 'GESTAO', 'SUPERVISOR', 'PCP')"
                                  method="post"
                                  class="csp-style-0cd28ce9ba"
                                  th:action="@{/dashboard/ordens-setor/{setorId}/ordens/{ordemSetorId}/liberar(
                                      setorId=${setorIdAtual},
                                      ordemSetorId=${ordem.ordemSetorId()})}">

                                <input type="hidden"
                                       th:name="${_csrf.parameterName}"
                                       th:value="${_csrf.token}"/>

                                <button type="submit" class="btn-liberar">
                                    Liberar
                                </button>
                            </form>

                            <!-- DIVIDIR -->
                            <button th:if="${ordem.status() != null && ordem.status().name() == 'DISPONIVEL'
                                    && !ordem.origemRefugo() && ordem.produzido() == 0}"
                                    sec:authorize="hasAnyRole('ADMIN', 'GESTAO', 'SUPERVISOR','PCP')"
                                    type="button" class="btn-dividir"
                                    th:data-id="${ordem.ordemSetorId()}"
                                    th:data-qtd="${ordem.quantidade()}"
                                    th:data-nome="${ordem.produtoNome()}"
                                    th:data-setor="${setorIdAtual}">
                                Dividir
                            </button>

                            <!-- LANÇAR -->
                            <a th:if="${ordem.status() != null
                                    and (ordem.status().name() == 'LIBERADA'
                                    or ordem.status().name() == 'EM_ANDAMENTO')}"
                               th:href="@{/dashboard/ordens/{id}/setor/{setorId}/lancar(
                                   id=${ordem.id()},
                                   setorId=${ordem.ordemSetorId()})}"
                               class="btn-lancar">
                                Lançar
                            </a>
                            <form th:if="${ordem.status() != null &&
                                  (ordem.status().name() == 'LIBERADA' || ordem.status().name() == 'EM_ANDAMENTO')}"
                                  sec:authorize="hasAnyRole('ADMIN', 'GESTAO', 'SUPERVISOR','PCP')"
                                  method="post"
                                  th:action="@{/dashboard/ordens-setor/{setorId}/ordens/{ordemSetorId}/pausar(setorId=${setorIdAtual}, ordemSetorId=${ordem.ordemSetorId()})}"
                                  onsubmit="return confirm('Voltar esta etapa para Disponível? A produção será interrompida até uma nova liberação.');"
                                  style="display:inline;">
                                <button type="submit" class="btn-pausar">Pausar</button>
                            </form>

                        </div>
                    </td>

                </tr>

                <tr th:if="${ordens == null or #lists.isEmpty(ordens)}">
                    <td colspan="9" class="csp-style-2b8dd6a649">
                        Nenhuma ordem encontrada.
                    </td>
                </tr>

                </tbody>
            </table>

            <!-- PAGINAÇÃO ATUAL -->
            <div class="paginacao"
                 th:if="${ordens != null and !#lists.isEmpty(ordens)}">

                <span class="pag-info"
                      th:text="'Mostrando 1–' + ${#lists.size(ordens)} +
                          ' de ' + ${#lists.size(ordens)} + ' ordens'">
                </span>

                <div class="pag-btns">
                    <button class="pag-btn" type="button" disabled>
                        &lsaquo;
                    </button>

                    <button class="pag-btn active" type="button">
                        1
                    </button>

                    <button class="pag-btn" type="button" disabled>
                        &rsaquo;
                    </button>
                </div>
            </div>

        </div>
    </div>
</main>

<!-- MODAL COMPARTILHADO -->
<div th:replace="~{fragments/modal-divisao :: modal('')}"></div>

<script th:src="@{/js/sidebar.js}" defer></script>
<script th:src="@{/js/alerts.js}" defer></script>
<script th:src="@{/js/lista-ordem.js}" defer></script>
<script th:src="@{/js/dividir-ordem.js}" defer></script>

</body>
</html>
