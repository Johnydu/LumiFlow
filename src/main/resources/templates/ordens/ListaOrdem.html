<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ordens de Produção - LumiFlow</title>

  <link rel="stylesheet" th:href="@{/css/variables.css}">
  <link rel="stylesheet" th:href="@{/css/globals.css}">
  <link rel="stylesheet" th:href="@{/css/sidebar.css}">
  <link rel="stylesheet" th:href="@{/css/topbar.css}">
  <link rel="stylesheet" th:href="@{/css/components/buttons.css}">
  <link rel="stylesheet" th:href="@{/css/components/forms.css}">
  <link rel="stylesheet" th:href="@{/css/components/tables.css}">
  <link rel="stylesheet" th:href="@{/css/components/cards.css}">
  <link rel="stylesheet" th:href="@{/css/components/status.css}">
  <link rel="stylesheet" th:href="@{/css/components/alerts.css}">
  <link rel="stylesheet" th:href="@{/css/pages/listaordem.css}">
  <link rel="stylesheet" th:href="@{/css/utils.css}">
  <link rel="stylesheet" th:href="@{/css/responsive.css}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="page-ordemproducao-listaordem">

<div th:replace="~{fragments/messages :: alerts}"></div>

<!-- SIDEBAR -->
<aside th:replace="~{fragments/sidebar :: sidebar(activePage='ordens')}"></aside>

<main class="main">

  <!-- TOPBAR -->
  <div th:replace="~{fragments/topbar :: topbar('Ordens de Produção', null, null)}"></div>

  <div class="content">

    <!-- FILTROS UNIFICADOS (Atualizado para respeitar a URL com ou sem setor) -->
    <form method="get"
          th:action="${setorIdAtual != null ? '/dashboard/ordens/setor/' + setorIdAtual : '/dashboard/ordens'}"
          class="filtros"
          id="formFiltros">

      <div class="search-input-wrapper">
        <input class="filtro-input"
               type="text"
               name="busca"
               th:value="${buscaAtual}"
               placeholder="🔍 Buscar número ou produto..."
               autocomplete="off"
               onchange="document.getElementById('formFiltros').submit()"/>
      </div>

      <select class="filtro-select" name="status" onchange="document.getElementById('formFiltros').submit()">
        <option value="">Todos os status</option>
        <option value="PENDENTE" th:selected="${statusAtual == 'PENDENTE'}">Pendente</option>
        <option value="EM_ANDAMENTO" th:selected="${statusAtual == 'EM_ANDAMENTO'}">Em andamento</option>
        <option value="CONCLUIDA" th:selected="${statusAtual == 'CONCLUIDA'}">Concluída</option>
      </select>
      
    </form>

    <!-- PANEL / TABELA -->
    <div class="panel">

      <div class="panel-header">
        <span class="panel-title" th:text="${setorAtual != null && setorAtual != 'Geral' ? 'Ordens - ' + setorAtual : 'Ordens'}">Ordens</span>
        <span class="panel-count" th:text="${totalOrdens + ' ordens encontradas'}">0 ordens encontradas</span>
      </div>

      <table>
        <thead>
        <tr>
          <th>NÚMERO</th>
          <th>PRODUTO</th>
          <th>QTD</th>
          <th>PROGRESSO</th>
          <th>SETOR ATUAL</th>
          <th>DATA CRIAÇÃO</th>
          <th>STATUS</th>
          <th style="width:100px; text-align: center;">AÇÃO</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="ordem : ${ordens}">

          <td class="num" th:text="${ordem.numero}">OP-001</td>

          <td class="produto-nome" th:text="${ordem.produto != null ? ordem.produto.nome : 'N/A'}">Arandela 12W</td>

          <td th:text="${ordem.quantidade}">100</td>

          <td>
            <div class="prog-wrap">
              <div class="prog-track">
                <div class="prog-fill"
                     th:classappend="${#strings.toString(ordem.status) == 'CONCLUIDA'} ? 'p-con' : 'p-and'"
                     th:style="'width:' + ${ordem.percentualConcluido != null ? ordem.percentualConcluido : 0} + '%'">
                </div>
              </div>
              <span class="prog-txt" th:text="${(ordem.quantidadeProduzida != null ? ordem.quantidadeProduzida : 0) + '/' + ordem.quantidade}">60/100</span>
            </div>
          </td>

          <td>
            <span class="setor-tag" th:text="${ordem.setor != null ? ordem.setor.nome : 'N/A'}">Pintura</span>
          </td>

          <td th:text="${#temporals.format(ordem.dataCriacao, 'dd/MM/yyyy')}">19/05/2026</td>

          <td>
            <span th:if="${#strings.toString(ordem.status) == 'PENDENTE'}" class="status s-pen">
              <span class="s-dot"></span>
              Pendente
            </span>

            <span th:if="${#strings.toString(ordem.status) == 'EM_ANDAMENTO'}" class="status s-and">
              <span class="s-dot"></span>
              Em andamento
            </span>

            <span th:if="${#strings.toString(ordem.status) == 'CONCLUIDA'}" class="status s-con">
              <span class="s-dot"></span>
              Concluída
            </span>
          </td>

          <td style="text-align: center;">
            <div class="table-actions">
              <a th:href="@{/dashboard/ordens/{id}(id=${ordem.id})}" class="btn-ver">
                Ver
              </a>
            </div>
          </td>

        </tr>

        <tr th:if="${#lists.isEmpty(ordens)}">
          <td colspan="8" style="text-align:center; color:var(--color-muted-5); padding: 30px 0;">
            Nenhuma ordem encontrada.
          </td>
        </tr>
        </tbody>
      </table>

      <!-- RODAPÉ DE PAGINAÇÃO -->
      <div class="panel-footer" th:if="${!#lists.isEmpty(ordens)}">
        <span class="pagination-info" th:text="'Mostrando 1–' + ${totalOrdens} + ' de ' + ${totalOrdens} + ' ordens'">
          Mostrando 1–5 de 24 ordens
        </span>

        <div class="pagination">
          <button class="page-btn nav-btn" type="button" disabled>&lsaquo;</button>
          <button class="page-btn active" type="button">1</button>
          <button class="page-btn nav-btn" type="button" disabled>&rsaquo;</button>
        </div>
      </div>

    </div>

  </div>

</main>

<script>
  function navegarParaSetor(nomeSetor) {
    if (nomeSetor) {
      window.location.href = '/dashboard/ordens/' + encodeURIComponent(nomeSetor);
    } else {
      window.location.href = '/dashboard/ordens';
    }
  }
</script>

<script th:src="@{/js/lista-ordem.js}"></script>
<script th:src="@{/js/sidebar.js}"></script>
<script th:src="@{/js/alerts.js}"></script>

</body>
</html>
