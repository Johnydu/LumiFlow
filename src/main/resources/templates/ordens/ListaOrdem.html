<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
     xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Ordens de Produção - LumiFlow</title>

  <link rel="stylesheet" th:href="@{/css/variables.css}">
  <link rel="stylesheet" th:href="@{/css/globals.css}">
  <link rel="stylesheet" th:href="@{/css/sidebar.css}">
  <link rel="stylesheet" th:href="@{/css/topbar.css}">
  <link rel="stylesheet" th:href="@{/css/components/buttons.css}">
  <link rel="stylesheet" th:href="@{/css/components/forms.css}">
  <link rel="stylesheet" th:href="@{/css/components/tables.css}">
  <link rel="stylesheet" th:href="@{/css/components/cards.css}">
  <link rel="stylesheet" th:href="@{/css/components/status.css}">
  <link rel="stylesheet" th:href="@{/css/components/alerts.css}">
  <link rel="stylesheet" th:href="@{/css/pages/listaordem.css}">
  <link rel="stylesheet" th:href="@{/css/utils.css}">
  <link rel="stylesheet" th:href="@{/css/responsive.css}">
</head>

<body class="page-ordemproducao-listaordem">

<aside th:replace="~{fragments/sidebar :: sidebar(activePage='ordens')}"></aside>

<main class="main">

  <div th:replace="~{fragments/topbar :: topbar(
        'Ordens de Produção',
        '+ Nova Ordem',
        'novaOrdemForm()'
    )}">
  </div>

  <div th:if="${message}"
       th:class="${messageType == 'success'} ? 'alert-success' : 'alert-error'">
    <span th:text="${message}"></span>
  </div>

  <div class="content">

    <!-- FILTROS -->
    <form method="get"
          th:action="@{/dashboard/ordens}"
          class="filtros">

      <input class="filtro-input"
             type="text"
             name="busca"
             th:value="${param.busca}"
             placeholder="Buscar número ou produto..."/>

      <select class="filtro-select" name="status">
        <option value="">Todos os status</option>
        <option value="PENDENTE">Pendente</option>
        <option value="EM_ANDAMENTO">Em andamento</option>
        <option value="CONCLUIDA">Concluída</option>
      </select>

      <button type="submit" class="btn-submit">
        Filtrar
      </button>

    </form>

    <!-- TABELA -->
    <div class="panel">

      <div class="panel-header">
                <span class="panel-title">
                    Ordens de Produção
                </span>

        <span class="panel-count"
              th:text="${#lists.size(ordens) + ' ordem(ns)'}">
                </span>
      </div>

      <table>

        <thead>
        <tr>
          <th>Número</th>
          <th>Produto</th>
          <th>Qtd.</th>
          <th>Progresso</th>
          <th>Setor Atual</th>
          <th>Data</th>
          <th>Status</th>
          <th style="width:120px">Ações</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="ordem : ${ordens}">

          <td class="num"
              th:text="${ordem.numero()}">
          </td>

          <td th:text="${ordem.produtoNome()}"></td>

          <td th:text="${ordem.quantidade()}"></td>

          <td>
            <div class="prog-wrap">

              <div class="prog-track">
                <div class="prog-fill p-and"
                     th:style="'width:' + ${ordem.percentual()} + '%'">
                </div>
              </div>

              <span class="prog-txt"
                    th:text="${ordem.produzido() + '/' + ordem.quantidade()}">
                            </span>

            </div>
          </td>

          <td>
                        <span class="setor-tag"
                              th:text="${ordem.setorAtual()}">
                        </span>
          </td>

          <td th:text="${#temporals.format(ordem.criadoEm(),'dd/MM/yyyy')}">
          </td>

          <td>

                        <span th:if="${ordem.status().name() == 'PENDENTE'}"
                              class="status s-pen">
                            <span class="s-dot"></span>
                            Pendente
                        </span>

            <span th:if="${ordem.status().name() == 'EM_ANDAMENTO'}"
                  class="status s-and">
                            <span class="s-dot"></span>
                            Em andamento
                        </span>

            <span th:if="${ordem.status().name() == 'CONCLUIDA'}"
                  class="status s-con">
                            <span class="s-dot"></span>
                            Concluída
                        </span>

          </td>

          <td>

            <div class="table-actions">

              <a th:href="@{/dashboard/ordens/{id}(id=${ordem.id()})}"
                 class="btn-ver">
                Ver
              </a>

            </div>

          </td>

        </tr>

        <tr th:if="${#lists.isEmpty(ordens)}">
          <td colspan="8"
              style="text-align:center;color:var(--color-muted-5)">
            Nenhuma ordem encontrada.
          </td>
        </tr>

        </tbody>

      </table>

    </div>

  </div>

</main>

<script th:src="@{/js/sidebar.js}"></script>
<script th:src="@{/js/alerts.js}"></script>

</body>
</html>
