<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Ordens por Setor - LumiFlow</title>
    <link rel="stylesheet" th:href="@{/css/variables.css}">
    <link rel="stylesheet" th:href="@{/css/globals.css}">
    <link rel="stylesheet" th:href="@{/css/sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/topbar.css}">
    <link rel="stylesheet" th:href="@{/css/components/buttons.css}">
    <link rel="stylesheet" th:href="@{/css/components/forms.css}">
    <link rel="stylesheet" th:href="@{/css/components/tables.css}">
    <link rel="stylesheet" th:href="@{/css/components/cards.css}">
    <link rel="stylesheet" th:href="@{/css/components/badges.css}">
    <link rel="stylesheet" th:href="@{/css/components/status.css}">
    <link rel="stylesheet" th:href="@{/css/components/alerts.css}">
    <link rel="stylesheet" th:href="@{/css/pages/listaordemsetores.css}">
    <link rel="stylesheet" th:href="@{/css/utils.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="page-ordemproducao-listaordemsetores">
<div th:replace="~{fragments/messages :: alerts}"></div>

<!-- SIDEBAR -->
<aside th:replace="~{fragments/sidebar :: sidebar(activePage='ordens')}"></aside>

<main class="main">

    <!-- TOPBAR -->
    <div th:replace="~{fragments/topbar :: topbar(
        'Setores de Produção',
        null,
        null
    )}"></div>

    <div class="content">

        <!-- FILTROS UNIFICADOS -->
        <form method="get" th:action="@{/dashboard/ordens}" id="formFiltros" class="filtros">
            <input type="text"
                   name="busca"
                   th:value="${param.busca}"
                   class="filtro-input"
                   placeholder="🔍 Buscar por setor..."
                   autocomplete="off">

            <input type="date"
                   name="data"
                   th:value="${param.data}"
                   class="filtro-date">
        </form>

        <!-- PANEL / LISTA -->
        <div class="panel">
            <div class="panel-header">
                <span class="panel-title">Ordens por Setor</span>
                <span class="panel-count" th:text="${#lists.size(resumoSetores) + ' setor(es) encontrado(s)'}">0 setor(es)</span>
            </div>

            <table>
                <thead>
                <tr>
                    <th style="width:110px">DATA</th>
                    <th>SETOR</th>
                    <th style="width:700px;">OPERADORES</th>
                    <th style="width:250px;">QTD. ORDENS</th>
                    <th style="width:200px;">PROGRESSO</th>
                    <th style="width:90px; text-align:center;">AÇÃO</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="item : ${resumoSetores}" th:data-setor-id="${item.setorId()}">

                    <td class="num" th:text="${#temporals.format(item.data(), 'dd/MM/yyyy')}">06/08/2026</td>

                    <td>
                        <span class="setor-tag" th:text="${item.setorNome()}">Pintura</span>
                    </td>

                    <!-- OPERADORES EDITÁVEIS INLINE -->
                    <!-- OPERADORES FIXOS (APENAS LEITURA) -->
                    <td>
                        <span th:text="${item.operadores() != null && !item.operadores().isEmpty() ? item.operadores() : 'Nenhum operador'}">
                            Nome dos operadores
                        </span>
                    </td>

                    <td>
                        <span class="badge-count" th:text="${item.qtdOrdens() + ' OPs'}">0 OPs</span>
                    </td>

                    <td>
                        <div class="prog-wrap">
                            <div class="prog-track">
                                <!-- BARRA DE PROGRESSO CORRIGIDA COM LARGURA E COR -->
                                <div class="prog-fill"
                                     th:style="'width:' + ${#numbers.formatDecimal(item.percentualConcluido(), 1, 2)} + '%; background: var(--color-primary, #6157ff);'">
                                </div>
                            </div>
                            <span class="prog-txt"
                                  th:text="${item.ordensConcluidas() + '/' + item.qtdOrdens() + ' (' + #numbers.formatDecimal(item.percentualConcluido(), 1, 0) + '%)'}">
                                0/0 (0%)
                            </span>
                        </div>
                    </td>

                    <!-- BOTÃO COM REDIRECIONAMENTO VIA JS -->
                    <td style="text-align:center;">
                        <button type="button"
                                class="btn-ver"
                                th:onclick="'window.location.href=\'' + @{/dashboard/ordens/setor/{id}(id=${item.setorId()})} + '\''">
                            Ver
                        </button>
                    </td>

                </tr>

                <tr th:if="${#lists.isEmpty(resumoSetores)}">
                    <td colspan="6" style="text-align:center; color:#888; padding: 3rem;">
                        Nenhum setor encontrado.
                    </td>
                </tr>

                </tbody>
            </table>
        </div>

    </div>

</main>

<script th:src="@{/js/sidebar.js}"></script>
<script th:src="@{/js/alerts.js}"></script>
<script th:src="@{/js/lista-ordem-setores.js}"></script>

</body>
</html>
