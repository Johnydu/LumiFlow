<!DOCTYPE html>
<html lang="pt-BR" th:lang="${#locale.toLanguageTag()}" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <th:block th:replace="~{fragments/theme :: init}"></th:block>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Ordens por Setor - LumiFlow</title>
    <link rel="stylesheet" th:href="@{/css/variables.css}">
    <link rel="stylesheet" th:href="@{/css/globals.css}">
    <link rel="stylesheet" th:href="@{/css/sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/topbar.css}">
    <link rel="stylesheet" th:href="@{/css/components/buttons.css}">
    <link rel="stylesheet" th:href="@{/css/components/forms.css}">
    <link rel="stylesheet" th:href="@{/css/components/tables.css}">
    <link rel="stylesheet" th:href="@{/css/components/cards.css}">
    <link rel="stylesheet" th:href="@{/css/components/badges.css}">
    <link rel="stylesheet" th:href="@{/css/components/status.css}">
    <link rel="stylesheet" th:href="@{/css/components/alerts.css}">
    <link rel="stylesheet" th:href="@{/css/pages/listaordemsetores.css}">
    <link rel="stylesheet" th:href="@{/css/utils.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
          integrity="sha384-iw3OoTErCYJJB9mCa8LNS2hbsQ7M3C0EpIsO/H5+EGAkPGc6rk+V8i04oW/K5xq0"
          crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body class="page-ordemproducao-listaordemsetores">
<div th:replace="~{fragments/messages :: alerts}"></div>

<!-- SIDEBAR -->
<aside th:replace="~{fragments/sidebar :: sidebar(activePage='ordens-setor')}"></aside>

<main class="main">

    <!-- TOPBAR -->


    <div th:replace="~{fragments/topbar :: topbar(
    'Setores de Produção',
    '+ Nova Ordem',
    'novaOrdemForm',
    false
)}"></div>

    <div class="content">

        <!-- FILTROS UNIFICADOS -->
        <form method="get" th:action="@{/dashboard/ordens-setor}" id="formFiltros" class="filtros">
            <div class="field">
            <label for="buscaSetorOrdens">Buscar por setor</label>
            <input type="text"
                   id="buscaSetorOrdens"
                   name="busca"
                   th:value="${param.busca}"
                   class="search"
                   autocomplete="off">
            </div>
        </form>

        <!-- PANEL / LISTA -->
        <div class="panel">
            <div class="panel-header">
                <span class="panel-title">Ordens por Setor</span>
                <span class="panel-count" th:text="${#lists.size(resumoSetores) + ' setor(es) encontrado(s)'}">0 setor(es)</span>
            </div>

            <table>
                <thead>
                <tr>
                    <th>SETOR</th>
                    <th class="csp-style-10d1c7af9b">OPERADORES</th>
                    <th class="csp-style-d15f904694">QTD. ORDENS</th>
                    <th class="csp-style-d4a09a0d6e">PROGRESSO</th>
                    <th class="csp-style-bda9996f7a">AÇÃO</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="item : ${resumoSetores}" th:data-setor-id="${item.setorId()}">

                    <td>
                        <span class="setor-tag" th:text="${item.setorNome()}">Pintura</span>
                    </td>

                    <td>
                        <span th:text="${item.operadores() != null && !item.operadores().isEmpty()
                         ? item.operadores() : 'Nenhum operador'}">
                            Nome dos operadores
                        </span>
                    </td>

                    <td>
                        <span class="badge-count" th:text="${item.qtdOrdens() + ' OPs'}">0 OPs</span>
                    </td>

                    <td>
                        <div class="prog-wrap">
                            <div class="prog-track">
                                <!-- BARRA DE PROGRESSO AJUSTADA -->
                                <div class="prog-fill p-and progress-value"
                                     th:data-progress="${item.percentualConcluido()}">
                                </div>
                            </div>
                            <span class="prog-txt"
                                  th:text="${item.ordensConcluidas() + '/' + item.qtdOrdens()
                                   + ' (' + #numbers.formatDecimal(item.percentualConcluido(), 1, 0) + '%)'}">
                                0/0 (0%)
                            </span>
                        </div>
                    </td>


                    <td class="csp-style-dac4fe6c9b">
                        <a th:href="@{/dashboard/ordens-setor/{setorId}(setorId=${item.setorId()})}" class="btn-ver">
                            Ver
                        </a>
                    </td>


                </tr>

                <tr th:if="${#lists.isEmpty(resumoSetores)}">
                    <td colspan="5" class="csp-style-4a220b5618">
                        Nenhum setor encontrado.
                    </td>
                </tr>

                </tbody>
            </table>
        </div>

    </div>

</main>

<script th:src="@{/js/sidebar.js}"></script>
<script th:src="@{/js/alerts.js}"></script>
<script th:src="@{/js/lista-ordem-setores.js}"></script>

</body>
</html>
