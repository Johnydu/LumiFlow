<!DOCTYPE html>
<html lang="pt-BR" th:lang="${#locale.toLanguageTag()}" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <th:block th:replace="~{fragments/theme :: init}"></th:block>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Lançamento - LumiFlow</title>
    <link rel="stylesheet" th:href="@{/css/variables.css}">
    <link rel="stylesheet" th:href="@{/css/globals.css}">
    <link rel="stylesheet" th:href="@{/css/sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/topbar.css}">
    <link rel="stylesheet" th:href="@{/css/components/buttons.css}">
    <link rel="stylesheet" th:href="@{/css/components/forms.css}">
    <link rel="stylesheet" th:href="@{/css/components/cards.css}">
    <link rel="stylesheet" th:href="@{/css/components/status.css}">
    <link rel="stylesheet" th:href="@{/css/components/badges.css}">
    <link rel="stylesheet" th:href="@{/css/components/tables.css}">
    <link rel="stylesheet" th:href="@{/css/components/alerts.css}">
    <link rel="stylesheet" th:href="@{/css/components/tabs.css}">
    <link rel="stylesheet" th:href="@{/css/pages/lancamento.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css}"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="page-ordemproducao-lancamento"
      th:data-url-voltar="@{/dashboard/ordens-setor/{setorId}(setorId=${ordemSetor.setor.id})}"
      th:data-produto-id="${ordem.produto.id}"
      th:data-aba-erro="${#fields.hasErrors('producaoDTO.*') ? 'producao' :
                          (#fields.hasErrors('refugoDTO.*') ? 'refugo' :
                          (#fields.hasErrors('retrabalhoDTO.*') ? 'retrabalho' : ''))}">


<div th:replace="~{fragments/messages :: alerts}"></div>

<aside th:replace="~{fragments/sidebar :: sidebar(activePage='ordens-setor')}"></aside>

<main class="main">
    <div th:replace="~{fragments/topbar :: topbar(
        'LANÇAR PRODUÇÃO',
        'VOLTAR',
        'voltarPagina'
    )}">
    </div>

    <div class="content">

        <!-- PRODUTO DESTACADO -->
        <div class="produto-destaque">
            <div>
                <div class="produto-nome" th:text="${ordem.produto.nome}">Arandela 12W</div>
                <div class="produto-op" th:text="${ordem.numero}">OP-001</div>
            </div>
            <div class="produto-badges">
                <span class="badge-etapa" th:if="${etapaNome != null}" th:text="${etapaNome}">2ª Dobra</span>
                <span class="badge-setor" th:text="${ordemSetor.setor.nome}">Dobra</span>
                <span class="badge-disp" th:text="${ordemSetor.qtdPendente} + ' disp.'">40 disp.</span>
            </div>
        </div>

        <!-- ABAS -->
        <div class="tabs">
            <button class="tab active" id="tab-btn-prod" type="button" data-csp-action="showTab" data-csp-value="producao">Produção</button>
            <button class="tab" id="tab-btn-ref" type="button" data-csp-action="showTab" data-csp-value="refugo">Refugo</button>
            <button class="tab" id="tab-btn-ret" type="button" data-csp-action="showTab" data-csp-value="retrabalho">Retrabalho</button>
        </div>

        <!-- FORM PRODUÇÃO -->
        <div id="tab-producao" class="form-card">
            <form method="post" th:action="@{/dashboard/ordens/{ordemId}/setor/{ordemSetorId}/lancar/producao
            (ordemId=${ordem.id}, ordemSetorId=${ordemSetor.id})}"
                  th:object="${producaoDTO}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="form-grid">
                    
                    <div class="field">
                        <label>Quantidade produzida <span>*</span></label>
                        <input type="number" th:field="*{quantidade}" min="1" th:max="${ordemSetor.qtdPendente}"
                               placeholder="0"/>
                        <span class="hint warn" th:text="'Máximo: ' + ${ordemSetor.qtdPendente} +
                         ' unid.'">Máximo: 40 unid.
                        </span>
                    </div>
                </div>
                <div class="form-grid">
                    <div class="field">
                        <label>Máquina <span>*</span></label>
                        <select th:field="*{maquinaId}">
                            <option value="">Selecione a máquina</option>
                            <option th:each="m : ${maquinas}" th:value="${m.id}" th:text="${m.nome}"></option>
                        </select>
                    </div>
                    <div class="field">
                        <label>Operador <span>*</span></label>
                        <select th:field="*{operadorId}">
                            <option value="">Selecione o operador</option>
                            <option th:each="o : ${operadores}" th:value="${o.id}" th:text="${o.nome}"></option>
                        </select>
                    </div>
                </div>



                <div class="field csp-style-2b583d7389">
                    <label>Observação</label>
                    <input type="text" th:field="*{observacao}" placeholder="Opcional..."/>
                </div>

                <div class="form-actions">
                    <a th:href="@{/dashboard/ordens-setor/{setorId}(setorId=${ordemSetor.setor.id})}"
                       class="btn-cancel csp-style-4edeb9e71d">Cancelar</a>
                    <button type="submit" class="btn-submit">Confirmar</button>
                </div>
            </form>
        </div>

        <!-- FORM REFUGO -->
        <div id="tab-refugo" class="form-card csp-style-6b99de8b69">
            <form method="post" th:action="@{/dashboard/ordens/{ordemId}/setor/{ordemSetorId}/lancar/refugo
            (ordemId=${ordem.id}, ordemSetorId=${ordemSetor.id})}"
                  th:object="${refugoDTO}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="form-grid">
                    <div class="field">
                        <label>Quantidade refugada <span>*</span></label>
                        <input type="number" th:field="*{quantidade}" min="1" placeholder="0"/>
                    </div>
                    <div class="field">
                        <label>Setor de origem do erro <span>*</span></label>
                        <select th:field="*{setorOrigemId}" id="selectSetorOrigemRefugo">
                            <option value="">Selecione o setor</option>
                            <option th:each="s : ${setores}" th:value="${s.id}" th:text="${s.nome}"></option>
                        </select>
                    </div>

                    <div class="field csp-style-6b99de8b69" id="campoEtapaOrigemRefugo">
                        <label>Etapa específica <span>*</span></label>
                        <select th:field="*{etapaSetorId}" id="selectEtapaOrigemRefugo">
                            <option value="">Selecione a etapa</option>
                        </select>
                    </div>
                </div>

                <div class="form-grid">
                    <div class="field">
                        <label>Operador <span>*</span></label>
                        <select th:field="*{operadorId}">
                            <option value="">Selecione o operador</option>
                            <option th:each="o : ${operadores}" th:value="${o.id}" th:text="${o.nome}"></option>
                        </select>
                    </div>
                    <div class="field">
                        <label>Destino <span>*</span></label>
                        <select th:field="*{destino}">
                            <option value="">Selecione</option>
                            <option value="RETRABALHO">Retrabalho</option>
                            <option value="DESCARTE">Descarte</option>
                        </select>
                    </div>
                </div>

                <div class="field csp-style-2b583d7389">
                    <label>Motivo <span>*</span></label>
                    <textarea th:field="*{motivo}" placeholder="Descreva o motivo do refugo..." required></textarea>
                </div>

                <div class="form-actions">
                    <a th:href="@{/dashboard/ordens-setor/{setorId}(setorId=${ordemSetor.setor.id})}"
                       class="btn-cancel csp-style-4edeb9e71d">Cancelar</a>
                    <button type="submit" class="btn-submit refugo">Confirmar Refugo</button>
                </div>
            </form>
        </div>

        <!-- FORM RETRABALHO -->
        <div id="tab-retrabalho" class="form-card csp-style-6b99de8b69">
            <form method="post" th:action="@{/dashboard/ordens/{ordemId}/setor/{ordemSetorId}/lancar/retrabalho
            (ordemId=${ordem.id}, ordemSetorId=${ordemSetor.id})}"
                  th:object="${retrabalhoDTO}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="form-grid">
                    <div class="field">
                        <label>Refugo vinculado <span>*</span></label>
                        <select th:field="*{refugoId}" id="selectRefugoRetrabalho" data-csp-change="filtrarMaquinasRetrabalho">
                            <option value="">Selecione o refugo</option>
                            <option th:each="r : ${refugosParaRetrabalho}" th:value="${r.id}"
                                    th:data-setor-origem="${r.setorOrigem.id}"
                                    th:text="'REF-' + ${#numbers.formatInteger(r.id, 3)} + ' · ' + ${r.qtdRefugo} + ' unid. · ' + ${r.motivo}"></option>
                        </select>
                    </div>
                    <div class="field">
                        <label>Máquina</label>
                        <select th:field="*{maquinaId}" id="selectMaquinaRetrabalho">
                            <option value="">Selecione o refugo primeiro (opcional)</option>
                            <option th:each="m : ${todasMaquinasParaRetrabalho}" th:value="${m.id}"
                                    th:data-setor="${m.setor.id}" th:text="${m.nome}"></option>
                        </select>
                    </div>
                </div>

                <div class="form-grid">
                    <div class="field">
                        <label>Operador <span>*</span></label>
                        <select th:field="*{operadorId}">
                            <option value="">Selecione o operador</option>
                            <option th:each="o : ${operadores}" th:value="${o.id}" th:text="${o.nome}"></option>
                        </select>
                    </div>
                    <div class="field">
                        <label>Quantidade refeita <span>*</span></label>
                        <input type="number" th:field="*{quantidade}" min="1" placeholder="0"/>
                    </div>
                </div>

                <div class="field csp-style-2b583d7389">
                    <label>Observação</label>
                    <textarea th:field="*{observacao}" placeholder="Descreva o que foi corrigido..."></textarea>
                </div>

                <div class="form-actions">
                    <a th:href="@{/dashboard/ordens-setor/{setorId}(setorId=${ordemSetor.setor.id})}"
                       class="btn-cancel csp-style-4edeb9e71d">Cancelar</a>
                    <button type="submit" class="btn-submit retrab">Confirmar Retrabalho</button>
                </div>
            </form>
        </div>

    </div>
</main>

<script th:src="@{/js/sidebar.js}"></script>
<script th:src="@{/js/alerts.js}"></script>
<script th:src="@{/js/lancamento.js}"></script>

</body>
</html>
