<!DOCTYPE html>
<html lang="pt-BR" th:lang="${#locale.toLanguageTag()}" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <th:block th:replace="~{fragments/theme :: init}"></th:block>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Lançamento - LumiFlow</title>
    <link rel="stylesheet" th:href="@{/css/variables.css}">
    <link rel="stylesheet" th:href="@{/css/globals.css}">
    <link rel="stylesheet" th:href="@{/css/sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/topbar.css}">
    <link rel="stylesheet" th:href="@{/css/components/buttons.css}">
    <link rel="stylesheet" th:href="@{/css/components/forms.css}">
    <link rel="stylesheet" th:href="@{/css/components/cards.css}">
    <link rel="stylesheet" th:href="@{/css/components/status.css}">
    <link rel="stylesheet" th:href="@{/css/components/badges.css}">
    <link rel="stylesheet" th:href="@{/css/components/tables.css}">
    <link rel="stylesheet" th:href="@{/css/components/alerts.css}">
    <link rel="stylesheet" th:href="@{/css/components/tabs.css}">
    <link rel="stylesheet" th:href="@{/css/components/modal.css}">
    <link rel="stylesheet" th:href="@{/css/pages/lancamento.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css}"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
          integrity="sha384-iw3OoTErCYJJB9mCa8LNS2hbsQ7M3C0EpIsO/H5+EGAkPGc6rk+V8i04oW/K5xq0"
          crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body class="page-ordemproducao-lancamento"
      th:data-url-voltar="@{/dashboard/ordens-setor/{setorId}(setorId=${ordemSetor.setor.id})}"
      th:data-roteiro-id="${ordem.roteiro.id}"
      th:data-aba-erro="${#fields.hasErrors('producaoDTO.*') ? 'producao' :
                          (#fields.hasErrors('refugoDTO.*') ? 'refugo' :
                          (#fields.hasErrors('retrabalhoDTO.*') ? 'retrabalho' : ''))}">

<div th:replace="~{fragments/messages :: alerts}"></div>

<aside th:replace="~{fragments/sidebar :: sidebar(activePage='ordens-setor')}"></aside>

<main class="main">
    <div th:replace="~{fragments/topbar :: topbar(
        'LANÇAR PRODUÇÃO',
        'VOLTAR',
        'voltarPagina'
    )}">
    </div>

    <div class="content">

        <!-- PRODUTO DESTACADO -->
        <div class="produto-destaque">
            <div>
                <span class="produto-codigo produto-codigo--destaque" th:text="${ordem.produto.codigo}">123456</span>
                <div class="produto-nome" th:if="${ordem.produto.nome != null}" th:text="${ordem.produto.nome}">Arandela 12W</div>
                <div class="produto-op" th:text="${ordem.numero}">OP-001</div>
            </div>
            <div class="produto-badges">
                <span class="badge-etapa" th:if="${etapaNome != null}" th:text="${etapaNome}">2ª Dobra</span>
                <span class="badge-setor" th:text="${ordemSetor.setor.nome}">Dobra</span>
                <span class="badge-disp" th:text="${ordemSetor.qtdPendente} + ' disp.'">40 disp.</span>
            </div>
        </div>

        <!-- ABAS -->
        <div class="tabs" role="tablist" aria-label="Tipo de lançamento">
            <button class="tab active" id="tab-btn-prod" type="button" role="tab"
                    aria-controls="tab-producao" aria-selected="true" tabindex="0"
                    data-csp-action="showTab" data-csp-value="producao">Produção</button>
            <button class="tab" id="tab-btn-ref" type="button" role="tab"
                    aria-controls="tab-refugo" aria-selected="false" tabindex="-1"
                    data-csp-action="showTab" data-csp-value="refugo">Refugo</button>
            <button class="tab" id="tab-btn-ret" type="button" role="tab"
                    aria-controls="tab-retrabalho" aria-selected="false" tabindex="-1"
                    data-csp-action="showTab" data-csp-value="retrabalho">Retrabalho</button>
        </div>

        <!-- FORM PRODUÇÃO -->
        <div id="tab-producao" class="form-card is-visible" role="tabpanel" aria-labelledby="tab-btn-prod">
            <form method="post" th:action="@{/dashboard/ordens/{ordemId}/setor/{ordemSetorId}/lancar/producao
            (ordemId=${ordem.id}, ordemSetorId=${ordemSetor.id})}"
                  th:object="${producaoDTO}">
                <input type="hidden" id="csrfProducao" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="form-grid">
                    <div class="field">
                        <label for="quantidadeProducao">Quantidade produzida <span>*</span></label>
                        <input type="number" id="quantidadeProducao" th:field="*{quantidade}" min="1" th:max="${ordemSetor.qtdPendente}"
                               placeholder="0" required/>
                        <span class="hint warn" th:text="'Máximo: ' + ${ordemSetor.qtdPendente} + ' unid.'">Máximo: 40 unid.</span>
                    </div>
                </div>

                <div class="form-grid">
                    <div class="field">
                        <label for="maquinaProducaoId">Máquina <span>*</span></label>
                        <select id="maquinaProducaoId" th:field="*{maquinaId}" required>
                            <option value="">Selecione a máquina</option>
                            <option th:each="m : ${maquinas}" th:value="${m.id}" th:text="${m.nome}"></option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="operadorProducaoId">Operador <span>*</span></label>
                        <select id="operadorProducaoId" th:field="*{operadorId}" required>
                            <option value="">Selecione o operador</option>
                            <option th:each="o : ${operadores}" th:value="${o.id}" th:text="${o.nome}"></option>
                        </select>
                    </div>
                </div>

                <div class="field csp-style-2b583d7389">
                    <label for="observacaoProducao">Observação</label>
                    <input type="text" id="observacaoProducao" th:field="*{observacao}" placeholder="Opcional..."/>
                </div>

                <div class="form-actions">
                    <a th:href="@{/dashboard/ordens-setor/{setorId}(setorId=${ordemSetor.setor.id})}"
                       class="btn-cancel csp-style-4edeb9e71d">Cancelar</a>
                    <button type="submit" class="btn-submit">Confirmar</button>
                </div>
            </form>
        </div>

        <!-- FORM REFUGO -->
        <div id="tab-refugo" class="form-card is-hidden" role="tabpanel" aria-labelledby="tab-btn-ref">
            <form method="post" th:action="@{/dashboard/ordens/{ordemId}/setor/{ordemSetorId}/lancar/refugo
            (ordemId=${ordem.id}, ordemSetorId=${ordemSetor.id})}"
                  th:object="${refugoDTO}">
                <input type="hidden" id="csrfRefugo" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="form-grid">
                    <div class="field">
                        <label for="quantidadeRefugo">Quantidade refugada <span>*</span></label>
                        <input type="number" id="quantidadeRefugo" th:field="*{quantidade}" min="1" placeholder="0" required/>
                    </div>
                    <div class="field">
                        <label for="selectSetorOrigemRefugo">Setor de origem do erro <span>*</span></label>
                        <select th:field="*{setorOrigemId}" id="selectSetorOrigemRefugo" required>
                            <option value="">Selecione o setor</option>
                            <option th:each="s : ${setores}" th:value="${s.id}" th:text="${s.nome}"></option>
                        </select>
                    </div>

                    <div class="field is-hidden" id="campoEtapaOrigemRefugo">
                        <label for="selectEtapaOrigemRefugo">Etapa específica <span>*</span></label>
                        <select th:field="*{etapaSetorId}" id="selectEtapaOrigemRefugo">
                            <option value="">Selecione a etapa</option>
                        </select>
                    </div>
                </div>

                <div class="form-grid">
                    <div class="field">
                        <label for="operadorRefugoId">Operador <span>*</span></label>
                        <select id="operadorRefugoId" th:field="*{operadorId}" required>
                            <option value="">Selecione o operador</option>
                            <option th:each="o : ${operadores}" th:value="${o.id}" th:text="${o.nome}"></option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="destinoRefugo">Destino <span>*</span></label>
                        <select id="destinoRefugo" th:field="*{destino}" required>
                            <option value="">Selecione</option>
                            <option value="RETRABALHO">Retrabalho</option>
                            <option value="DESCARTE">Descarte</option>
                        </select>
                    </div>
                </div>

                <div class="field csp-style-2b583d7389">
                    <label for="motivoRefugo">Motivo <span>*</span></label>
                    <textarea id="motivoRefugo" th:field="*{motivo}" placeholder="Descreva o motivo do refugo..." required></textarea>
                </div>

                <div class="form-actions">
                    <a th:href="@{/dashboard/ordens-setor/{setorId}(setorId=${ordemSetor.setor.id})}"
                       class="btn-cancel csp-style-4edeb9e71d">Cancelar</a>
                    <button type="submit" class="btn-submit refugo">Confirmar Refugo</button>
                </div>
            </form>
        </div>

        <!-- FORM RETRABALHO -->
        <div id="tab-retrabalho" class="form-card is-hidden" role="tabpanel" aria-labelledby="tab-btn-ret">
            <form method="post" th:action="@{/dashboard/ordens/{ordemId}/setor/{ordemSetorId}/lancar/retrabalho
            (ordemId=${ordem.id}, ordemSetorId=${ordemSetor.id})}"
                  th:object="${retrabalhoDTO}">
                <input type="hidden" id="csrfRetrabalho" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="form-grid">
                    <div class="field">
                        <label for="selectRefugoRetrabalho">Refugo vinculado <span>*</span></label>
                        <select th:field="*{refugoId}" id="selectRefugoRetrabalho" data-csp-change="filtrarMaquinasRetrabalho" required>
                            <option value="">Selecione o refugo</option>
                            <option th:each="r : ${refugosParaRetrabalho}" th:value="${r.id}"
                                    th:data-setor-origem="${r.setorOrigem.id}"
                                    th:text="'REF-' + ${#numbers.formatInteger(r.id, 3)} + ' · ' + ${r.qtdRefugo} + ' unid. · ' + ${r.motivo}"></option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="selectMaquinaRetrabalho">Máquina</label>
                        <select th:field="*{maquinaId}" id="selectMaquinaRetrabalho">
                            <option value="">Selecione o refugo primeiro (opcional)</option>
                            <option th:each="m : ${todasMaquinasParaRetrabalho}" th:value="${m.id}"
                                    th:data-setor="${m.setor.id}" th:text="${m.nome}"></option>
                        </select>
                    </div>
                </div>

                <div class="form-grid">
                    <div class="field">
                        <label for="operadorRetrabalhoId">Operador <span>*</span></label>
                        <select id="operadorRetrabalhoId" th:field="*{operadorId}" required>
                            <option value="">Selecione o operador</option>
                            <option th:each="o : ${operadores}" th:value="${o.id}" th:text="${o.nome}"></option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="quantidadeRetrabalho">Quantidade refeita <span>*</span></label>
                        <input type="number" id="quantidadeRetrabalho" th:field="*{quantidade}" min="1" placeholder="0" required/>
                    </div>
                </div>

                <div class="field csp-style-2b583d7389">
                    <label for="observacaoRetrabalho">Observação</label>
                    <textarea id="observacaoRetrabalho" th:field="*{observacao}" placeholder="Descreva o que foi corrigido..."></textarea>
                </div>

                <div class="form-actions">
                    <a th:href="@{/dashboard/ordens-setor/{setorId}(setorId=${ordemSetor.setor.id})}"
                       class="btn-cancel csp-style-4edeb9e71d">Cancelar</a>
                    <button type="submit" class="btn-submit retrab">Confirmar Retrabalho</button>
                </div>
            </form>
        </div>

    </div>

    <!-- MODAL DE CONFIRMAÇÃO COM RESUMO -->
    <div class="modal-overlay is-hidden" id="modal-confirmacao-lancamento">
        <div class="modal-box">
            <div class="modal-header">
                <span class="modal-title" id="modal-confirmacao-titulo">
                    <i class="fa-solid fa-clipboard-check"></i> Confirmar Lançamento
                </span>
                <button type="button" class="modal-close" id="btn-modal-fechar">&times;</button>
            </div>

            <div class="modal-body">
                <p class="modal-info">Confirme os dados do lançamento antes de enviar:</p>
                <div id="modal-resumo-conteudo" class="resumo-grid"></div>
            </div>

            <div class="modal-actions">
                <button type="button" class="btn-cancel" id="btn-modal-cancelar">Voltar e Ajustar</button>
                <button type="button" class="btn-submit" id="btn-modal-confirmar-envio">
                    <i class="fa-solid fa-check"></i> Confirmar e Enviar
                </button>
            </div>
        </div>
    </div>
</main>

<script th:src="@{/js/sidebar.js}"></script>
<script th:src="@{/js/alerts.js}"></script>
<script th:src="@{/js/lancamento.js}"></script>

</body>
</html>
