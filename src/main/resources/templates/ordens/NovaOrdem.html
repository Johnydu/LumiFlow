<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Nova Ordem de Produção - LumiFlow</title>

    <link rel="stylesheet" th:href="@{/css/variables.css}">
    <link rel="stylesheet" th:href="@{/css/globals.css}">
    <link rel="stylesheet" th:href="@{/css/sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/topbar.css}">
    <link rel="stylesheet" th:href="@{/css/components/buttons.css}">
    <link rel="stylesheet" th:href="@{/css/components/forms.css}">
    <link rel="stylesheet" th:href="@{/css/components/tables.css}">
    <link rel="stylesheet" th:href="@{/css/components/cards.css}">
    <link rel="stylesheet" th:href="@{/css/components/badges.css}">
    <link rel="stylesheet" th:href="@{/css/components/status.css}">
    <link rel="stylesheet" th:href="@{/css/components/alerts.css}">
    <link rel="stylesheet" th:href="@{/css/pages/novaordem.css}">
    <link rel="stylesheet" th:href="@{/css/utils.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="page-ordemproducao-novaordem">

<div th:replace="~{fragments/messages :: alerts}"></div>

<aside th:replace="~{fragments/sidebar :: sidebar(activePage='ordens-setor')}"></aside>

<main class="main">
    <div th:replace="~{fragments/topbar :: topbar(
            'Nova Ordem de Produção',
            null,
            null
        )}">
    </div>

    <div class="content">

        <form method="post" th:action="@{/dashboard/ordens}" id="formNovaOrdem">

            <!-- DADOS DA ORDEM -->
            <div class="form-card">
                <div class="card-title">Dados da ordem</div>
                <div class="form-grid" style="margin-bottom:14px">

                    <div class="field">
                        <label for="produtoId">Produto <span>*</span></label>
                        <select id="produtoId" name="produtoId" required onchange="updateRoteiro(this.value)">
                            <option value="">Selecione o produto</option>
                            <option th:each="p : ${produtos}"
                                    th:value="${p.id}"
                                    th:text="${p.nome}">
                                Arandela 12W
                            </option>
                        </select>
                    </div>

                    <div class="field">
                        <label for="quantidade">Quantidade <span>*</span></label>
                        <input type="number" id="quantidade" name="quantidade" min="1" placeholder="0" required/>
                        <span class="hint">Quantidade total a produzir.</span>
                    </div>

                    <div class="field">
                        <label for="dataCriacao">Data <span>*</span></label>
                        <input type="date" id="dataCriacao" name="dataCriacao"
                               th:value="${#temporals.format(#temporals.createToday(), 'yyyy-MM-dd')}" required/>
                    </div>

                    <div class="field">
                        <label for="observacao">Observação</label>
                        <input type="text" id="observacao" name="observacao" placeholder="Opcional..."/>
                    </div>

                </div>

                <!-- ROTEIRO AUTOMÁTICO -->
                <div class="roteiro-card">
                    <div class="roteiro-label">Roteiro do produto</div>
                    <div class="roteiro-pills" id="roteiro-pills">
                        <span class="r-empty">Selecione um produto para ver o roteiro.</span>
                    </div>
                    <div class="roteiro-info" id="roteiro-info" style="display:none">
                        ℹ️ Roteiro carregado automaticamente do cadastro do produto.
                    </div>
                </div>
            </div>

            <div class="form-actions">
                <a th:href="@{/dashboard/ordens}" class="btn-cancel" style="text-decoration: none;">Cancelar</a>
                <button type="submit" class="btn-submit">Criar Ordem</button>
            </div>

        </form>

    </div>

</main>

<script th:src="@{/js/sidebar.js}"></script>
<script th:src="@{/js/alerts.js}"></script>
<script th:src="@{/js/nova-ordem.js}"></script>

</body>

</html>
