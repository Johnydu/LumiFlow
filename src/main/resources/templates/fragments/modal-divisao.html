<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<div th:fragment="modal(retorno)"
     id="modalDivisao"
     class="modal-overlay is-hidden"
     sec:authorize="hasAnyRole('ADMIN', 'GESTAO', 'SUPERVISOR', 'PCP')">

    <div class="modal-box">
        <div class="modal-header">
            <span class="modal-title">Dividir Ordem</span>
            <button type="button"
                    class="modal-close"
                    data-divisao-fechar
                    aria-label="Fechar modal">&times;</button>
        </div>

        <form id="formDivisao"
              method="post"
              th:action="@{/dashboard/ordens-setor/0/ordens/0/dividir}">

            <input type="hidden" id="retornoDivisao" name="retorno" th:value="${retorno}">
            <input type="hidden" name="ordemId" id="divisaoOrdemId">

            <div class="modal-body">
                <p class="modal-info">
                    <span id="modalProdutoNome"></span> —
                    Quantidade pendente:
                    <strong id="modalQtdTotal">0</strong>
                </p>

                <div id="linhasDivisao"></div>

                <button type="button"
                        class="btn-add-divisao"
                        data-divisao-adicionar>
                    + Adicionar variante
                </button>

                <div class="modal-resumo">
                    Soma:
                    <span id="somaAtual">0</span> /
                    <span id="qtdEsperada">0</span>

                    <span id="restanteInfo" class="hint"></span>
                </div>
            </div>

            <div class="modal-actions">
                <button type="button"
                        class="btn-cancel"
                        data-divisao-fechar>
                    Cancelar
                </button>

                <button type="submit"
                        class="btn-submit"
                        id="btnConfirmarDivisao"
                        disabled>
                    Confirmar Divisão
                </button>
            </div>
        </form>
    </div>
</div>

</html>
