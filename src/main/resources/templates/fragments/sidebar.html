<aside th:fragment="sidebar(activePage)"
       id="sidebar" class="sidebar"
       xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

    <!-- Topo da Sidebar: Logo e Botão de Fechar Responsivo -->
    <div class="sidebar-header">
        <div class="logo">LumiFlow</div>
        <button type="button" class="menu-toggle sidebar-close"
                data-csp-action="toggleSidebar" aria-label="Fechar Menu" aria-expanded="false">
            ☰
        </button>
    </div>

    <!-- Navegação Principal -->
    <nav class="sidebar-nav">

        <div class="menu-title">GERAL</div>
        <div class="menu">
            <a th:href="@{/dashboard}"
               sec:authorize="hasAnyRole('ADMIN', 'SUPERVISOR', 'GESTAO', 'PCP')"
               th:classappend="${activePage == 'dashboard'} ? 'active'"
               class="menu-item">Dashboard</a>

            <a th:href="@{/dashboard/ordens-setor}"
               th:classappend="${activePage == 'ordens-setor'} ? 'active' : ''"
               class="menu-item">Ordens</a>

            <a th:href="@{/dashboard/historico}"
               sec:authorize="hasAnyRole('ADMIN', 'PCP', 'GESTAO', 'SUPERVISOR')"
               th:classappend="${activePage == 'historico'} ? 'active'"
               class="menu-item">Histórico / Lançamentos</a>

            <a th:href="@{/dashboard/vidracaria}"
               th:classappend="${activePage == 'vidracaria'} ? 'active'"
               class="menu-item">Vidraçaria</a>
        </div>

        <!-- CADASTROS (Oculta o título e todos os links se não tiver permissão) -->
        <div sec:authorize="hasAnyRole('ADMIN', 'PCP', 'SUPERVISOR')">
            <div class="menu-title">CADASTROS</div>

            <div class="menu">
                <a th:href="@{/dashboard/roteiros}"
                   th:classappend="${activePage == 'roteiros'} ? 'active'"
                class="menu-item">Roteiros</a>

                <a th:href="@{/dashboard/operadores}"
                   th:classappend="${activePage == 'operadores'} ? 'active'"
                class="menu-item">Operadores</a>

                <a th:href="@{/dashboard/produtos}"
                   th:classappend="${activePage == 'produtos'} ? 'active'"
                   class="menu-item">Produtos</a>

                <a th:href="@{/dashboard/maquinas}"
                   th:classappend="${activePage == 'maquinas'} ? 'active'"
                   class="menu-item">Máquinas</a>

                <a th:href="@{/dashboard/setores}"
                   th:classappend="${activePage == 'setores'} ? 'active'"
                   class="menu-item">Setores</a>

                <a th:href="@{/dashboard/usuario}"
                   sec:authorize="hasRole('ADMIN')"
                   th:classappend="${activePage == 'usuario'} ? 'active'"
                   class="menu-item">Usuários</a>
            </div>

        </div>

        <div class="menu-title">SISTEMA</div>
        <div class="menu">
            <a th:href="@{/dashboard/configuracoes}"
               sec:authorize="hasAnyRole('ADMIN','SUPERVISOR','GESTAO','PCP')"
               th:classappend="${activePage == 'configuracoes'} ? 'active'"
               class="menu-item">Configurações</a>

            <form th:action="@{/logout}" method="post" class="logout-form">
                <input type="hidden"
                       id="csrfLogout"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}"/>
                <button type="submit" class="menu-item logout-btn">
                    Sair do Sistema
                </button>
            </form>
        </div>

    </nav>

    <!-- Rodapé: Perfil do usuário e Ações -->
    <div class="sidebar-footer">
        <div class="profile">
            <div class="avatar" sec:authentication="principal.iniciais">US</div>
            <div class="profile-info">
                <div class="pname" sec:authentication="principal.nomeCompleto">Usuário</div>
                <div class="nivel-tag" sec:authentication="principal.nivelAcesso">Nível</div>
            </div>
        </div>

        <div class="app-version">
            LumiFlow v1.0.0
        </div>
    </div>

    <script th:src="@{/js/responsive-tables.js}"></script>

</aside>
