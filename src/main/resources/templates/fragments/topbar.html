<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<th:block th:fragment="topbar(titulo, textoBotao, acaoBotao)">

    <div class="sidebar-overlay" aria-hidden="true"></div>

    <header class="topbar">
        <div class="topbar-left">
            <button class="menu-toggle"
                    data-csp-action="toggleSidebar"
                    aria-label="Abrir Menu">
                ☰
            </button>

            <span class="topbar-title"
                  th:text="${titulo}">
            </span>
        </div>

        <!-- Botão protegido: Só aparece se houver texto e o utilizador tiver permissão de superior/gestão -->
        <button th:if="${textoBotao != null}"
                sec:authorize="hasAnyRole('ADMIN', 'GESTAO', 'SUPERVISOR', 'PCP')"
                class="btn-novo"
                th:text="${textoBotao}"
                th:attr="data-csp-action=${acaoBotao}">
        </button>
    </header>

</th:block>
</html>
