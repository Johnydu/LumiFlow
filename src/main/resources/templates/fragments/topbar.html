<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<th:block th:fragment="topbar(titulo, textoBotao, acaoBotao, publico)">

    <div class="sidebar-overlay" aria-hidden="true"></div>

    <header class="topbar">
        <div class="topbar-left">
            <button class="menu-toggle"
                    data-csp-action="toggleSidebar"
                    aria-label="Alternar menu"
                    aria-controls="sidebar"
                    aria-expanded="true">
                ☰
            </button>

            <span class="topbar-title"
                  th:text="${titulo}">
            </span>
        </div>

        <button th:if="${textoBotao != null and publico}"
                class="btn-novo"
                th:text="${textoBotao}"
                th:attr="data-csp-action=${acaoBotao}">
        </button>

        <!-- Ações administrativas continuam protegidas por role. -->
        <button th:if="${textoBotao != null and !publico}"
                sec:authorize="hasAnyRole('ADMIN', 'GESTAO', 'SUPERVISOR', 'PCP')"
                class="btn-novo"
                th:text="${textoBotao}"
                th:attr="data-csp-action=${acaoBotao}">
        </button>
    </header>

</th:block>
</html>
