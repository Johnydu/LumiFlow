<!DOCTYPE html>
<html lang="pt-BR" th:lang="${#locale.toLanguageTag()}" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <th:block th:replace="~{fragments/theme :: init}"></th:block>
    <title>Histórico de Lançamentos - LumiFlow</title>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" th:href="@{/css/variables.css}">
    <link rel="stylesheet" th:href="@{/css/globals.css}">
    <link rel="stylesheet" th:href="@{/css/sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/topbar.css}">
    <link rel="stylesheet" th:href="@{/css/components/buttons.css}">
    <link rel="stylesheet" th:href="@{/css/components/forms.css}">
    <link rel="stylesheet" th:href="@{/css/components/tables.css}">
    <link rel="stylesheet" th:href="@{/css/components/cards.css}">
    <link rel="stylesheet" th:href="@{/css/components/badges.css}">
    <link rel="stylesheet" th:href="@{/css/components/status.css}">
    <link rel="stylesheet" th:href="@{/css/components/alerts.css}">
    <link rel="stylesheet" th:href="@{/css/utils.css}">
    <link rel="stylesheet" th:href="@{/css/pages/historicoLancamento.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css}"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="page-lancamentos">
<div th:replace="~{fragments/messages :: alerts}"></div>

<aside th:replace="~{fragments/sidebar :: sidebar(activePage='lancamentos')}"></aside>

<main class="main">
    <div th:replace="~{fragments/topbar :: topbar(
        'Histórico de Lançamentos',
        null,
        null
    )}"></div>

    <div class="content">
        <div class="panel">
            <div class="panel-header">
                <span class="panel-title">HISTÓRICO</span>
                <span class="panel-count" th:text="${pagina.totalElements + ' registros'}"></span>
            </div>

            <table>
                <thead>
                <tr>
                    <th>Data / Hora</th>
                    <th>Ordem</th>
                    <th>Produto</th>
                    <th>Setor / Etapa</th>
                    <th>Máquina</th>
                    <th>Qtd. Produzida</th>
                    <th>Operador</th>
                    <th>Observação</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="hist : ${pagina.content}">
                    <td class="col-data"
                        th:text="${#temporals.format(hist.dataHora, 'dd/MM/yyyy HH:mm')}"></td>

                    <td>
                        <a sec:authorize="hasAnyRole('ADMIN','SUPERVISOR','GESTAO','PCP')"
                           class="num"
                           th:href="@{/dashboard/ordens/{id}/detalhes(id=${hist.ordemId})}"
                           th:text="${hist.numeroOrdem}">OP-0001</a>
                        <span sec:authorize="!hasAnyRole('ADMIN','SUPERVISOR','GESTAO','PCP')"
                              class="num" th:text="${hist.numeroOrdem}">OP-0001</span>
                    </td>

                    <!-- Exibe Código do Produto · Nome (Variante se houver) -->
                    <td th:text="${(hist.codigoProduto != null ? hist.codigoProduto + ' · ' : '')
                                  + hist.produto
                                  + (hist.variante != null and !hist.variante.isBlank() ? ' (' + hist.variante + ')' : '')}">
                        Produto
                    </td>

                    <td>
                        <span class="setor-tag" th:text="${hist.setor}">Setor</span>
                        <span th:if="${hist.etapa != null}" class="etapa-tag" th:text="${hist.etapa}">Etapa</span>
                    </td>

                    <td th:text="${hist.maquina}">Máquina</td>

                    <td><strong th:text="${hist.quantidadeProduzida + ' unid.'}">0 unid.</strong></td>

                    <td th:text="${hist.operador}">Operador</td>

                    <td class="col-detalhes"
                        th:text="${hist.detalhes != null and !hist.detalhes.isBlank() ? hist.detalhes : '—'}">—</td>
                </tr>

                <tr th:if="${#lists.isEmpty(pagina.content)}">
                    <td colspan="8" style="text-align:center;color:var(--color-muted-5)">
                        Nenhum lançamento registrado até o momento.
                    </td>
                </tr>
                </tbody>
            </table>

            <div class="paginacao" th:if="${pagina.totalPages > 1}">
                <span class="pag-info"
                      th:text="${'Página ' + (pagina.number + 1) + ' de ' + pagina.totalPages}"></span>
                <div class="pag-btns">
                    <a th:if="${!pagina.first}" class="pag-btn"
                       th:href="@{/dashboard/lancamentos(page=${pagina.number - 1})}">&lsaquo;</a>
                    <span th:if="${pagina.first}" class="pag-btn" style="opacity:0.5; pointer-events:none;">&lsaquo;</span>

                    <a th:if="${!pagina.last}" class="pag-btn"
                       th:href="@{/dashboard/lancamentos(page=${pagina.number + 1})}">&rsaquo;</a>
                    <span th:if="${pagina.last}" class="pag-btn" style="opacity:0.5; pointer-events:none;">&rsaquo;</span>
                </div>
            </div>
        </div>
    </div>
</main>

<script th:src="@{/js/historicoLancamento.js}"></script>
<script th:src="@{/js/sidebar.js}"></script>
<script th:src="@{/js/alerts.js}"></script>

</body>
</html>
