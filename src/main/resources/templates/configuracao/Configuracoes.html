<!DOCTYPE html>
<html lang="pt-BR" th:lang="${#locale.toLanguageTag()}" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <th:block th:replace="~{fragments/theme :: init}"></th:block>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Configurações - LumiFlow</title>

    <!-- 1. Variables & Globals -->
    <link rel="stylesheet" th:href="@{/css/variables.css}">
    <link rel="stylesheet" th:href="@{/css/globals.css}">

    <!-- 2. Shared Layout -->
    <link rel="stylesheet" th:href="@{/css/sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/topbar.css}">

    <!-- 3. Components -->
    <link rel="stylesheet" th:href="@{/css/components/buttons.css}">
    <link rel="stylesheet" th:href="@{/css/components/forms.css}">
    <link rel="stylesheet" th:href="@{/css/components/tables.css}">
    <link rel="stylesheet" th:href="@{/css/components/cards.css}">
    <link rel="stylesheet" th:href="@{/css/components/badges.css}">
    <link rel="stylesheet" th:href="@{/css/components/status.css}">
    <link rel="stylesheet" th:href="@{/css/components/alerts.css}">
    <link rel="stylesheet" th:href="@{/css/components/modal.css}">

    <!-- 4. Page Specific -->
    <link rel="stylesheet" th:href="@{/css/components/csp-migrated.css}">
    <link rel="stylesheet" th:href="@{/css/pages/configuracoes.css}">

    <!-- 5. Utils & Responsive -->
    <link rel="stylesheet" th:href="@{/css/utils.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
          integrity="sha384-iw3OoTErCYJJB9mCa8LNS2hbsQ7M3C0EpIsO/H5+EGAkPGc6rk+V8i04oW/K5xq0"
          crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body class="page-configuracao">
<div th:replace="~{fragments/messages :: alerts}"></div>

<!-- SIDEBAR -->
<aside th:replace="~{fragments/sidebar :: sidebar(activePage='configuracoes')}"></aside>

<main class="main">

    <!-- TOPBAR -->
    <div th:replace="~{fragments/topbar :: topbar(
        'Configurações',
        null,
        null,
        'padrao'
    )}"></div>

    <div class="content">

        <div class="panel">
            <div class="panel-header">
                <span class="panel-title">
                    Preferências do Sistema
                </span>
            </div>

            <div class="config-body">

                <!-- SELETOR DE IDIOMA -->
                <div class="field config-field">
                    <label for="langSelect" class="config-label">
                        Idioma / Language
                    </label>

                    <select id="langSelect" class="config-select"
                            data-csp-change="mudarIdioma"
                            data-csp-argument="value">
                        <option value="pt-BR" th:selected="${#locale.language == 'pt'}">Português (Brasil)</option>
                        <option value="en" th:selected="${#locale.language == 'en'}">English</option>
                    </select>
                </div>

                <!-- SELETOR DE TEMA -->
                <div class="field config-field">
                    <span class="config-label">
                        Tema do Sistema / Theme
                    </span>

                    <div class="theme-buttons-group">
                        <!-- Botão Identidade (Original) -->
                        <button type="button"
                                data-csp-action="mudarTema"
                                data-csp-value="identity"
                                class="btn-submit theme-btn">
                            🎨 Identidade (Original)
                        </button>

                        <!-- Botão Claro -->
                        <button type="button"
                                data-csp-action="mudarTema"
                                data-csp-value="light"
                                class="btn-submit theme-btn">
                            ☀️ Claro
                        </button>

                        <!-- Botão Escuro -->
                        <button type="button"
                                data-csp-action="mudarTema"
                                data-csp-value="dark"
                                class="btn-submit theme-btn">
                            🌙 Escuro
                        </button>
                    </div>
                </div>

            </div>
        </div>

    </div>

</main>

<script th:src="@{/js/configuracoes.js}" defer></script>
<script th:src="@{/js/sidebar.js}" defer></script>
<script th:src="@{/js/alerts.js}" defer></script>

</body>
</html>
