<!DOCTYPE html>
<html lang="pt-BR" th:lang="${#locale.toLanguageTag()}" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <th:block th:replace="~{fragments/theme :: init}"></th:block>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Configurações - LumiFlow</title>

    <!-- 1. Variables & Globals -->
    <link rel="stylesheet" th:href="@{/css/variables.css}">
    <link rel="stylesheet" th:href="@{/css/globals.css}">

    <!-- 2. Shared Layout -->
    <link rel="stylesheet" th:href="@{/css/sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/topbar.css}">

    <!-- 3. Components -->
    <link rel="stylesheet" th:href="@{/css/components/buttons.css}">
    <link rel="stylesheet" th:href="@{/css/components/forms.css}">
    <link rel="stylesheet" th:href="@{/css/components/tables.css}">
    <link rel="stylesheet" th:href="@{/css/components/cards.css}">
    <link rel="stylesheet" th:href="@{/css/components/badges.css}">
    <link rel="stylesheet" th:href="@{/css/components/status.css}">
    <link rel="stylesheet" th:href="@{/css/components/alerts.css}">
    <!-- Componente Modal Centralizado -->
    <link rel="stylesheet" th:href="@{/css/components/modal.css}">

    <!-- 4. Page Specific -->
    <link rel="stylesheet" th:href="@{/css/pages/configuracoes.css}">

    <!-- 5. Utils & Responsive -->
    <link rel="stylesheet" th:href="@{/css/utils.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="page-configuracao">
<div th:replace="~{fragments/messages :: alerts}"></div>

<!-- SIDEBAR -->
<aside th:replace="~{fragments/sidebar :: sidebar(activePage='configuracoes')}"></aside>

<main class="main">

    <!-- TOPBAR -->
    <div th:replace="~{fragments/topbar :: topbar(
        'Configurações',
        null,
        null
    )}"></div>

    <div class="content">

        <div class="panel">
            <div class="panel-header">
                <span class="panel-title">
                    Preferências do Sistema
                </span>
            </div>

            <div class="csp-style-44fbd9927b">

                <!-- SELETOR DE IDIOMA -->
                <div class="field csp-style-fb86a60aff">
                    <label for="langSelect" class="csp-style-e4c9ee3efa">
                        Idioma / Language
                    </label>

                    <select id="langSelect" class="csp-style-51fd58adb1"
                           data-csp-change="mudarIdioma" data-csp-argument="value"
                           >
                        <option value="pt-BR" th:selected="${#locale.language == 'pt'}">Português (Brasil)</option>
                        <option value="en" th:selected="${#locale.language == 'en'}">English</option>
                    </select>
                </div>

                <!-- SELETOR DE TEMA -->
                <div class="field csp-style-ef1f3a5dff">
                    <label class="csp-style-9ca608d952">
                        Tema do Sistema / Theme
                    </label>

                    <div class="csp-style-9f131dbf15">
                        <!-- Botão Identidade (Original) -->
                        <button type="button"
                                data-csp-action="mudarTema" data-csp-value="identity"
                                data-theme="identity"
                                class="btn-submit csp-style-07a6abd024"
                               >
                            🎨 Identidade (Original)
                        </button>

                        <!-- Botão Claro -->
                        <button type="button"
                                data-csp-action="mudarTema" data-csp-value="light"
                                data-theme="light"
                                class="btn-submit csp-style-07a6abd024"
                               >
                            ☀️ Claro
                        </button>

                        <!-- Botão Escuro -->
                        <button type="button"
                                data-csp-action="mudarTema" data-csp-value="dark"
                                data-theme="dark"
                                class="btn-submit">
                            🌙 Escuro
                        </button>
                    </div>
                </div>

            </div>
        </div>

    </div>

</main>

<script th:src="@{/js/configuracoes.js}"></script>
<script th:src="@{/js/sidebar.js}"></script>
<script th:src="@{/js/alerts.js}"></script>

</body>
</html>
