<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - LumiFlow</title>
  <link rel="stylesheet" th:href="@{/css/variables.css}">
<link rel="stylesheet" th:href="@{/css/globals.css}">
<link rel="stylesheet" th:href="@{/css/sidebar.css}">
<link rel="stylesheet" th:href="@{/css/topbar.css}">
<link rel="stylesheet" th:href="@{/css/components/buttons.css}">
<link rel="stylesheet" th:href="@{/css/components/forms.css}">
<link rel="stylesheet" th:href="@{/css/components/tables.css}">
<link rel="stylesheet" th:href="@{/css/components/cards.css}">
<link rel="stylesheet" th:href="@{/css/components/badges.css}">
<link rel="stylesheet" th:href="@{/css/components/status.css}">
<link rel="stylesheet" th:href="@{/css/components/alerts.css}">
<link rel="stylesheet" th:href="@{/css/utils.css}">
<link rel="stylesheet" th:href="@{/css/responsive.css}">
  <link rel="stylesheet" th:href="@{/css/error.css}">
</head>

<body class="page-usuario-login">
<div class="screen" id="screen">
  <div class="card" id="card">

    <div class="lamp-wrap">
      <div class="lamp-glow" id="glow"></div>

      <svg id="lamp" width="80" height="100" viewBox="0 0 80 100"
           xmlns="http://www.w3.org/2000/svg">

        <g id="filament" opacity="0">
          <path d="M34 62 Q37 55 40 62 Q43 55 46 62"
                stroke="#FFD700"
                stroke-width="1.5"
                fill="none"
                stroke-linecap="round"/>
        </g>

        <path d="M20 40 Q20 15 40 15 Q60 15 60 40 Q60 58 50 65 L30 65 Q20 58 20 40Z"
              fill="none"
              id="bulb-border"
              stroke="#444"
              stroke-width="2"/>

        <path d="M20 40 Q20 15 40 15 Q60 15 60 40 Q60 58 50 65 L30 65 Q20 58 20 40Z"
              fill="#1a1a2e"
              id="bulb-fill"/>

        <ellipse id="inner-glow"
                 cx="40"
                 cy="38"
                 rx="16"
                 ry="16"
                 fill="rgba(255,220,50,0)"/>

        <rect x="30" y="65" width="20" height="5" rx="1" fill="#555"/>
        <rect x="31" y="70" width="18" height="5" rx="1" fill="#444"/>
        <rect x="32" y="75" width="16" height="5" rx="1" fill="#555"/>

        <line x1="30" y1="72" x2="50" y2="72" stroke="#333" stroke-width="0.5"/>
        <line x1="31" y1="77" x2="49" y2="77" stroke="#333" stroke-width="0.5"/>

        <ellipse cx="30"
                 cy="30"
                 rx="4"
                 ry="6"
                 fill="rgba(255,255,255,0.05)"
                 transform="rotate(-30 30 30)"/>

      </svg>
    </div>

    <div class="brand">LumiFlow</div>
    <div class="brand-sub">
      RBL Iluminação — Gestão de Produção
    </div>

    <form th:action="@{/login}" method="post">

      <div class="field">
        <label for="user">Usuário</label>

        <input
                type="text"
                id="user"
                name="login"
                placeholder="Digite seu usuário"
                autocomplete="username"
                required>
      </div>

      <div class="field">
        <label for="pass">Senha</label>

        <input
                type="password"
                id="pass"
                name="senha"
                placeholder="Digite sua senha"
                autocomplete="current-password"
                required>
      </div>

      <button class="btn" id="btn" type="submit">

        <svg width="16"
             height="16"
             viewBox="0 0 24 24"
             fill="none"
             stroke="currentColor"
             stroke-width="2">

          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>

          <polyline points="10 17 15 12 10 7"/>

          <line x1="15" y1="12" x2="3" y2="12"/>

        </svg>

        Entrar

      </button>

    </form>

    <div th:if="${param.error}" class="msg error">
      Usuário ou senha inválidos.
    </div>

    <div th:if="${param.logout}" class="msg success">
      Logout realizado com sucesso.
    </div>

    <div class="footer-note">
      Esqueceu sua senha? Contate o suporte.
    </div>
  </div>
</div>

<script th:src="@{/js/login.js}"></script>

</body>

</html>
