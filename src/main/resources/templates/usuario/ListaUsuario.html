<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" xmlns="http://www.w3.org/1999/html">
<head>
    <title>Usuarios - LumiFlow</title>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" th:href="@{/css/variables.css}">
    <link rel="stylesheet" th:href="@{/css/globals.css}">
    <link rel="stylesheet" th:href="@{/css/sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/topbar.css}">
    <link rel="stylesheet" th:href="@{/css/components/buttons.css}">
    <link rel="stylesheet" th:href="@{/css/components/forms.css}">
    <link rel="stylesheet" th:href="@{/css/components/tables.css}">
    <link rel="stylesheet" th:href="@{/css/components/cards.css}">
    <link rel="stylesheet" th:href="@{/css/components/badges.css}">
    <link rel="stylesheet" th:href="@{/css/components/status.css}">
    <link rel="stylesheet" th:href="@{/css/components/alerts.css}">
    <link rel="stylesheet" th:href="@{/css/components/modal.css}">
    <link rel="stylesheet" th:href="@{/css/pages/usuarios.css}">
    <link rel="stylesheet" th:href="@{/css/utils.css}">
    <link rel="stylesheet" th:href="@{/css/error.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css}"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="page-usuario-cadastrousuario">
<div th:replace="~{fragments/messages :: alerts}"></div>

<aside th:replace="~{fragments/sidebar :: sidebar(activePage='usuario')}"></aside>

<main class="main">
    <div th:replace="~{fragments/topbar :: topbar(
    'Usuários',
    '+ Novo Usuário',
    'novoUsuarioForm()'
)}"></div>

    <div class="content">

        <!-- LISTA -->
        <div class="lista" style="width: 100%;">

            <div class="panel">

                <div class="panel-header">
                    <form method="get" th:action="@{/dashboard/usuarios}">
                        <input type="text"
                               name="nome"
                               th:value="${param.nome}"
                               class="search"
                               placeholder="Buscar usuário...">
                    </form>

                    <span class="panel-title">
                        Usuário cadastrados
                    </span>

                    <span class="panel-count"
                          th:text="${#lists.size(usuarios) + ' usuario(s)'}">
                    </span>
                </div>

                <table>
                    <thead>
                    <tr>
                        <th>Usuário</th>
                        <th>Nível de acesso</th>
                        <th>Setor</th>
                        <th style="width:120px">Ações</th>
                    </tr>
                    </thead>
                    <tbody>

                    <tr th:each="usuario : ${usuarios}">

                        <td>
                            <div class="user-info" style="display: flex; align-items: center; gap: 12px;">
                                <div class="user-avatar"
                                     style="width: 36px; height: 36px; min-width: 36px; border-radius: 50%; background-color: var(--color-primary); display: flex; align-items: center; justify-content: center; color: #ffffff; font-weight: bold;"
                                     th:text="${#strings.substring(usuario.nome,0,1)}">
                                </div>

                                <div>
                                    <div class="user-name" th:text="${usuario.nome}"></div>
                                    <div class="num" th:text="${usuario.login}"></div>
                                </div>
                            </div>
                        </td>

                        <td>
                            <span class="nivel-tag" th:text="${usuario.nivelAcesso}"></span>
                        </td>

                        <td th:text="${usuario.setor != null ? usuario.setor : '-'}"></td>

                        <td>
                            <div class="table-actions">
                                <button type="button"
                                        class="btn-edit"
                                        th:data-id="${usuario.id}"
                                        th:data-nome="${usuario.nome}"
                                        th:data-login="${usuario.login}"
                                        th:data-nivel="${usuario.nivelAcessoId}"
                                        th:data-setor="${usuario.setorId}"
                                        onclick="handleEditarUsuario(this)">
                                    ✏ Editar
                                </button>

                                <form th:action="@{/dashboard/usuario/{id}/excluir(id=${usuario.id})}"
                                      method="post"
                                      style="display:inline"
                                      class="form-excluir-usuario">

                                    <input type="hidden"
                                           th:name="${_csrf.parameterName}"
                                           th:value="${_csrf.token}" />

                                    <button type="submit"
                                            class="btn-del"
                                            onclick="return confirm('Tem certeza que deseja excluir este usuário?');">
                                        🗑 Excluir
                                    </button>
                                </form>
                            </div>
                        </td>

                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- MODAL DE CADASTRO / EDIÇÃO DE USUÁRIO -->
        <div id="form-panel" class="modal-overlay" style="display:none;">
            <div class="modal-box">
                <div class="modal-header">
                    <span class="modal-title" id="form-title">Novo Usuário</span>
                    <button type="button" class="modal-close" onclick="hideForm()">&times;</button>
                </div>

                <form th:action="@{/dashboard/usuario}"
                      th:object="${usuarioDTO}"
                      method="post">

                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}" />

                    <!-- Campo oculto para ID (essencial para edição) -->
                    <input type="hidden" name="id" th:field="*{id}" />

                    <div class="modal-body">
                        <div class="field" style="display: flex; flex-direction: column; gap: 4px;">
                            <label style="font-size: var(--font-size-sm); font-weight: 500;">Nome completo <span style="color: var(--color-danger);">*</span></label>
                            <input type="text"
                                   th:field="*{nome}"
                                   id="nome"
                                   placeholder="Ex: Carlos Silva" required
                                   style="height: var(--control-height, 38px); padding: 0 var(--space-3); border: 1px solid var(--border-strong); border-radius: var(--radius-md); background: var(--color-field); color: var(--color-text); font-size: var(--font-size-sm);" />
                        </div>

                        <div class="field" style="display: flex; flex-direction: column; gap: 4px;">
                            <label style="font-size: var(--font-size-sm); font-weight: 500;">Login <span style="color: var(--color-danger);">*</span></label>
                            <input type="text"
                                   th:field="*{login}"
                                   id="login"
                                   placeholder="Ex: carlos" required
                                   style="height: var(--control-height, 38px); padding: 0 var(--space-3); border: 1px solid var(--border-strong); border-radius: var(--radius-md); background: var(--color-field); color: var(--color-text); font-size: var(--font-size-sm);" />
                            <span class="hint" style="font-size: var(--font-size-xs); color: var(--color-muted);">Usado para acessar o sistema.</span>
                        </div>

                        <div class="field" style="display: flex; flex-direction: column; gap: 4px;">
                            <label style="font-size: var(--font-size-sm); font-weight: 500;">Senha <span style="color: var(--color-danger);">*</span></label>
                            <input type="password"
                                   th:field="*{senha}"
                                   id="senha"
                                   placeholder="Min. 12 caracteres..."
                                   style="height: var(--control-height, 38px); padding: 0 var(--space-3); border: 1px solid var(--border-strong); border-radius: var(--radius-md); background: var(--color-field); color: var(--color-text); font-size: var(--font-size-sm);" />
                        </div>

                        <div class="field" style="display: flex; flex-direction: column; gap: 4px;">
                            <label style="font-size: var(--font-size-sm); font-weight: 500;">Nível de acesso <span style="color: var(--color-danger);">*</span></label>
                            <select th:field="*{nivelAcessoId}" id="nivelAcessoId"
                                    style="height: var(--control-height, 38px); padding: 0 var(--space-3); border: 1px solid var(--border-strong); border-radius: var(--radius-md); background: var(--color-field); color: var(--color-text); font-size: var(--font-size-sm);">
                                <option value="">Selecione o nível</option>
                                <option th:each="nivel : ${niveisAcesso}"
                                        th:value="${nivel.id}"
                                        th:text="${nivel.descricao}">
                                </option>
                            </select>
                        </div>

                        <div class="field" style="display: flex; flex-direction: column; gap: 4px;">
                            <label style="font-size: var(--font-size-sm); font-weight: 500;">Setor</label>
                            <select th:field="*{setorId}" id="setorId"
                                    style="height: var(--control-height, 38px); padding: 0 var(--space-3); border: 1px solid var(--border-strong); border-radius: var(--radius-md); background: var(--color-field); color: var(--color-text); font-size: var(--font-size-sm);">
                                <option value="">Nenhum (gestão/suporte)</option>
                                <option th:each="setor : ${setores}"
                                        th:value="${setor.id}"
                                        th:text="${setor.nome}">
                                </option>
                            </select>
                            <span class="hint" style="font-size: var(--font-size-xs); color: var(--color-muted);">Obrigatório para Operadores.</span>
                        </div>
                    </div>

                    <div class="modal-actions">
                        <button type="button" class="btn-cancel" onclick="hideForm()">Cancelar</button>
                        <button type="submit" class="btn-submit">Salvar</button>
                    </div>
                </form>
            </div>
        </div>

    </div>
</main>

<script th:src="@{/js/cadastro-usuario.js}"></script>
<script th:src="@{/js/sidebar.js}"></script>
<script th:src="@{/js/alerts.js}"></script>
</body>
</html>
