<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" th:href="@{/css/variables.css}">
  <link rel="stylesheet" th:href="@{/css/globals.css}">
  <link rel="stylesheet" th:href="@{/css/sidebar.css}">
  <link rel="stylesheet" th:href="@{/css/topbar.css}">
  <link rel="stylesheet" th:href="@{/css/components/buttons.css}">
  <link rel="stylesheet" th:href="@{/css/components/forms.css}">
  <link rel="stylesheet" th:href="@{/css/components/tables.css}">
  <link rel="stylesheet" th:href="@{/css/components/cards.css}">
  <link rel="stylesheet" th:href="@{/css/components/badges.css}">
  <link rel="stylesheet" th:href="@{/css/components/status.css}">
  <link rel="stylesheet" th:href="@{/css/components/alerts.css}">
  <link rel="stylesheet" th:href="@{/css/pages/dashboard.css}">
  <link rel="stylesheet" th:href="@{/css/pages/login.css}">
  <link rel="stylesheet" th:href="@{/css/pages/usuarios.css}">
  <link rel="stylesheet" th:href="@{/css/pages/maquinas.css}">
  <link rel="stylesheet" th:href="@{/css/pages/produtos.css}">
  <link rel="stylesheet" th:href="@{/css/pages/setores.css}">
  <link rel="stylesheet" th:href="@{/css/pages/ordens.css}">
  <link rel="stylesheet" th:href="@{/css/pages/relatorio.css}">
  <link rel="stylesheet" th:href="@{/css/pages/vidracaria.css}">
  <link rel="stylesheet" th:href="@{/css/pages/novaordem.css}">
  <link rel="stylesheet" th:href="@{/css/pages/listaordem.css}">
  <link rel="stylesheet" th:href="@{/css/utils.css}">
  <link rel="stylesheet" th:href="@{/css/responsive.css}"/>
</head>
<body class="page-usuario-cadastrousuario">

<aside class="sidebar">
  <div class="logo">LumiFlow</div>
  <div class="menu-title">GERAL</div>
  <div class="menu">
    <div class="menu-item">Dashboard</div>
    <div class="menu-item">Ordens</div>
    <div class="menu-item">Lançamentos</div>
    <div class="menu-item">Relatórios</div>
  </div>
  <div class="menu-title">CADASTROS</div>
  <div class="menu">
    <div class="menu-item">Produtos</div>
    <div class="menu-item">Setores</div>
    <div class="menu-item">Máquinas</div>
    <div class="menu-item">Roteiros</div>
    <div class="menu-item active">Usuários</div>
  </div>
  <div class="menu-title">SISTEMA</div>
  <div class="menu"><div class="menu-item">Configurações</div></div>
  <div class="profile">
    <div class="avatar">JE</div>
    <div><div class="pname">Johny</div><div class="prole">Suporte</div></div>
  </div>
</aside>

<main class="main">
  <div class="topbar">
    <span class="topbar-title">Usuários</span>
    <button class="btn-novo" onclick="showForm()">+ Novo Usuário</button>
  </div>

  <!-- MENSAGENS: um único atributo, usado por todos os fluxos (novo, editar, excluir) -->
  <div th:if="${message}" class="alert">
    <span th:text="${message}"></span>
  </div>

  <div class="content">

    <!-- LISTA -->
    <div class="lista">
      <div class="panel">
        <div class="panel-header">
          <span class="panel-title">Usuários cadastrados</span>
          <input class="search" type="text" placeholder="🔍 Buscar..."/>
        </div>
        <table>
          <thead>
          <tr>
            <th>Usuário</th>
            <th>Nível de acesso</th>
            <th>Setor</th>
            <th style="width:120px">Ações</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="usuario : ${usuarios}">
            <td th:text="${usuario.nome}"></td>

            <td th:text="${usuario.nivelAcesso.descricao}"></td>

            <td th:text="${usuario.setor != null ? usuario.setor.nome : '-'}"></td>

            <td>
              <button type="button"
                      class="btn-edit"
                      onclick="showForm()">
                Editar
              </button>

              <form th:action="@{/dashboard/usuario/{id}(id=${usuario.id})}"
                    method="post"
                    style="display:inline">

                <button type="submit"
                        class="btn-del"
                        onclick="return confirm('Tem certeza que deseja excluir este usuário?');">
                  Excluir
                </button>

              </form>
            </td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- FORMULÁRIO -->
    <div class="form-panel" id="form-panel" style="display:none">
      <form class="form-card"
            th:action="@{/dashboard/usuario}"
            th:object="${usuarioDTO}"
            method="post">
        <div class="form-title">Novo Usuário</div>

        <div class="field">
          <label>Nome completo <span>*</span></label>
          <input type="text"
                 th:field="*{nome}"
                 placeholder="Ex: Carlos Silva"/>
        </div>
        <div class="field">
          <label>Login <span>*</span></label>
          <input type="text"
                 th:field="*{login}"
                 placeholder="Ex: carlos"/>
          <span class="hint">Usado para acessar o sistema.</span>
        </div>
        <div class="field">
          <label>Senha <span>*</span></label>
          <input type="password"
                 th:field="*{senha}"
                 placeholder="Mínimo 6 caracteres"/>
        </div>
        <div class="field">
          <label>Nível de acesso <span>*</span></label>
          <select th:field="*{nivelAcesso}">
            <option value="">Selecione o nível</option>
            <option th:each="nivel : ${niveisAcesso}"
                    th:value="${nivel.id}"
                    th:text="${nivel.descricao}">

            </option>
          </select>
        </div>
        <div class="field">
          <label>Setor</label>
          <select th:field="*{setor}">
            <option value="">Nenhum (gestão/suporte)</option>
            <option th:each="setor : ${setores}"
                    th:value="${setor.id}"
                    th:text="${setor.nome}">
            </option>
          </select>
          <span class="hint">Obrigatório para Operadores.</span>
        </div>

        <div class="form-actions">
          <button type="button" class="btn-cancel" onclick="hideForm()">Cancelar</button>
          <button type="submit" class="btn-submit">Salvar</button>
        </div>
      </form>
    </div>

  </div>
</main>

<script th:src="@{/js/cadastro-usuario.js}"></script>
</body>
</html>
