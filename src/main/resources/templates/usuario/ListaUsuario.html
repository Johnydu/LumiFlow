<!DOCTYPE html>
<html lang="pt-BR" th:lang="${#locale.toLanguageTag()}" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" xmlns="http://www.w3.org/1999/html">
<head>
    <th:block th:replace="~{fragments/theme :: init}"></th:block>
    <title>Usuarios - LumiFlow</title>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" th:href="@{/css/variables.css}">
    <link rel="stylesheet" th:href="@{/css/globals.css}">
    <link rel="stylesheet" th:href="@{/css/sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/topbar.css}">
    <link rel="stylesheet" th:href="@{/css/components/buttons.css}">
    <link rel="stylesheet" th:href="@{/css/components/forms.css}">
    <link rel="stylesheet" th:href="@{/css/components/tables.css}">
    <link rel="stylesheet" th:href="@{/css/components/cards.css}">
    <link rel="stylesheet" th:href="@{/css/components/badges.css}">
    <link rel="stylesheet" th:href="@{/css/components/status.css}">
    <link rel="stylesheet" th:href="@{/css/components/alerts.css}">
    <link rel="stylesheet" th:href="@{/css/components/modal.css}">
    <link rel="stylesheet" th:href="@{/css/pages/usuarios.css}">
    <link rel="stylesheet" th:href="@{/css/utils.css}">
    <link rel="stylesheet" th:href="@{/css/error.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css}"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
          integrity="sha384-iw3OoTErCYJJB9mCa8LNS2hbsQ7M3C0EpIsO/H5+EGAkPGc6rk+V8i04oW/K5xq0"
          crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body class="page-usuario-cadastrousuario">
<div th:replace="~{fragments/messages :: alerts}"></div>

<aside th:replace="~{fragments/sidebar :: sidebar(activePage='usuario')}"></aside>

<main class="main">
    <div th:replace="~{fragments/topbar :: topbar(
    'Usuários',
    '+ Novo Usuário',
    'novoUsuarioForm'
)}"></div>

    <div class="content">

        <!-- LISTA -->
        <div class="lista csp-style-69d66e5b2e">

            <!-- FORMULÁRIO DE BUSCA CORRIGIDO -->
            <form method="get" th:action="@{/dashboard/usuario}">
                <label for="buscaUsuario"></label>
                <input type="text"
                       id="buscaUsuario"
                       name="nome"
                       th:value="${param.nome}"
                       class="search"
                       placeholder="Buscar usuário...">
            </form>

            <div class="panel">

                <div class="panel-header">

                    <span class="panel-title">
                        Usuário cadastrados
                    </span>

                    <span class="panel-count"
                          th:text="${#lists.size(usuarios) + ' usuario(s)'}">
                    </span>
                </div>

                <table>
                    <thead>
                    <tr>
                        <th>Usuário</th>
                        <th>Nível de acesso</th>
                        <th>Setor</th>
                        <th class="csp-style-465bfea3ed">Ações</th>
                    </tr>
                    </thead>
                    <tbody>

                    <tr th:each="usuario : ${usuarios}">

                        <td>
                            <div class="user-info csp-style-e2ff0fd1a7">
                                <div class="user-avatar csp-style-db9b4fb171"
                                     th:text="${#strings.substring(usuario.nome,0,1)}">
                                </div>

                                <div>
                                    <div class="user-name" th:text="${usuario.nome}"></div>
                                    <div class="num" th:text="${usuario.login}"></div>
                                </div>
                            </div>
                        </td>

                        <td>
                            <span class="nivel-tag" th:text="${usuario.nivelAcesso}"></span>
                        </td>

                        <td th:text="${usuario.setor != null ? usuario.setor : '-'}"></td>

                        <td>
                            <div class="table-actions" sec:authorize="hasRole('ADMIN')">
                                <button type="button"
                                        class="btn-edit"
                                        th:data-id="${usuario.id}"
                                        th:data-nome="${usuario.nome}"
                                        th:data-login="${usuario.login}"
                                        th:data-nivel="${usuario.nivelAcessoId}"
                                        th:data-setor="${usuario.setorId}"
                                       data-csp-action="handleEditarUsuario" data-csp-argument="element">
                                    ✏ Editar
                                </button>

                                <form th:action="@{/dashboard/usuario/{id}/excluir(id=${usuario.id})}"
                                      method="post"
                                      class="form-excluir-usuario csp-style-cccfa4560d">

                                    <input type="hidden"
                                           th:id="|csrfExcluirUsuario-${usuario.id}|"
                                           th:name="${_csrf.parameterName}"
                                           th:value="${_csrf.token}" />

                                    <button type="submit"
                                            class="btn-del"
                                           data-csp-confirm="Tem certeza que deseja excluir este usuário?">
                                        🗑 Excluir
                                    </button>
                                </form>
                            </div>
                        </td>

                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- MODAL DE CADASTRO / EDIÇÃO DE USUÁRIO -->
        <div id="form-panel" class="modal-overlay"
             sec:authorize="hasRole('ADMIN')">
            <div class="modal-box">
                <div class="modal-header">
                    <span class="modal-title" id="form-title">Novo Usuário</span>
                    <button type="button" class="modal-close" data-csp-action="hideForm">&times;</button>
                </div>

                <form th:action="@{/dashboard/usuario}"
                      th:object="${usuarioDTO}"
                      method="post">

                    <input type="hidden"
                           id="csrfUsuario"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}" />

                    <!-- Campo oculto para ID (essencial para edição) -->
                    <input type="hidden" id="usuarioId" name="id" th:field="*{id}" />

                    <div class="modal-body">
                        <div class="field csp-style-ef1f3a5dff">
                            <label for="nomeUsuario" class="csp-style-e4c9ee3efa">Nome completo <span class="csp-style-1f62937642">*</span></label>
                            <input type="text" class="csp-style-51fd58adb1"
                                   th:field="*{nome}"
                                   id="nomeUsuario"
                                   maxlength="50"
                                   placeholder="Ex: Carlos Silva" required
                                   />
                        </div>

                        <div class="field csp-style-ef1f3a5dff">
                            <label for="loginUsuario" class="csp-style-e4c9ee3efa">Login <span class="csp-style-1f62937642">*</span></label>
                            <input type="text" class="csp-style-51fd58adb1"
                                   th:field="*{login}"
                                   id="loginUsuario"
                                   maxlength="20"
                                   placeholder="Ex: carlos" required
                                   />
                            <span class="hint csp-style-e33e0ec328">Usado para acessar o sistema.</span>
                        </div>

                        <div class="field csp-style-ef1f3a5dff">
                            <label for="senhaUsuario" class="csp-style-e4c9ee3efa">Senha <span class="csp-style-1f62937642">*</span></label>
                            <input type="password" class="csp-style-51fd58adb1"
                                   th:field="*{senha}"
                                   id="senhaUsuario"
                                   minlength="8"
                                   placeholder="Min. 8 caracteres (maiúscula, minúscula e número)..."
                            />
                        </div>

                        <div class="field csp-style-ef1f3a5dff">
                            <label for="nivelAcessoUsuarioId" class="csp-style-e4c9ee3efa">Nível de acesso <span class="csp-style-1f62937642">*</span></label>
                            <select th:field="*{nivelAcessoId}" class="csp-style-51fd58adb1" id="nivelAcessoUsuarioId"
                                   >
                                <option value="">Selecione o nível</option>
                                <option th:each="nivel : ${niveisAcesso}"
                                        th:value="${nivel.id}"
                                        th:text="${nivel.descricao}">
                                </option>
                            </select>
                        </div>

                        <div class="field csp-style-ef1f3a5dff">
                            <label for="setorUsuarioId" class="csp-style-e4c9ee3efa">Setor</label>
                            <select th:field="*{setorId}" class="csp-style-51fd58adb1" id="setorUsuarioId"
                                   >
                                <option value="">Nenhum (gestão/suporte)</option>
                                <option th:each="setor : ${setores}"
                                        th:value="${setor.id}"
                                        th:text="${setor.nome}">
                                </option>
                            </select>
                            <span class="hint csp-style-e33e0ec328">Obrigatório para Operadores.</span>
                        </div>
                    </div>

                    <div class="modal-actions">
                        <button type="button" class="btn-cancel" data-csp-action="hideForm">Cancelar</button>
                        <button type="submit" class="btn-submit">Salvar</button>
                    </div>
                </form>
            </div>
        </div>

    </div>
</main>

<script th:src="@{/js/cadastro-usuario.js}"></script>
<script th:src="@{/js/sidebar.js}"></script>
<script th:src="@{/js/alerts.js}"></script>
</body>
</html>
