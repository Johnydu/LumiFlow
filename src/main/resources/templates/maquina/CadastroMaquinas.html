<!DOCTYPE html>
<html lang="pt-BR" th:lang="${#locale.toLanguageTag()}" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <th:block th:replace="~{fragments/theme :: init}"></th:block>
  <title>Maquinas - LumiFlow</title>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" th:href="@{/css/variables.css}">
  <link rel="stylesheet" th:href="@{/css/globals.css}">
  <link rel="stylesheet" th:href="@{/css/sidebar.css}">
  <link rel="stylesheet" th:href="@{/css/topbar.css}">
  <link rel="stylesheet" th:href="@{/css/components/buttons.css}">
  <link rel="stylesheet" th:href="@{/css/components/forms.css}">
  <link rel="stylesheet" th:href="@{/css/components/tables.css}">
  <link rel="stylesheet" th:href="@{/css/components/cards.css}">
  <link rel="stylesheet" th:href="@{/css/components/badges.css}">
  <link rel="stylesheet" th:href="@{/css/components/status.css}">
  <link rel="stylesheet" th:href="@{/css/components/alerts.css}">
  <!-- Componente Modal Centralizado -->
  <link rel="stylesheet" th:href="@{/css/components/modal.css}">
  <link rel="stylesheet" th:href="@{/css/utils.css}">
  <link rel="stylesheet" th:href="@{/css/pages/maquinas.css}">
  <link rel="stylesheet" th:href="@{/css/responsive.css}"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="page-maquina-cadastromaquinas">
<div th:replace="~{fragments/messages :: alerts}"></div>

<!-- SIDEBAR - MENU LATERAL           -->
<aside th:replace="~{fragments/sidebar :: sidebar(activePage='maquinas')}"></aside>
<!-- ================================ -->
<!-- CONTEÚDO PRINCIPAL               -->
<!-- ================================ -->
<main class="main">
  <div th:replace="~{fragments/topbar :: topbar(
    'Maquinas',
    '+ Nova Maquina',
    'novaMaquinaForm'
)}"></div>

  <div class="content">

    <!-- ================================ -->
    <!-- LISTA DE MÁQUINAS                -->
    <!-- ================================ -->
    <div class="lista">

      <!-- Filtro por setor via Dropdown -->
      <div class="filtros-bar csp-style-8c3010604d">
        <div class="field csp-style-9d89611fc9">
          <select id="filtroSetorSelect" class="form-control" data-csp-change="handleFiltrarSetorSelect" data-csp-argument="element">
            <option value="todos">Todos os setores</option>
            <option th:each="setor : ${setores}"
                    th:value="${setor.nome}"
                    th:text="${setor.nome}">
            </option>
          </select>
        </div>
      </div>

      <div class="panel">

        <div class="panel-header">
          <span class="panel-title">Máquinas cadastradas</span>
          <span class="panel-count"
                th:text="${#lists.size(maquinas) + ' máquinas'}">
          </span>
        </div>

        <table>
          <thead>
          <tr>
            <th>Nome da máquina</th>
            <th>Setor vinculado</th>
            <th class="csp-style-465bfea3ed">Ações</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="maquina : ${maquinas}"
              th:data-setor="${maquina.setor}">

            <td th:text="${maquina.nome}"></td>

            <td>
              <span class="setor-tag" th:text="${maquina.setor}"></span>
            </td>

            <td>
              <div class="table-actions" sec:authorize="hasAnyRole('ADMIN', 'PCP', 'SUPERVISOR')">

                <button type="button"
                        class="btn-edit"
                        th:data-id="${maquina.id}"
                        th:data-nome="${maquina.nome}"
                        th:data-setor-id="${maquina.setorId != null ? maquina.setorId : ''}"
                       data-csp-action="handleEditarMaquina" data-csp-argument="element">
                  ✏ Editar
                </button>

                <form class="csp-style-cccfa4560d"
                      th:action="@{/dashboard/maquinas/{id}/excluir(id=${maquina.id})}"
                      method="post"
                     >

                  <input type="hidden"
                         th:name="${_csrf.parameterName}"
                         th:value="${_csrf.token}" />

                  <button type="submit"
                          class="btn-del"
                         data-csp-confirm="Tem certeza que deseja excluir esta máquina?">
                    🗑 Excluir
                  </button>

                </form>
              </div>

            </td>

          </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- ================================ -->
    <!-- MODAL - NOVA / EDITAR            -->
    <!-- ================================ -->
    <div class="modal-overlay" id="form-panel"
         sec:authorize="hasAnyRole('ADMIN', 'PCP', 'SUPERVISOR')">
      <div class="modal-box csp-style-ffa089e03c">
        <div class="modal-header">
          <span class="modal-title" id="form-title">Nova Máquina</span>
          <button type="button" class="modal-close" data-csp-action="hideForm">&times;</button>
        </div>

        <form class="form-card csp-style-a46dd0bf7d"
              th:action="@{/dashboard/maquinas}"
              th:object="${maquinaDTO}"
              method="post"
             >

          <input type="hidden"
                 th:name="${_csrf.parameterName}"
                 th:value="${_csrf.token}" />

          <input type="hidden" th:field="*{id}"/>

          <div class="modal-body csp-style-dbc770e380">
            <div class="field csp-style-954c7a14fa">
              <label for="nome" class="csp-style-e4c9ee3efa">
                Nome da máquina <span class="csp-style-1f62937642">*</span>
              </label>

              <input type="text"
                     id="nome"
                     th:field="*{nome}"
                     class="form-control csp-style-51fd58adb1"
                     placeholder="Ex: Dobradeira Argus 1" required
                    />
            </div>

            <div class="field csp-style-954c7a14fa">
              <label class="csp-style-e4c9ee3efa">
                Setor vinculado <span class="csp-style-1f62937642">*</span>
              </label>

              <select th:field="*{setorId}" class="csp-style-51fd58adb1"
                     >
                <option value="">Selecione o setor</option>

                <option th:each="setor : ${setores}"
                        th:value="${setor.id}"
                        th:text="${setor.nome}">
                </option>
              </select>

              <span class="hint csp-style-94c33734c2">
                A máquina ficará disponível apenas neste setor.
              </span>
            </div>
          </div>

          <div class="modal-actions">
            <button type="button"
                    class="btn-cancel"
                   data-csp-action="hideForm">
              Cancelar
            </button>

            <button type="submit"
                    class="btn-submit">
              Salvar
            </button>
          </div>

        </form>
      </div>
    </div>

  </div>
</main>

<script th:src="@{/js/cadastro-maquinas.js}"></script>
<script th:src="@{/js/sidebar.js}"></script>
<script th:src="@{/js/alerts.js}"></script>

</body>
</html>
