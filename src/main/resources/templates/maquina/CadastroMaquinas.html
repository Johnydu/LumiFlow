<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <title>Maquinas - LumiFlow</title>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" th:href="@{/css/variables.css}">
  <link rel="stylesheet" th:href="@{/css/globals.css}">
  <link rel="stylesheet" th:href="@{/css/sidebar.css}">
  <link rel="stylesheet" th:href="@{/css/topbar.css}">
  <link rel="stylesheet" th:href="@{/css/components/buttons.css}">
  <link rel="stylesheet" th:href="@{/css/components/forms.css}">
  <link rel="stylesheet" th:href="@{/css/components/tables.css}">
  <link rel="stylesheet" th:href="@{/css/components/cards.css}">
  <link rel="stylesheet" th:href="@{/css/components/badges.css}">
  <link rel="stylesheet" th:href="@{/css/components/status.css}">
  <link rel="stylesheet" th:href="@{/css/components/alerts.css}">
  <!-- Componente Modal Centralizado -->
  <link rel="stylesheet" th:href="@{/css/components/modal.css}">
  <link rel="stylesheet" th:href="@{/css/utils.css}">
  <link rel="stylesheet" th:href="@{/css/pages/maquinas.css}">
  <link rel="stylesheet" th:href="@{/css/responsive.css}"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="page-maquina-cadastromaquinas">
<div th:replace="~{fragments/messages :: alerts}"></div>

<!-- SIDEBAR - MENU LATERAL           -->
<aside th:replace="~{fragments/sidebar :: sidebar(activePage='maquinas')}"></aside>
<!-- ================================ -->
<!-- CONTEÚDO PRINCIPAL               -->
<!-- ================================ -->
<main class="main">
  <div th:replace="~{fragments/topbar :: topbar(
    'Maquinas',
    '+ Nova Maquina',
    'novaMaquinaForm()'
)}"></div>

  <div class="content">

    <!-- ================================ -->
    <!-- LISTA DE MÁQUINAS                -->
    <!-- ================================ -->
    <div class="lista">

      <!-- Filtro por setor via Dropdown -->
      <div class="filtros-bar" style="margin-bottom: var(--space-4);">
        <div class="field" style="max-width: 300px; margin: 0;">
          <select id="filtroSetorSelect" class="form-control" onchange="handleFiltrarSetorSelect(this)">
            <option value="todos">Todos os setores</option>
            <option th:each="setor : ${setores}"
                    th:value="${setor.nome}"
                    th:text="${setor.nome}">
            </option>
          </select>
        </div>
      </div>

      <div class="panel">

        <div class="panel-header">
          <span class="panel-title">Máquinas cadastradas</span>
          <span class="panel-count"
                th:text="${#lists.size(maquinas) + ' máquinas'}">
          </span>
        </div>

        <table>
          <thead>
          <tr>
            <th>Nome da máquina</th>
            <th>Setor vinculado</th>
            <th style="width:120px">Ações</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="maquina : ${maquinas}"
              th:data-setor="${maquina.setor}">

            <td th:text="${maquina.nome}"></td>

            <td>
              <span class="setor-tag" th:text="${maquina.setor}"></span>
            </td>

            <td>
              <div class="table-actions" sec:authorize="hasAnyRole('SUPORTE', 'PCP_SUPERVISOR')">

                <button type="button"
                        class="btn-edit"
                        th:data-id="${maquina.id}"
                        th:data-nome="${maquina.nome}"
                        th:data-setor-id="${maquina.setorId != null ? maquina.setorId : ''}"
                        onclick="handleEditarMaquina(this)">
                  ✏ Editar
                </button>

                <form th:action="@{/dashboard/maquinas/{id}/excluir(id=${maquina.id})}"
                      method="post"
                      style="display:inline">

                  <input type="hidden"
                         th:name="${_csrf.parameterName}"
                         th:value="${_csrf.token}" />

                  <button type="submit"
                          class="btn-del"
                          onclick="return confirm('Tem certeza que deseja excluir esta máquina?');">
                    🗑 Excluir
                  </button>

                </form>
              </div>

            </td>

          </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- ================================ -->
    <!-- MODAL - NOVA / EDITAR            -->
    <!-- ================================ -->
    <div class="modal-overlay" id="form-panel" style="display:none"
         sec:authorize="hasAnyRole('SUPORTE', 'PCP_SUPERVISOR')">
      <div class="modal-box" style="max-width: 520px;">
        <div class="modal-header">
          <span class="modal-title" id="form-title">Nova Máquina</span>
          <button type="button" class="modal-close" onclick="hideForm()">&times;</button>
        </div>

        <form class="form-card"
              th:action="@{/dashboard/maquinas}"
              th:object="${maquinaDTO}"
              method="post"
              style="border: none; background: transparent; padding: 0; box-shadow: none;">

          <input type="hidden"
                 th:name="${_csrf.parameterName}"
                 th:value="${_csrf.token}" />

          <input type="hidden" th:field="*{id}"/>

          <div class="modal-body" style="display: flex; flex-direction: column; gap: var(--space-4);">
            <div class="field" style="display: flex; flex-direction: column; gap: 4px; margin: 0;">
              <label for="nome" style="font-size: var(--font-size-sm); font-weight: 500;">
                Nome da máquina <span style="color: var(--color-danger);">*</span>
              </label>

              <input type="text"
                     id="nome"
                     th:field="*{nome}"
                     class="form-control"
                     placeholder="Ex: Dobradeira Argus 1" required
                     style="height: var(--control-height, 38px); padding: 0 var(--space-3); border: 1px solid var(--border-strong); border-radius: var(--radius-md); background: var(--color-field); color: var(--color-text); font-size: var(--font-size-sm);"/>
            </div>

            <div class="field" style="display: flex; flex-direction: column; gap: 4px; margin: 0;">
              <label style="font-size: var(--font-size-sm); font-weight: 500;">
                Setor vinculado <span style="color: var(--color-danger);">*</span>
              </label>

              <select th:field="*{setorId}"
                      style="height: var(--control-height, 38px); padding: 0 var(--space-3); border: 1px solid var(--border-strong); border-radius: var(--radius-md); background: var(--color-field); color: var(--color-text); font-size: var(--font-size-sm);">
                <option value="">Selecione o setor</option>

                <option th:each="setor : ${setores}"
                        th:value="${setor.id}"
                        th:text="${setor.nome}">
                </option>
              </select>

              <span class="hint" style="font-size: var(--font-size-xs); color: var(--color-muted-5);">
                A máquina ficará disponível apenas neste setor.
              </span>
            </div>
          </div>

          <div class="modal-actions">
            <button type="button"
                    class="btn-cancel"
                    onclick="hideForm()">
              Cancelar
            </button>

            <button type="submit"
                    class="btn-submit">
              Salvar
            </button>
          </div>

        </form>
      </div>
    </div>

  </div>
</main>

<script th:src="@{/js/form-secure.js}"></script>
<script th:src="@{/js/cadastro-maquinas.js}"></script>
<script th:src="@{/js/sidebar.js}"></script>
<script th:src="@{/js/alerts.js}"></script>

</body>
</html>
