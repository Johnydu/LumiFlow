<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <title>LumiFlow Maquinas</title>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" th:href="@{/css/variables.css}">
  <link rel="stylesheet" th:href="@{/css/globals.css}">
  <link rel="stylesheet" th:href="@{/css/sidebar.css}">
  <link rel="stylesheet" th:href="@{/css/topbar.css}">
  <link rel="stylesheet" th:href="@{/css/components/buttons.css}">
  <link rel="stylesheet" th:href="@{/css/components/forms.css}">
  <link rel="stylesheet" th:href="@{/css/components/tables.css}">
  <link rel="stylesheet" th:href="@{/css/components/cards.css}">
  <link rel="stylesheet" th:href="@{/css/components/badges.css}">
  <link rel="stylesheet" th:href="@{/css/components/status.css}">
  <link rel="stylesheet" th:href="@{/css/components/alerts.css}">
  <link rel="stylesheet" th:href="@{/css/pages/dashboard.css}">
  <link rel="stylesheet" th:href="@{/css/pages/login.css}">
  <link rel="stylesheet" th:href="@{/css/pages/usuarios.css}">
  <link rel="stylesheet" th:href="@{/css/pages/maquinas.css}">
  <link rel="stylesheet" th:href="@{/css/pages/produtos.css}">
  <link rel="stylesheet" th:href="@{/css/pages/setores.css}">
  <link rel="stylesheet" th:href="@{/css/pages/ordens.css}">
  <link rel="stylesheet" th:href="@{/css/pages/relatorio.css}">
  <link rel="stylesheet" th:href="@{/css/pages/vidracaria.css}">
  <link rel="stylesheet" th:href="@{/css/pages/novaordem.css}">
  <link rel="stylesheet" th:href="@{/css/pages/listaordem.css}">
  <link rel="stylesheet" th:href="@{/css/utils.css}">
  <link rel="stylesheet" th:href="@{/css/responsive.css}"/>
</head>
<body class="page-maquina-cadastromaquinas">

<!-- SIDEBAR - MENU LATERAL           -->
<aside th:replace="~{fragments/sidebar :: sidebar(activePage='maquina')}"></aside>
<!-- ================================ -->
<!-- CONTEÚDO PRINCIPAL               -->
<!-- ================================ -->
<main class="main">
  <div class="topbar">
    <span class="topbar-title">Máquinas</span>
    <button class="btn-novo" onclick="novaMaquinaForm()"> Nova Máquina</button>
  </div>

  <div th:if="${message}"
       th:class="${messageType == 'success'} ? 'alert-success' : 'alert-error'">
    <span th:text="${message}"></span>
  </div>

  <div class="content">

    <!-- ================================ -->
    <!-- LISTA DE MÁQUINAS                -->
    <!-- ================================ -->
    <div class="lista">

      <!-- Filtro por setorId -->
      <div class="setor-tabs">

        <button type="button"
                class="setor-tab active"
                onclick="filtrarSetor(this, 'todos')">
          Todos
        </button>

        <button type="button"
                class="setor-tab"
                th:each="setor : ${setores}"
                th:text="${setor.nome}"
                th:attr="onclick=|filtrarSetor(this, '${setor.nome}')|">
        </button>

      </div>

      <div class="panel">
        <div class="panel-header">
          <span class="panel-title">Máquinas cadastradas</span>
          <span class="panel-count"
                th:text="${#lists.size(maquinas) + ' máquinas'}">
          </span>
        </div>

        <table>
          <thead>
          <tr>
            <th>Nome da máquina</th>
            <th>Setor vinculado</th>
            <th style="width:120px">Ações</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="maquina : ${maquinas}"
              th:data-setor="${maquina.setor}">

            <td th:text="${maquina.nome}"></td>


            <td>
       <span class="setor-tag"
             th:text="${maquina.setor}">
       </span>
            </td>

            <td>

              <button type="button"
                      class="btn-edit"
                      th:attr="onclick=|editarMaquina(
                          ${maquina.id},
                          '${maquina.nome}',
                          ${maquina.setorId != null ? maquina.setorId : 'null'}
                          )|">
              Editar
              </button>

              <form th:action="@{/dashboard/maquina/{id}/excluir(id=${maquina.id})}"
                    method="post"
                    style="display:inline">

                <button type="submit"
                        class="btn-del"
                        onclick="return confirm('Tem certeza que deseja excluir esta máquina?');">
                  Excluir
                </button>

              </form>

            </td>

          </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- ================================ -->
    <!-- FORMULÁRIO - NOVA / EDITAR       -->
    <!-- ================================ -->
    <div class="form-panel" id="form-panel" style="display:none">

      <form class="form-card"
            th:action="@{/dashboard/maquina}"
            th:object="${maquinaDTO}"
            method="post">

        <div class="form-title" id="form-title">
          Nova Máquina
        </div>

        <input type="hidden" th:field="*{id}"/>

        <div class="field">
          <label>Nome da máquina <span>*</span></label>

          <input type="text"
                 th:field="*{nome}"
                 placeholder="Ex: Dobradeira Argus 1"/>
        </div>

        <div class="field">
          <label>Setor vinculado <span>*</span></label>

          <select th:field="*{setorId}">
            <option value="">Selecione o setor</option>

            <option th:each="setor : ${setores}"
                    th:value="${setor.id}"
                    th:text="${setor.nome}">
            </option>
          </select>

          <span class="hint">
                A máquina ficará disponível apenas neste setor.
            </span>
        </div>

        <div class="form-actions">
          <button type="button"
                  class="btn-cancel"
                  onclick="hideForm()">
            Cancelar
          </button>

          <button type="submit"
                  class="btn-submit">
            Salvar
          </button>
        </div>

      </form>

    </div>
</main>

<script th:src="@{/js/cadastro-maquinas.js}"></script>
<script th:src="@{/js/sidebar.js}"></script>
<script th:src="@{/js/alerts.js}"></script>

</body>
</html>
