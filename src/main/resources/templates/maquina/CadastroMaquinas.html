<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
     xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <title>Maquinas - LumiFlow</title>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" th:href="@{/css/variables.css}">
  <link rel="stylesheet" th:href="@{/css/globals.css}">
  <link rel="stylesheet" th:href="@{/css/sidebar.css}">
  <link rel="stylesheet" th:href="@{/css/topbar.css}">
  <link rel="stylesheet" th:href="@{/css/components/buttons.css}">
  <link rel="stylesheet" th:href="@{/css/components/forms.css}">
  <link rel="stylesheet" th:href="@{/css/components/tables.css}">
  <link rel="stylesheet" th:href="@{/css/components/cards.css}">
  <link rel="stylesheet" th:href="@{/css/components/badges.css}">
  <link rel="stylesheet" th:href="@{/css/components/status.css}">
  <link rel="stylesheet" th:href="@{/css/components/alerts.css}">
  <link rel="stylesheet" th:href="@{/css/utils.css}">
  <link rel="stylesheet" th:href="@{/css/responsive.css}"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="page-maquina-cadastromaquinas">
<div th:replace="fragments/messages :: alerts"></div>

<!-- SIDEBAR - MENU LATERAL           -->
<aside th:replace="~{fragments/sidebar :: sidebar(activePage='maquinas')}"></aside>
<!-- ================================ -->
<!-- CONTEÚDO PRINCIPAL               -->
<!-- ================================ -->
<main class="main">
  <div th:replace="~{fragments/topbar :: topbar(
    'Maquinas',
    '+ Nova Maquina',
    'novaMaquinaForm()'
)}"></div>

  <div class="content">

    <!-- ================================ -->
    <!-- LISTA DE MÁQUINAS                -->
    <!-- ================================ -->
    <div class="lista">

      <!-- Filtro por setorId -->
      <div class="setor-tabs">

        <button type="button"
                class="setor-tab active"
                onclick="filtrarSetor(this, 'todos')">
          Todos
        </button>

        <button type="button"
                class="setor-tab"
                th:each="setor : ${setores}"
                th:text="${setor.nome}"
                th:data-setor-nome="${setor.nome}"
                onclick="handleFiltrarSetor(this)">
        </button>

      </div>

      <div class="panel">

        <div class="panel-header">
          <span class="panel-title">Máquinas cadastradas</span>
          <span class="panel-count"
                th:text="${#lists.size(maquinas) + ' máquinas'}">
          </span>
        </div>

        <table>
          <thead>
          <tr>
            <th>Nome da máquina</th>
            <th>Setor vinculado</th>
            <th style="width:120px">Ações</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="maquina : ${maquinas}"
              th:data-setor="${maquina.setor}">

            <td th:text="${maquina.nome}"></td>


            <td>
       <span class="setor-tag"
             th:text="${maquina.setor}">
       </span>
            </td>

            <td>
              <div class="table-actions">

                <button type="button"
                        class="btn-edit"
                        th:data-id="${maquina.id}"
                        th:data-nome="${maquina.nome}"
                        th:data-setor-id="${maquina.setorId != null ? maquina.setorId : ''}"
                        onclick="handleEditarMaquina(this)">
                   ✏ Editar
                </button>

                <form th:action="@{/dashboard/maquinas/{id}/excluir(id=${maquina.id})}"
                      method="post"
                      style="display:inline">

                  <input type="hidden"
                         th:name="${_csrf.parameterName}"
                         th:value="${_csrf.token}" />

                  <button type="submit"
                          class="btn-del"
                          onclick="return confirm('Tem certeza que deseja excluir esta máquina?');">
                    🗑 Excluir
                  </button>

                </form>
              </div>

            </td>

          </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- ================================ -->
    <!-- FORMULÁRIO - NOVA / EDITAR       -->
    <!-- ================================ -->
    <div class="form-panel" id="form-panel" style="display:none">

      <form class="form-card"
            th:action="@{/dashboard/maquinas}"
            th:object="${maquinaDTO}"
            method="post">

        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}" />

        <div class="form-title" id="form-title">
          Nova Máquina
        </div>

        <input type="hidden" th:field="*{id}"/>

        <div class="field">
          <label for="nome">Nome da máquina <span>*</span></label>

          <input type="text"
                 id="nome"
                 th:field="*{nome}"
                 class="form-control"
                 placeholder="Ex: Dobradeira Argus 1" required/>
        </div>

        <div class="field">
          <label>Setor vinculado <span>*</span></label>

          <select th:field="*{setorId}">
            <option value="">Selecione o setor</option>

            <option th:each="setor : ${setores}"
                    th:value="${setor.id}"
                    th:text="${setor.nome}">
            </option>
          </select>

          <span class="hint">
                A máquina ficará disponível apenas neste setor.
            </span>
        </div>

        <div class="form-actions">
          <button type="button"
                  class="btn-cancel"
                  onclick="hideForm()">
            Cancelar
          </button>

          <button type="submit"
                  class="btn-submit">
            Salvar
          </button>
        </div>


      </form>

    </div>
    
  </div>
</main>

<script th:src="@{/js/form-secure.js}"></script>
<script th:src="@{/js/cadastro-maquinas.js}"></script>
<script th:src="@{/js/sidebar.js}"></script>
<script th:src="@{/js/alerts.js}"></script>

</body>
</html>
