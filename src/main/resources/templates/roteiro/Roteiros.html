<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roteiros - LumiFlow</title>

    <link rel="stylesheet" th:href="@{/css/variables.css}">
    <link rel="stylesheet" th:href="@{/css/globals.css}">
    <link rel="stylesheet" th:href="@{/css/sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/topbar.css}">
    <link rel="stylesheet" th:href="@{/css/components/buttons.css}">
    <link rel="stylesheet" th:href="@{/css/components/forms.css}">
    <link rel="stylesheet" th:href="@{/css/components/tables.css}">
    <link rel="stylesheet" th:href="@{/css/components/cards.css}">
    <link rel="stylesheet" th:href="@{/css/components/badges.css}">
    <link rel="stylesheet" th:href="@{/css/components/status.css}">
    <link rel="stylesheet" th:href="@{/css/components/alerts.css}">
    <!-- Componente Modal Centralizado -->
    <link rel="stylesheet" th:href="@{/css/components/modal.css}">
    <link rel="stylesheet" th:href="@{/css/pages/roteiros.css}">
    <link rel="stylesheet" th:href="@{/css/utils.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="page-roteiro-cadastroroteiros">
<div th:replace="~{fragments/messages :: alerts}"></div>

<aside th:replace="~{fragments/sidebar :: sidebar(activePage='roteiro')}"></aside>

<main class="main">

    <div th:replace="~{fragments/topbar :: topbar(
        'Roteiros',
        '+ Novo Roteiro',
        'novoRoteiroForm()'
        )}">
    </div>

    <div th:if="${#lists.isEmpty(produtos)}" class="alert-error">
        Cadastre o módulo de produtos antes de criar roteiros.
    </div>

    <div class="content">

        <!-- FORMULÁRIO DE BUSCA DINÂMICA (AJAX) -->
        <form method="get" th:action="@{/dashboard/roteiros}" class="filter-form">
            <input type="text"
                   name="nomeProduto"
                   th:value="${param.nomeProduto}"
                   class="search"
                   placeholder="Buscar por nome ou código do produto...">
        </form>

        <!-- LISTA COM FRAGMENTO AJAX -->
        <div class="lista" th:fragment="listaRoteiros">
            <div class="panel">
                <div class="panel-header">
                    <span class="panel-title">Roteiros cadastrados</span>
                    <span class="panel-count"
                          th:text="${#lists.size(roteiros) + ' roteiro(s)'}"></span>
                </div>

                <table>
                    <thead>
                    <tr>
                        <th>Produto</th>
                        <th>Fluxo</th>
                        <th>Etapas</th>
                        <th style="width:120px">Ações</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="roteiro : ${roteiros}">
                        <td th:text="${roteiro.nomeProduto()} + ' - ' + ${roteiro.codigoProduto()}"></td>

                        <td>
                            <span th:text="${#strings.listJoin(roteiro.etapas(), ' → ')}"></span>
                        </td>

                        <td>
                            <span class="tag-maq"
                                  th:text="${roteiro.quantidadeEtapas() + ' etapa(s)'}"></span>
                        </td>

                        <td>
                            <div class="table-actions" sec:authorize="hasAnyRole('SUPORTE', 'PCP_SUPERVISOR')">
                                <button type="button"
                                        class="btn-edit"
                                        th:data-produto-id="${roteiro.produtoId()}"
                                        onclick="handleEditarRoteiro(this)">
                                    Editar
                                </button>

                                <form th:action="@{/dashboard/roteiros/{produtoId}/excluir(produtoId=${roteiro.produtoId()})}"
                                      method="post"
                                      style="display:inline">
                                    <input type="hidden"
                                           th:name="${_csrf.parameterName}"
                                           th:value="${_csrf.token}"/>

                                    <button type="submit"
                                            class="btn-del"
                                            onclick="return confirm('Tem certeza que deseja excluir este roteiro?');">
                                        Excluir
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(roteiros)}">
                        <td colspan="4" style="text-align:center;color:var(--color-muted-5)">
                            Nenhum roteiro cadastrado.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- MODAL DE CADASTRO / EDIÇÃO DE ROTEIROS -->
        <div class="modal-overlay" id="form-panel" style="display:none"
             sec:authorize="hasAnyRole('SUPORTE', 'PCP_SUPERVISOR')">
            <div class="modal-box" style="max-width: 680px;">
                <div class="modal-header">
                    <span class="modal-title" id="form-title">Novo Roteiro</span>
                    <button type="button" class="modal-close" onclick="hideForm()">&times;</button>
                </div>

                <form id="roteiro-form"
                      th:object="${roteiroDTO}"
                      th:action="@{/dashboard/roteiros}"
                      method="post">

                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}" />

                    <div class="modal-body" style="display: flex; flex-direction: column; gap: var(--space-4);">
                        <div class="field" style="display: flex; flex-direction: column; gap: 4px;">
                            <label for="produtoId" style="font-size: var(--font-size-sm); font-weight: 500;">Produto <span style="color: var(--color-danger);">*</span></label>
                            <select id="produtoId" th:field="*{produtoId}"
                                    style="height: var(--control-height, 38px); padding: 0 var(--space-3); border: 1px solid var(--border-strong); border-radius: var(--radius-md); background: var(--color-field); color: var(--color-text); font-size: var(--font-size-sm);">
                                <option value="">Selecione o produto</option>
                                <option th:each="produto : ${produtos}"
                                        th:value="${produto.id()}"
                                        th:text="${produto.nome()} + ' - ' + ${produto.codigo()}"></option>
                            </select>
                        </div>

                        <div class="field" style="display: flex; flex-direction: column; gap: 4px;">
                            <label style="font-size: var(--font-size-sm); font-weight: 500;">Fluxo de produção (Etapas) <span style="color: var(--color-danger);">*</span></label>

                            <!-- Renderiza caso já venha preenchido no binding -->
                            <div class="etapas-list" id="etapas-list" style="max-height: 220px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;">
                                <div th:each="passo, iterStat : *{passos}" class="etapa-item" style="display: flex; gap: 10px; align-items: center;">
                                    <span class="etapa-num" style="font-weight:bold; min-width: 24px;" th:text="${iterStat.index + 1} + 'º'"></span>

                                    <!-- Select de Setor -->
                                    <select th:field="*{passos[__${iterStat.index}__].setorId}" class="form-control setor-select" onchange="aoMudarSetor(this)"
                                            style="flex: 1; height: var(--control-height, 38px); padding: 0 var(--space-2); border: 1px solid var(--border-strong); border-radius: var(--radius-md); background: var(--color-field); color: var(--color-text); font-size: var(--font-size-sm);">
                                        <option value="">Selecione o setor</option>
                                        <option th:each="setor : ${setores}"
                                                th:value="${setor.id()}"
                                                th:text="${setor.nome()}"></option>
                                    </select>

                                    <!-- Select de Etapa do Setor -->
                                    <select th:field="*{passos[__${iterStat.index}__].etapaSetorId}" class="form-control etapa-setor-select"
                                            style="flex: 1; height: var(--control-height, 38px); padding: 0 var(--space-2); border: 1px solid var(--border-strong); border-radius: var(--radius-md); background: var(--color-field); color: var(--color-text); font-size: var(--font-size-sm);">
                                        <option value="">Selecione o processo...</option>
                                    </select>

                                    <div class="etapa-actions" style="display: flex; gap: 4px;">
                                        <button type="button" class="etapa-move" onclick="moverEtapa(this, -1)" style="padding: 6px 8px; border: 1px solid var(--border-strong); background: transparent; border-radius: var(--radius-sm); cursor: pointer;">↑</button>
                                        <button type="button" class="etapa-move" onclick="moverEtapa(this, 1)" style="padding: 6px 8px; border: 1px solid var(--border-strong); background: transparent; border-radius: var(--radius-sm); cursor: pointer;">↓</button>
                                        <button type="button" class="btn-del" onclick="removerEtapa(this)" style="padding: 6px 10px;">✕</button>
                                    </div>
                                </div>
                            </div>

                            <button type="button"
                                    class="btn-add-etapa"
                                    onclick="adicionarEtapa()"
                                    style="margin-top: 4px; padding: 8px; border: 1px dashed var(--border-strong); border-radius: var(--radius-md); background: transparent; color: var(--color-muted); font-size: var(--font-size-sm); cursor: pointer; text-align: center;">
                                + Adicionar etapa
                            </button>
                        </div>
                    </div>

                    <div class="modal-actions">
                        <button type="button" class="btn-cancel" onclick="hideForm()">Cancelar</button>
                        <button type="submit" class="btn-submit">Salvar</button>
                    </div>
                </form>

                <!-- Templates ocultos que o roteiros.js usa para clonar os selects dinamicamente -->
                <select id="setor-options-template" style="display:none">
                    <option value="">Selecione o setor</option>
                    <option th:each="setor : ${setores}"
                            th:value="${setor.id()}"
                            th:text="${setor.nome()}"></option>
                </select>
            </div>
        </div>
    </div>
</main>

<script th:src="@{/js/roteiros.js}"></script>
<script th:src="@{/js/sidebar.js}"></script>
<script th:src="@{/js/alerts.js}"></script>
<script th:src="@{/js/form-secure.js}"></script>

</body>
</html>
