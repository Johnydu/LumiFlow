<!DOCTYPE html>
<html lang="pt-BR" th:lang="${#locale.toLanguageTag()}" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <th:block th:replace="~{fragments/theme :: init}"></th:block>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roteiros - LumiFlow</title>

    <link rel="stylesheet" th:href="@{/css/variables.css}">
    <link rel="stylesheet" th:href="@{/css/globals.css}">
    <link rel="stylesheet" th:href="@{/css/sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/topbar.css}">
    <link rel="stylesheet" th:href="@{/css/components/buttons.css}">
    <link rel="stylesheet" th:href="@{/css/components/forms.css}">
    <link rel="stylesheet" th:href="@{/css/components/tables.css}">
    <link rel="stylesheet" th:href="@{/css/components/cards.css}">
    <link rel="stylesheet" th:href="@{/css/components/badges.css}">
    <link rel="stylesheet" th:href="@{/css/components/status.css}">
    <link rel="stylesheet" th:href="@{/css/components/alerts.css}">
    <!-- Componente Modal Centralizado -->
    <link rel="stylesheet" th:href="@{/css/components/modal.css}">
    <link rel="stylesheet" th:href="@{/css/pages/roteiros.css}">
    <link rel="stylesheet" th:href="@{/css/utils.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
          integrity="sha384-iw3OoTErCYJJB9mCa8LNS2hbsQ7M3C0EpIsO/H5+EGAkPGc6rk+V8i04oW/K5xq0"
          crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body class="page-roteiro-cadastroroteiros">
<div th:replace="~{fragments/messages :: alerts}"></div>

<aside th:replace="~{fragments/sidebar :: sidebar(activePage='roteiros')}"></aside>

<main class="main">

    <div th:replace="~{fragments/topbar :: topbar(
        'Roteiros',
        '+ Novo Roteiro',
        'novoRoteiroForm'
        )}">
    </div>

    <div th:if="${#lists.isEmpty(produtos)}" class="alert-error">
        Cadastre o módulo de produtos antes de criar roteiros.
    </div>

    <div class="content">

        <!-- FORMULÁRIO DE BUSCA DINÂMICA (AJAX) -->
        <form method="get" th:action="@{/dashboard/roteiros}" class="filter-form">
            <label for="buscaRoteiro">Buscar produto por nome ou código</label>
            <input type="text"
                   id="buscaRoteiro"
                   name="nomeProduto"
                   th:value="${param.nomeProduto}"
                   class="search"
                   placeholder="Buscar por nome ou código do produto...">
        </form>

        <!-- LISTA COM FRAGMENTO AJAX -->
        <div class="lista" th:fragment="listaRoteiros">
            <div class="panel">
                <div class="panel-header">
                    <span class="panel-title">Roteiros cadastrados</span>
                    <span class="panel-count"
                          th:text="${#lists.size(roteiros) + ' roteiro(s)'}"></span>
                </div>

                <table>
                    <thead>
                    <tr>
                        <th>Produto</th>
                        <th>Fluxo</th>
                        <th>Etapas</th>
                        <th class="csp-style-465bfea3ed">Ações</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="roteiro : ${roteiros}">
                        <td th:text="${roteiro.nomeProduto()} + ' - ' + ${roteiro.codigoProduto()}"></td>

                        <td>
                            <span th:text="${#strings.listJoin(roteiro.etapas(), ' → ')}"></span>
                        </td>

                        <td>
                            <span class="tag-maq"
                                  th:text="${roteiro.quantidadeEtapas() + ' etapa(s)'}"></span>
                        </td>

                        <td>
                            <div class="table-actions" sec:authorize="hasAnyRole('ADMIN', 'PCP', 'SUPERVISOR')">
                                <button type="button"
                                        class="btn-edit"
                                        th:data-produto-id="${roteiro.produtoId()}"
                                       data-csp-action="handleEditarRoteiro" data-csp-argument="element">
                                    Editar
                                </button>

                                <form class="csp-style-cccfa4560d"
                                      th:action="@{/dashboard/roteiros/{produtoId}/excluir(produtoId=${roteiro.produtoId()})}"
                                      method="post"
                                     >
                                    <input type="hidden"
                                           th:id="|csrfExcluirRoteiro-${roteiro.produtoId()}|"
                                           th:name="${_csrf.parameterName}"
                                           th:value="${_csrf.token}"/>

                                    <button type="submit"
                                            class="btn-del"
                                           data-csp-confirm="Tem certeza que deseja excluir este roteiro?">
                                        Excluir
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(roteiros)}">
                        <td colspan="4" class="csp-style-23258bbf2b">
                            Nenhum roteiro cadastrado.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- MODAL DE CADASTRO / EDIÇÃO DE ROTEIROS -->
        <div class="modal-overlay" id="form-panel"
             sec:authorize="hasAnyRole('ADMIN', 'PCP', 'SUPERVISOR')">
            <div class="modal-box csp-style-196a6edae9">
                <div class="modal-header">
                    <span class="modal-title" id="form-title">Novo Roteiro</span>
                    <button type="button" class="modal-close" data-csp-action="hideForm">&times;</button>
                </div>

                <form id="roteiro-form"
                      th:object="${roteiroDTO}"
                      th:action="@{/dashboard/roteiros}"
                      method="post">

                    <input type="hidden"
                           id="csrfRoteiro"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}" />

                    <div class="modal-body csp-style-dbc770e380">
                        <div class="field csp-style-ef1f3a5dff">
                            <label for="produtoId" class="csp-style-e4c9ee3efa">Produto <span class="csp-style-1f62937642">*</span></label>
                            <select id="produtoId" class="csp-style-51fd58adb1" th:field="*{produtoId}"
                                   >
                                <option value="">Selecione o produto</option>
                                <option th:each="produto : ${produtos}"
                                        th:value="${produto.id()}"
                                        th:text="${produto.nome()} + ' - ' + ${produto.codigo()}"></option>
                            </select>
                        </div>

                        <div class="field csp-style-ef1f3a5dff">
                            <label for="novaEtapaSetor" class="csp-style-e4c9ee3efa">Fluxo de produção (Etapas) <span class="csp-style-1f62937642">*</span></label>

                            <!-- Renderiza caso já venha preenchido no binding -->
                            <div class="etapas-list csp-style-3dea91b04e" id="etapas-list">
                                <div th:each="passo, iterStat : *{passos}" class="etapa-item csp-style-85aafcf831">
                                    <span class="etapa-num csp-style-195707c17f" th:text="${iterStat.index + 1} + 'º'"></span>

                                    <!-- Select de Setor -->
                                    <label th:for="|setorEtapa-${iterStat.index}|"
                                           class="visually-hidden"
                                           th:text="|Setor da etapa ${iterStat.count}|">Setor da etapa</label>
                                    <select th:id="|setorEtapa-${iterStat.index}|"
                                            th:field="*{passos[__${iterStat.index}__].setorId}" class="form-control setor-select csp-style-77b82e9aee" data-csp-change="aoMudarSetor" data-csp-argument="element"
                                           >
                                        <option value="">Selecione o setor</option>
                                        <option th:each="setor : ${setores}"
                                                th:value="${setor.id()}"
                                                th:text="${setor.nome()}"></option>
                                    </select>

                                    <!-- Select de Etapa do Setor -->
                                    <label th:for="|processoEtapa-${iterStat.index}|"
                                           class="visually-hidden"
                                           th:text="|Processo da etapa ${iterStat.count}|">Processo da etapa</label>
                                    <select th:id="|processoEtapa-${iterStat.index}|"
                                            th:field="*{passos[__${iterStat.index}__].etapaSetorId}" class="form-control etapa-setor-select csp-style-77b82e9aee"
                                           >
                                        <option value="">Selecione o processo...</option>
                                    </select>

                                    <div class="etapa-actions csp-style-d2f87c7fad">
                                        <button type="button" class="etapa-move csp-style-7ab0af9056" data-csp-action="moverEtapa" data-csp-direction="-1">↑</button>
                                        <button type="button" class="etapa-move csp-style-7ab0af9056" data-csp-action="moverEtapa" data-csp-direction="1">↓</button>
                                        <button type="button" class="btn-del csp-style-5d9a1bcc23" data-csp-action="removerEtapa" data-csp-argument="element">✕</button>
                                    </div>
                                </div>
                            </div>

                            <button type="button"
                                    class="btn-add-etapa csp-style-de911b4bb1"
                                   data-csp-action="adicionarEtapa"
                                   >
                                + Adicionar etapa
                            </button>
                        </div>
                    </div>

                    <div class="modal-actions">
                        <button type="button" class="btn-cancel" data-csp-action="hideForm">Cancelar</button>
                        <button type="submit" class="btn-submit">Salvar</button>
                    </div>
                </form>

                <!-- Templates ocultos que o roteiros.js usa para clonar os selects dinamicamente -->
                <label for="setor-options-template" class="visually-hidden">Opções de setor para novas etapas</label>
                <select id="setor-options-template" class="csp-style-6b99de8b69">
                    <option value="">Selecione o setor</option>
                    <option th:each="setor : ${setores}"
                            th:value="${setor.id()}"
                            th:text="${setor.nome()}"></option>
                </select>
            </div>
        </div>
    </div>
</main>

<script th:src="@{/js/roteiros.js}"></script>
<script th:src="@{/js/sidebar.js}"></script>
<script th:src="@{/js/alerts.js}"></script>

</body>
</html>
