<!DOCTYPE html>
<html lang="pt-BR" th:lang="${#locale.toLanguageTag()}" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <th:block th:replace="~{fragments/theme :: init}"></th:block>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Vidraçaria - LumiFlow</title>

    <!-- CSS -->
    <link rel="stylesheet" th:href="@{/css/variables.css}">
    <link rel="stylesheet" th:href="@{/css/globals.css}">
    <link rel="stylesheet" th:href="@{/css/sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/topbar.css}">
    <link rel="stylesheet" th:href="@{/css/components/buttons.css}">
    <link rel="stylesheet" th:href="@{/css/components/tabs.css}">
    <link rel="stylesheet" th:href="@{/css/components/forms.css}">
    <link rel="stylesheet" th:href="@{/css/components/tables.css}">
    <link rel="stylesheet" th:href="@{/css/components/cards.css}">
    <link rel="stylesheet" th:href="@{/css/components/badges.css}">
    <link rel="stylesheet" th:href="@{/css/components/status.css}">
    <link rel="stylesheet" th:href="@{/css/components/alerts.css}">
    <link rel="stylesheet" th:href="@{/css/pages/vidracaria.css}">
    <link rel="stylesheet" th:href="@{/css/utils.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css}"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
          integrity="sha384-iw3OoTErCYJJB9mCa8LNS2hbsQ7M3C0EpIsO/H5+EGAkPGc6rk+V8i04oW/K5xq0"
          crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body class="page-vidracaria-vidracaria">
<div th:replace="fragments/messages :: alerts"></div>

<!-- SIDEBAR -->
<aside th:replace="~{fragments/sidebar :: sidebar(activePage='vidracaria')}"></aside>

<main class="main">

    <!-- TOPBAR -->
    <div class="topbar">
        <div class="topbar-left">
            <button class="menu-toggle" data-csp-action="toggleSidebar">☰</button>
            <span class="topbar-title">Vidraçaria</span>
        </div>
    </div>

    <div class="content">

        <!-- 1. SALDO ATUAL DINÂMICO -->
        <div class="saldo-grid">
            <div class="saldo-card" th:each="s : ${saldos}">
                <div class="saldo-tipo" th:text="${s.tipoVidro}">Incolor</div>
                <div class="saldo-val"
                     th:classappend="${s.abaixoDoEstoqueMinimo} ? ' text-danger' : ' text-blue'"
                     th:text="${s.estoqueAtual}">0
                </div>
                <div class="saldo-sub">
                    chapas em estoque
                    <span th:if="${s.abaixoDoEstoqueMinimo}">⚠️</span>
                </div>
            </div>

            <div th:if="${#lists.isEmpty(saldos)}" class="csp-style-f00da6c6f0">
                Nenhuma chapa de vidro cadastrada.
            </div>
        </div>

        <!-- 2. ABAS -->
        <div class="tabs" role="tablist" aria-label="Movimentação de vidros">
            <button class="tab active" id="tab-btn-consumo" role="tab" aria-controls="tab-consumo" aria-selected="true" tabindex="0"
                    data-csp-action="showTab" data-csp-value="consumo" data-csp-argument="element">Registrar Consumo</button>
            <button class="tab entrada" id="tab-btn-entrada" role="tab" aria-controls="tab-entrada" aria-selected="false" tabindex="-1"
                    data-csp-action="showTab" data-csp-value="entrada" data-csp-argument="element">Registrar Entrada</button>

            <!-- Visível apenas para PCP, Supervisor, Gestão e Admin -->
            <button class="tab cadastro" id="tab-btn-cadastro" role="tab" aria-controls="tab-cadastro" aria-selected="false" tabindex="-1"
                    data-csp-action="showTab" data-csp-value="cadastro" data-csp-argument="element"
                    sec:authorize="hasAnyRole('ADMIN', 'SUPERVISOR', 'PCP', 'GESTAO')">+ Novo Vidro</button>
        </div>

        <!-- 3. FORMULÁRIO DE CONSUMO/SAÍDA -->
        <div id="tab-consumo" class="form-card is-visible" role="tabpanel" aria-labelledby="tab-btn-consumo">
            <form th:action="@{/dashboard/vidracaria/movimentar}" method="post">
                <input type="hidden"
                       id="csrfConsumo"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}"/>

                <!-- Define o tipo como SAIDA -->
                <input type="hidden" id="tipoMovimentacaoConsumo" name="tipoMovimentacao" value="SAIDA"/>

                <div class="card-title">Consumo de chapas de vidro</div>
                <div class="form-grid">

                    <div class="field">
                        <label for="chapaConsumo">Tipo de vidro <span>*</span></label>
                        <select id="chapaConsumo" name="chapaVidroId" required>
                            <option value="">Selecione o tipo</option>
                            <option th:each="c : ${chapas}"
                                    th:value="${c.id}"
                                    th:text="${c.tipoVidro + (c.descricao != null ? ' - ' + c.descricao : '')}">
                            </option>
                        </select>
                    </div>

                    <div class="field">
                        <label for="qtdConsumo">Quantidade <span>*</span></label>
                        <input type="number" id="qtdConsumo" name="quantidade" min="1" placeholder="0" required/>
                    </div>

                    <div class="field">
                        <label for="dataConsumo">Data e hora</label>
                        <input type="datetime-local" id="dataConsumo" name="dataHora"/>
                    </div>

                </div>

                <div class="field csp-style-2b583d7389">
                    <label for="obsConsumo">Observação</label>
                    <input type="text" id="obsConsumo" name="observacao" placeholder="Opcional..."/>
                </div>

                <div class="field">
                    <label for="operadorConsumo">Operador / Responsável <span>*</span></label>
                    <select id="operadorConsumo" name="operadorId" required>
                        <option value="">Selecione o operador...</option>
                        <option th:each="op : ${operadores}"
                                th:value="${op.id}"
                                th:text="${op.nome + (op.funcao != null ? ' - ' + op.funcao : '') + (op.setorPadraoNome != null ? ' (' + op.setorPadraoNome + ')' : '')}">
                        </option>
                    </select>
                </div>

                <div class="form-actions">
                    <button type="reset" class="btn-cancel">Cancelar</button>
                    <button type="submit" class="btn-submit active">Confirmar Consumo</button>
                </div>

            </form>
        </div>

        <!-- 4. FORMULÁRIO DE ENTRADA -->
        <div id="tab-entrada" class="form-card is-hidden" role="tabpanel" aria-labelledby="tab-btn-entrada">
            <form th:action="@{/dashboard/vidracaria/movimentar}" method="post">
                <input type="hidden"
                       id="csrfEntrada"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}"/>

                <!-- Define o tipo como ENTRADA -->
                <input type="hidden" id="tipoMovimentacaoEntrada" name="tipoMovimentacao" value="ENTRADA"/>

                <div class="card-title">Entrada de chapas de vidro</div>
                <div class="form-grid">

                    <div class="field">
                        <label for="chapaEntrada">Tipo de vidro <span>*</span></label>
                        <select id="chapaEntrada" name="chapaVidroId" required>
                            <option value="">Selecione o tipo</option>
                            <option th:each="c : ${chapas}"
                                    th:value="${c.id}"
                                    th:text="${c.tipoVidro + (c.descricao != null ? ' - ' + c.descricao : '')}">
                            </option>
                        </select>
                    </div>

                    <div class="field">
                        <label for="qtdEntrada">Quantidade recebida <span>*</span></label>
                        <input type="number" id="qtdEntrada" name="quantidade" min="1" placeholder="0" required/>
                    </div>

                    <div class="field">
                        <label for="dataEntrada">Data e hora</label>
                        <input type="datetime-local" id="dataEntrada" name="dataHora"/>
                    </div>

                </div>

                <div class="field csp-style-2b583d7389">
                    <label for="obsEntrada">Observação</label>
                    <input type="text" id="obsEntrada" name="observacao" placeholder="Ex: Nota fiscal 1234..."/>
                </div>

                <div class="field">
                    <label for="operadorEntrada">Operador / Responsável <span>*</span></label>
                    <select id="operadorEntrada" name="operadorId" required>
                        <option value="">Selecione o operador...</option>
                        <option th:each="op : ${operadores}"
                                th:value="${op.id}"
                                th:text="${op.nome + (op.funcao != null ? ' - ' + op.funcao : '') + (op.setorPadraoNome != null ? ' (' + op.setorPadraoNome + ')' : '')}">
                        </option>
                    </select>
                </div>

                <div class="form-actions">
                    <button type="reset" class="btn-cancel">Cancelar</button>
                    <button type="submit" class="btn-submit entrada">Confirmar Entrada</button>
                </div>

            </form>
        </div>

        <!-- FORM CADASTRAR NOVO VIDRO -->
        <div id="tab-cadastro" class="form-card is-hidden"
             role="tabpanel" aria-labelledby="tab-btn-cadastro"
             sec:authorize="hasAnyRole('ADMIN', 'SUPERVISOR', 'PCP', 'GESTAO')">
            <form th:action="@{/dashboard/vidracaria/cadastrar-chapa}" method="post">
                <input type="hidden"
                       id="csrfCadastroVidro"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}"/>

                <div class="card-title">Cadastrar Novo Tipo/Modelo de Vidro</div>
                <div class="form-grid">

                    <div class="field">
                        <label for="tipoVidroCadastro">Tipo de vidro <span>*</span></label>
                        <select id="tipoVidroCadastro" name="tipoVidro" required>
                            <option value="">Selecione o tipo</option>
                            <option th:each="tipo : ${T(br.com.lumiflow.entity.enums.TipoVidro).values()}"
                                    th:value="${tipo}"
                                    th:text="${tipo}">
                            </option>
                        </select>
                    </div>

                    <div class="field">
                        <label for="estoqueMinimoCadastro">Estoque Mínimo (Alerta) <span>*</span></label>
                        <input type="number" id="estoqueMinimoCadastro" name="estoqueMinimo" min="0" value="5" required/>
                    </div>

                    <div class="field">
                        <label for="descricaoCadastro">Descrição / Espessura</label>
                        <input type="text" id="descricaoCadastro" name="descricao" placeholder="Ex: Chapa 4mm - 2200x3210"/>
                    </div>

                </div>

                <div class="form-actions csp-style-a753dac283">
                    <button type="reset" class="btn-cancel">Cancelar</button>
                    <button type="submit" class="btn-submit active">Salvar Novo Vidro</button>
                </div>

            </form>
        </div>

        <!-- 5. HISTÓRICO DINÂMICO COM FILTROS (LARGURA TOTAL ABAIXO) -->
        <div class="panel csp-style-a35fd2c184" id="historico-container">
            <div class="panel-header">
                Histórico
                <span class="panel-sub">entradas e consumos</span>
            </div>

            <!-- FORMULÁRIO DE FILTROS ALINHADO EM CIMA (EM LINHA) -->
            <form id="filter-form" class="csp-style-37bf32a560">

                <div class="field csp-style-201859ab6c">
                    <label for="filtroTipoMov">Tipo de Movimentação</label>
                    <select name="tipoMovimentacao" id="filtroTipoMov" class="form-control">
                        <option value="">Todas</option>
                        <option value="ENTRADA" th:selected="${param.tipoMovimentacao == 'ENTRADA'}">Entrada</option>
                        <option value="SAIDA" th:selected="${param.tipoMovimentacao == 'SAIDA'}">Saída / Consumo
                        </option>
                    </select>
                </div>

                <div class="field csp-style-201859ab6c">
                    <label for="filtroTipoVidro">Tipo do Vidro</label>
                    <select name="tipoVidroFiltro" id="filtroTipoVidro" class="form-control">
                        <option value="">Todos os Vidros</option>
                        <option th:each="c : ${chapas}"
                                th:value="${c.tipoVidro}"
                                th:text="${c.tipoVidro}"
                                th:selected="${param.tipoVidroFiltro == c.tipoVidro}">
                        </option>
                    </select>
                </div>

                <div class="filter-actions csp-style-648149cea2">
                    <button type="button" id="btn-limpar" class="btn-cancel csp-style-cd53cd3bf6">
                        Limpar
                    </button>
                </div>
            </form>

            <!-- WRAPPER COM O FRAGMENTO PARA O AJAX -->
            <div id="tabela-historico-wrapper">
                <div th:replace="vidracaria/tabela-historico-movimentacao-vidro :: tabela"></div>
            </div>
        </div>

    </div>
</main>

<!-- SCRIPTS -->
<script th:src="@{/js/vidracaria.js}"></script>
<script th:src="@{/js/sidebar.js}"></script>
<script th:src="@{/js/alerts.js}"></script>
</body>
</html>
